# 検証対象: src/utils/card-utils.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、デッキ内カード検索・カード情報取得の共通utils。
#
# 実装コメントとの差異・補足:
# - getCardInfoFromUnifiedDB (L44-48) の detectLanguage(document) はモジュールローカル変数の
#   束縛先が無く、グローバルの `document`（DOM）を参照している。
# - getCardInfoWithLang (L130-145) の detectLanguage(document) は同名の第3引数（関数パラメータ）を
#   参照しており、上記のグローバルdocumentとは別物（シャドーイング）。
# - getCardInfoLegacy (L89-95) はJSDocに `@deprecated` とあり、ciid/deckData引数は実装上
#   完全に無視され getCardInfo(cid) に委譲するだけ（後方互換のためのラッパー）。

