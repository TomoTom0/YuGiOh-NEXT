# 検証対象: src/api/image-utils.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、API系ファイル。
# export関数8件を対象とする。非exportのgetBaseImageUrlは分岐を持たないためconditions化しない。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - getLinkMarkerClasses(-1) は「配列である」だけでなく、実装上は0..8の全ビットが立っている扱いになり
#   中央(ビット4)を除く8クラスを返す。
# - getLinkMarkerClassName(512) は「stringである」だけでなく、0..8の走査範囲外ビットのみのため
#   positionsは空になり、非0入力なので早期returnせず "link" を返す。

[meta]
feature = "image-utils"
source_file = "src/api/image-utils.ts"
