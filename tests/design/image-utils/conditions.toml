note = "verified=falseは0件"

# --- getAttributeIconUrl(attribute: string): string ---

[[condition]]
id = "attribute.empty_returns_empty"
target_function = "getAttributeIconUrl"
source_lines = "21"
description = "attributeがfalsyな場合、空文字列を返す"
given = "attribute = ''"
expect_return = ""

[[condition]]
id = "attribute.lowercase_in_url"
target_function = "getAttributeIconUrl"
source_lines = "22-23"
description = "attributeがtruthyな場合、attribute.toLowerCase()をファイル名末尾に使ってURLを返す。属性名の妥当性チェックはしない"
given = "attribute = 'DARK' または 'UNKNOWN'"
expect_return_shape = "${getBaseImageUrl()}/attribute/attribute_icon_${attribute.toLowerCase()}.png"

