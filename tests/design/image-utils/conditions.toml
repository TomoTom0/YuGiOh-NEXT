# --- getLinkMarkerClasses(linkMarkers: number): string[] ---

[[condition]]
id = "link_classes.zero_returns_empty"
target_function = "getLinkMarkerClasses"
source_lines = "82"
description = "linkMarkersがfalsyな場合、空配列を返す"
given = "linkMarkers = 0"
expect_return_shape = "[]"

[[condition]]
id = "link_classes.bits_to_classes_ascending"
target_function = "getLinkMarkerClasses"
source_lines = "84-97"
description = "i=0..8を昇順に走査し、中央i=4以外で対応ビットが立ちpositionMap[i]がtruthyなら、そのクラス名をpositionsに追加して返す"
given = "linkMarkers = 265（ビット0,3,8）"
expect_return_shape = "['i_i_1', 'i_i_4', 'i_i_9']"

[[condition]]
id = "link_classes.center_bit_ignored"
target_function = "getLinkMarkerClasses"
source_lines = "85-93"
description = "中央のi=4はビットが立っていても追加されない"
given = "linkMarkers = 16（ビット4のみ）"
expect_return_shape = "[]"

[[condition]]
id = "link_classes.outside_bits_ignored"
target_function = "getLinkMarkerClasses"
source_lines = "91-97"
description = "走査範囲はi=0..8のみのため、範囲外ビットだけが立っている非0入力では空配列を返す"
given = "linkMarkers = 512（ビット9のみ）"
expect_return_shape = "[]"

[[condition]]
id = "link_classes.negative_all_scanned_bits"
target_function = "getLinkMarkerClasses"
source_lines = "91-97"
description = "負数はビット演算上i=0..8の各対応ビットが立っている扱いになり、中央以外の全クラスを返す"
given = "linkMarkers = -1"
expect_return_shape = "['i_i_1', 'i_i_2', 'i_i_3', 'i_i_4', 'i_i_6', 'i_i_7', 'i_i_8', 'i_i_9']"

