# 検証対象: src/content/shuffle/addShuffleButtons.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、tests/README.md記載の「重要なテスト対象: シャッフル」グループ。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - addShuffleButtons.ts専用テストは存在しなかったため、新規作成した。
#
# 2026-09-03(TASK-450・1回目): カード枚数span検出を`span:nth-child(3)`から`top.lastElementChild`に変更。
# 旧実装はdeck-display/regulation-ui.tsが#main .subcatergory .topのh3直後に要素を挿入した際、
# nth-child(3)がその要素にずれてカード枚数spanを検出できなくなり、メインデッキのシャッフルボタンが
# 追加されなくなる実害のあるバグを引き起こした（実機で発見）。カード枚数spanは常にtop内の最後の
# 子要素という不変条件（shuffle/sortボタンもこのspanの直前に挿入する設計のため保たれる）を使う
# ことで、他要素の挿入位置に依存しない実装に修正した。
#
# 2026-09-03(TASK-450・2回目): createButton()がアイコンを<span>で包んでいたため、サイト側CSS
# ".subcatergory .top span:not(.icon)"（カード枚数バッジ用の紺背景+枠線+margin+min-width）が
# このspanにも波及し、ボタンのグラデーション背景の大部分が紺色の矩形で隠れてしまう実害のある
# バグを実機で発見（ユーザー指摘）。spanで包まず<a>要素に直接iconSvgをinnerHTMLとして設定する
# よう修正（<a>自体が既にdisplay:inline-flex;align-items:center;justify-content:center;を
# 持つため、中間のspanによる中央寄せは不要だった）。
#
# 2026-09-03(TASK-450・3回目): ユーザーから「デッキ編集画面と本当に同じ見た目になっているか」との
# 指摘を受け実機比較したところ、編集画面(DeckSection.vue .btn-section)はニュートラルな枠線ボタン
# （transparent背景+1px border+text-primary色）であり、こちらの.ytomo-neuron-btn（グラデーション
# 背景）とは全く異なるデザインだったと判明。createButton()のclassNameを
# 'ygo-next ygo-next-shuffle-sort-btn' に変更し、.btn-sectionと同じ見た目のCSSを新設
# （src/content/styles/buttons.scss）。アイコン自体（SHUFFLE_ICON/SORT_ICON）は変更していない。

