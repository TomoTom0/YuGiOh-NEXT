target_function = "attachButtonListener"
source_lines = "65-67"
description = "指定buttonIdが既にregisteredListenersに登録済みの場合、リスナーを追加せずfalseを返す（重複登録防止）"
given = "同じbuttonIdでattachEventListenersが2回呼ばれる状況（例：DOMContentLoadedとタイムアウト経路が両方発火）"
expect_return = "false"
verified = false
unverifiable_reason = "initShuffle()の1ライフタイム中、attachEventListenersは成功する組み合わせに対して1回しか実行されない設計（retryは未検出時のみ再帰し、成功後は再実行されない）ため、attachButtonListenerの重複登録防止分岐を外部からのテストのみで誘発する自然な経路が無い（非exportのためtest用exportの追加はソース変更を伴い見送った）"

[[condition]]
