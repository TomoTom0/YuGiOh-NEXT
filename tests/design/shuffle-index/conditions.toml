# --- initShuffle() ---

[[condition]]
id = "init_shuffle.already_initialized_skips"
target_function = "initShuffle"
source_lines = "36-38"
description = "isShuffleInitializedが既にtrueの場合、何もせずreturnする（vueSetup.tsとcontent/index.tsの両方から呼ばれても2重初期化しない）"
given = "initShuffle()を2回連続で呼ぶ"
expect_side_effect = "2回目の呼び出しではinitShuffleButtons相当の処理が実行されない"

[[condition]]
id = "init_shuffle.loading_waits_dom_content_loaded"
target_function = "initShuffle"
source_lines = "46-50"
description = "document.readyStateが'loading'の場合、DOMContentLoadedイベントを待ってからattachEventListenersとinitSortfixForCards(200ms後)を実行する"
given = "document.readyState = 'loading'"
expect_side_effect = "DOMContentLoadedイベント発火後にボタンへのイベントリスナーが登録される"

[[condition]]
id = "init_shuffle.ready_schedules_immediately"
target_function = "initShuffle"
source_lines = "51-54"
description = "document.readyStateが'loading'以外の場合、即座にsetTimeoutでattachEventListeners(150ms後)とinitSortfixForCards(200ms後)を予約する"
given = "document.readyState = 'complete'"
expect_side_effect = "150ms後にボタンへのイベントリスナーが登録される"

# --- attachButtonListener(buttonId, handler) [非export] ---

[[condition]]
