# 検証対象: src/components/TagDialog.vue
#
# 経緯:
# - TASK-551（TASK-331 Tier C第9号・TASK-544第8号の後続）。DeckMetadata系3ファイル目
#   のTagDialog（975行。script setupはL111-345、残りはtemplateとscoped CSS）。
#   既存の専用ユニットテストは無く（DeckMetadata.test.tsからstub経由で触れるのみ）、
#   tests/unit/components/TagDialog.test.tsを新規作成
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm
#
# 粒度方針（Tier C・第7号/第8号条件書と同一）:
# - 1条件=1振る舞いclass。同種入力の列挙はテスト側fixtureで持つ
# - UI操作はDOMイベント経由で検証し、vm内部状態は直接参照しない。emitは観測対象
# - props/emits定義・静的SVG/SCSSは§8「書かない」に該当するため除外
#
# 線引き（隣接条件書との）:
# - 親DeckMetadataの配線契約（TagDialogへのmodelValue/tags供給・update:modelValueの
#   store書き込みと型ガード）はdeck-metadata条件書（TASK-532）が保証。本書は
#   TagDialog自身の内部挙動（選択状態・絞り込み・emit）のみ
# - tag-master-data（classifyTagById/getMonsterTypeFromLabel/各TAG_ID_TO_*マップ）の
#   関数本体とimage-utils（getAttributeIconUrl）のURL生成本体は各モジュールの対象。
#   本書は呼び出し結果のUI反映（グループ分類・並び順・data-type・アイコンsrc）のみ
# - BaseDialog内部（v-if/Teleport/overlayクリックclose/fade）はBaseDialog側の対象。
#   本書はTagDialog側のclose emitまで
#
# 作業中に発見した到達不能分岐・不具合疑い（src不変のため別タスクへ分離）:
# - race枚数フィルタの創造神族（creatorgod）特例（L248）は、TAG_ID_TO_RACEに
#   creatorgodへ対応するタグIDが存在しないため到達不能。[[excluded]]に記録し、
#   マスタデータ側に創造神族タグが欠けている疑いとしてTASK-552へ分離起票
# - モンスター0枚時に枚数フィルタでattr/raceタグが全て表示される挙動
#   （count 0 >= totalMonsterCount 0 / 4 = 0）は現行挙動として条件化し
#   （count-filter-with-no-monsters-shows-attr-and-race）、意図確認をTASK-553へ分離起票

