# --- matchCards(query: string, cards: CardInfo[]): CardInfo[] ---

[[condition]]
id = "match_cards.name_or_ruby_case_insensitive_substring"
target_function = "matchCards"
source_lines = "5-11"
description = "query/name/rubyを小文字化し、name.includes(q)またはruby.includes(q)のどちらかがtrueのカードを返す"
given = "nameの大文字小文字違い、またはrubyのみがqueryを部分一致で含むカード"
expect_return_shape = "該当カードが入力順のまま返る"

[[condition]]
id = "match_cards.missing_name_or_ruby_empty_string"
target_function = "matchCards"
source_lines = "8-10"
description = "nameまたはrubyがnullishの場合は空文字列として扱ってincludes判定する"
given = "rubyがundefinedのカード、または実行時にnameがundefinedのカード"
expect_return_shape = "undefined側のフィールドでは一致せず、もう一方のフィールドだけで一致可否が決まる"

[[condition]]
id = "match_cards.empty_query_matches_all_cards"
target_function = "matchCards"
source_lines = "6-10"
description = "queryが空文字列の場合、String.prototype.includes('')がtrueになるため全カードが一致する"
given = "query = ''、cardsに複数件"
expect_return_shape = "全カードが入力順のまま返る"

# --- toResolution(card: CardInfo): CardResolution ---

[[condition]]
id = "to_resolution.copies_identity_fields"
target_function = "toResolution"
source_lines = "14-21"
description = "card.cardId/card.ciid/card.nameを同名フィールドへコピーし、isAmbiguous=falseを設定する"
given = "任意のCardInfo"
expect_return_shape = "{ cardId, ciid, name, isAmbiguous: false }"

