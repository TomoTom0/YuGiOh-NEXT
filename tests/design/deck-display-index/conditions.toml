# --- initDeckDisplay() ---

[[condition]]
id = "init_deck_display.uses_memory_cache_when_available"
target_function = "initDeckDisplay"
source_lines = "19-22"
description = "window.ygoNextCurrentSettingsが既に設定済みの場合、chrome.storageへの問い合わせを行わずそれを使う"
given = "window.ygoNextCurrentSettings = { theme: 'dark' }"
expect_side_effect = "chrome.storage.local.getは呼ばれない"

[[condition]]
id = "init_deck_display.fetches_from_storage_when_no_cache"
target_function = "initDeckDisplay"
source_lines = "22-31"
description = "メモリキャッシュが無い場合、chrome.storage.local.getから設定を取得しwindow.ygoNextCurrentSettingsに保存する"
given = "window.ygoNextCurrentSettingsが未設定"
expect_side_effect = "chrome.storage.local.getが呼ばれ、結果がwindow.ygoNextCurrentSettingsに設定される"

[[condition]]
id = "init_deck_display.applies_theme_from_settings"
target_function = "initDeckDisplay"
source_lines = "42-45"
description = "appSettings.themeの値でapplyTheme()を呼ぶ（未設定時は'system'をデフォルトとする）"
given = "appSettings.theme = 'dark'"
expect_side_effect = "document.documentElementのdata-ygo-next-themeが'dark'になる"

[[condition]]
id = "init_deck_display.deck_image_gets_ygo_next_class_when_present"
target_function = "initDeckDisplay"
source_lines = "52-55"
description = "#deck_imageが存在する場合、.ygo-nextクラスを追加する（カードアニメーション用）"
given = "#deck_imageがDOMに存在する"
expect_side_effect = "#deck_imageがygo-nextクラスを持つ"

[[condition]]
id = "init_deck_display.no_deck_image_skips_class_add"
target_function = "initDeckDisplay"
source_lines = "52-55"
description = "#deck_imageが存在しない場合、クラス追加処理をスキップする（エラーにはならない）"
given = "#deck_imageがDOMに存在しない"
expect_no_throw = true

[[condition]]
id = "init_deck_display.show_card_detail_true_mounts_vue"
target_function = "initDeckDisplay"
source_lines = "58-61"
description = "appSettings.showCardDetailInDeckDisplayがtrueの場合のみsetupVueAppを呼ぶ"
given = "showCardDetailInDeckDisplay: true"
expect_side_effect = "setupVueAppが呼ばれる"

[[condition]]
id = "init_deck_display.show_card_detail_false_or_missing_skips_vue_mount"
target_function = "initDeckDisplay"
source_lines = "41-61"
description = "showCardDetailInDeckDisplayがfalseまたは未設定(デフォルトfalse)の場合、setupVueAppを呼ばない"
given = "showCardDetailInDeckDisplayが未設定"
expect_side_effect = "setupVueAppは呼ばれない"

[[condition]]
id = "init_deck_display.sets_up_regulation_display_regardless_of_show_card_detail"
target_function = "initDeckDisplay"
source_lines = "63-72"
description = "showCardDetailInDeckDisplayの値（true/false/未設定のいずれ）に関わらず、regulation-ui.tsのsetupRegulationDisplay()をcard-detail-ui.tsのensureParsedDeckInfoを注入して常に呼ぶ（デッキ名のレギュレーションタグ検出は当該設定に非依存のため。TASK-450）"
given = "showCardDetailInDeckDisplayがtrue/false/未設定のいずれでも"
expect_side_effect = "setupRegulationDisplayがensureParsedDeckInfo関数を引数として呼ばれる"

[[condition]]
id = "init_deck_display.does_not_await_regulation_setup"
target_function = "initDeckDisplay"
source_lines = "63-72"
description = "setupRegulationDisplay()をawaitせず（voidで）起動する。セットアップ内のリスト更新（checkAndUpdate）はリモート取得を伴い新規install・キャッシュstale時に長時間かかりうるため、直列にawaitすると後続のカード画像サイズ適用と呼び出し元の他機能初期化（card-detail/deck-image/shuffle）まで遅延する（PR#151レビュー指摘）"
given = "setupRegulationDisplayが未完了（永続pending）"
expect_side_effect = "initDeckDisplay自体は完了し、setCardImageSize等の後続処理が実行される"

[[condition]]
id = "init_deck_display.sets_card_image_size_with_default"
target_function = "initDeckDisplay"
source_lines = "40,69"
description = "appSettings.deckDisplayCardImageSizeの値でsetCardImageSizeを呼ぶ。未設定時はデフォルト'medium'を使う"
given = "deckDisplayCardImageSizeが未設定のappSettings"
expect_side_effect = "setCardImageSizeが'medium'で呼ばれる"

