# --- applyTheme(theme) [非export] ---

[[condition]]
id = "apply_theme.system_follows_match_media"
target_function = "applyTheme"
source_lines = "95-99"
description = "theme==='system'の場合、window.matchMedia('(prefers-color-scheme: dark)')の一致有無でdata-ygo-next-theme属性を決定する"
given = "theme='system'、matchMediaがdark一致"
expect_side_effect = "document.documentElementのdata-ygo-next-themeが'dark'になる"

[[condition]]
id = "apply_theme.explicit_value_used_directly"
target_function = "applyTheme"
source_lines = "100-102"
description = "theme='system'以外の明示値の場合、そのままdata-ygo-next-theme属性に設定する（matchMediaは参照しない）"
given = "theme='dark'（matchMediaはlightの状況でも）"
expect_side_effect = "document.documentElementのdata-ygo-next-themeが'dark'になる"
