# 検証対象: src/api/deck-operations.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、API系かつデッキ作成・保存・削除を含むデータ破壊影響の大きい処理。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - 「DOMParser が不正なドキュメントを返す」としていたテストは、実際にはDOMParserではなく
#   parseDeckListが空配列を返しただけの通常成功経路だったため、説明を実装挙動に合わせて修正した。
# - 「URLSearchParams は自動的に '+' を '%20' に変換する」というコメントは不正確。
#   実装は params.toString() 後に replace(/\+/g, '%20') で明示的に変換している。
# - saveDeckInternal冒頭でmainDeck/extraDeck/sideDeckに空配列フォールバックを作るが、
#   パラメータ構築ではdeckData.mainDeck/extraDeck/sideDeckを直接参照するため、
#   これらを省略できるという前提ではテストしない。

[meta]
feature = "deck-operations"
source_file = "src/api/deck-operations.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/api/deck-operations-comprehensive.test.ts tests/unit/api/deck-operations-issued-deckcode.test.ts"
source_hash = "8add35fc091037e41121394d6478ece15192c47a"
note = "verified=falseは1件: normalize_error.falsy_emptyは非export関数内の防御的分岐だが、実装上の呼び出し元saveDeckInternalはdata.errorがtruthyの場合だけnormalizeErrorMessagesを呼ぶため公開API経由では直接検証できない"

