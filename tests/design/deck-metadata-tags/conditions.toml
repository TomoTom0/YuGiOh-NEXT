# 検証対象: src/components/DeckMetadataTags.vue
#
# 経緯:
# - TASK-554（TASK-331 Tier C第10号・TASK-551第9号の後続）。DeckMetadata系4ファイル目の
#   Tags（177行。script setupはL23-49、残りはtemplateとscoped CSS）。既存の専用ユニット
#   テストは無く（DeckMetadata.test.tsからstub経由で触れるのみ）、
#   tests/unit/components/DeckMetadataTags.test.tsを新規作成
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm TASK-554
#
# 粒度方針（Tier C・第7号〜第9号条件書と同一）:
# - 1条件=1振る舞いclass。モンスタータイプ6種（fusion/synchro/xyz/link/ritual/pendulum）の
#   個別caseはテスト側fixture表（it.each）で持ち、条件書には親条件のみ置く
# - 表示専用コンポーネントのため観測対象は描画結果（チップ数・順序・クラス・テキスト・
#   data-type）のみ。vm内部状態は直接参照しない
# - props/emits定義・静的SCSSは§8「書かない」に該当するため除外
#
# 線引き（隣接条件書との）:
# - 親DeckMetadataの配線契約（modelTags/modelCategories/tags/categoriesの供給）は
#   deck-metadata条件書（TASK-532）が保証。本書はTags自身の描画挙動のみ
# - tag-master-data（getMonsterTypeFromLabel）の関数本体は隣接モジュールの対象。
#   本書は実物を呼び出した結果のdata-type反映のみ（tag-dialog条件書と同じ線引き）
#
# 作業中に発見した不具合疑い（src不変のため別タスクへ分離）:
# - defineEmitsのremove-tag/remove-category（L33-36）はtemplateに発火経路（クリック
#   ハンドラ等）が無く一度もemitされない。親DeckMetadata.vue（L41-42）は両イベントを
#   リッスンし実装済みハンドラ（L236-252）へ接続するが発火し得ないためデッドコード。
#   チップ削除UIが存在せず、実際の削除はTagDialog/CategoryDialogの選択解除経由。
#   [[excluded]]に記録しTASK-555へ分離起票

