# 検証対象: src/composables/deck/useDeckRegulation.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、Vue composableのデッキ名タグによるリミットレギュレーション状態管理。
#
# 到達不能/実質到達不能分岐:
# - なし。内部関数はreturnオブジェクトから公開され、分岐は公開APIまたはdeckInfo/getDeckNameの
#   注入状態変更で到達可能。
#
# 2026-09-03(TASK-450) その1: 「デッキ編集画面でgenesysにしてもカードへの禁止のアイコンが残っている」
# 指摘への対応。getCardLimitOverrideはmode='genesys'の場合も以前はnull（上書き無し）を返しており、
# base.limitRegulation（OCG最新版基準で焼き込まれた値）がそのままDeckCard.vueに漏れて禁止/制限
# バッジが表示され続けていた。mode='genesys'を明示的に分岐しundefined（バッジ非表示）を返すよう
# 修正した。
#
# 2026-09-03(TASK-450) その2: 「そもそも独立にその実装があるのはおかしいのでは」指摘への対応。
# getCardLimitOverride/getCardGenesysPointの分岐ロジック本体をsrc/utils/regulation-card-badge.ts
# （デッキ閲覧画面のregulation-ui.tsと共有）へ切り出し、ここは薄い委譲になった
# （limit_override.delegates_to_shared_module / genesys_point.delegates_to_shared_module に統合）。
#
# 2026-09-03(TASK-450) その3: 「編集モードでバッジの部分を押下してregulationを閲覧モードのように
# 切り替えられるようにしたい。また、その際デッキ名も編集されるべきだ」指摘への対応。
# availableRegulations（実在版一覧、バッジクリックメニュー表示用）とsetRegulation（手動選択された
# type/yymmをデッキ名タグへ書き込む。閲覧画面の一時プレビューと異なりデッキ名自体を書き換える）を
# 追加した。

