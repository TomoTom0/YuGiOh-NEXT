id = "find_tag.no_pattern_matches_returns_null"
target_function = "findTag"
source_lines = "56-84"
description = "4パターンいずれにもマッチしない場合（タグ無し、または中央に位置するタグ）、ループを抜けてnullを返す"
given = "deckName = '青眼の白龍デッキ'、または '青眼 [GENESYS] デッキ'（中央）"
expect_return = "null"

[[condition]]
id = "find_tag.prefix_square_match"
target_function = "findTag"
source_lines = "49,60-70"
description = "先頭が'[...]'+空白/終端の場合、bracket='square', position='prefix'でマッチする"
given = "deckName = '[GENESYS-2608] 青眼の白龍デッキ'"
expect_return_shape = "{ bracket: 'square', position: 'prefix', content: 'GENESYS-2608', raw: '[GENESYS-2608]' }"

