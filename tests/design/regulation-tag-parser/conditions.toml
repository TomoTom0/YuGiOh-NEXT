# 検証対象: src/utils/regulation-tag-parser.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、デッキ名からのレギュレーションタグ抽出/置換を行うutils。
#
# 実装コメントとの差異・除外した分岐:
# - tsconfig.json で noUncheckedIndexedAccess: true が有効なため、正規表現マッチの
#   グループアクセス（match[1] 等）は TypeScript 上 string | undefined 型になり、
#   L65, L78, L91 の `if (... === undefined) continue/return` はこれを満たすためだけの
#   ガードである。TAG_PATTERNS/TAG_CONTENT_PATTERN の各キャプチャグループは正規表現上
#   必須（`?`なし）のため、マッチが成立した時点で実行時に undefined になることはなく、
#   README 2節「型システムで保証済みの分岐（TypeScriptのnarrowingで到達不能なelse等）」
#   に該当する。よって条件化していない。
# - resolveRegType() の `return null`（L29, 引数が GENESYS/GENE/OCG 以外の場合）は、
#   唯一の呼び出し元 parseContent() が事前に TAG_CONTENT_PATTERN
#   (`^(GENESYS|GENE|OCG)(?:-(\d{4}))?$/i`) でマッチした文字列のみを toUpperCase() して
#   渡すため、公開API（parseRegulationTag）経由では実行時に到達不可能。resolveRegType
#   は export されておらずテストから直接呼べないため、該当条件は verified=false とした。

[meta]
feature = "regulation-tag-parser"
source_file = "src/utils/regulation-tag-parser.ts"
verified = true
verified_at = "2026-08-28"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/regulation-tag-parser.test.ts"
source_hash = "68cc5cfc95279cdc218ee2da8f31022f5be316e0"
note = "verified=falseは1件（resolve_reg_type.other_null、非exportのため公開APIから到達不可）"

