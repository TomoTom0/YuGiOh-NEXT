# 検証対象: src/components/CategoryDialog.vue（UIコンポーネント。template L1-92、
#   script setup L94-235、scoped CSS L237-517）
# 経緯: TASK-488（条件書新設・テスト再設計）× TASK-331（Tier C展開）。
#   旧テスト21it中19itは実装非検証（prop受け渡し・定義確認系）で削除し、DOMイベント経由の
#   実挙動テストへ再設計。Filter (7+ cards) 2it（TASK-478から移植）はcovers付け替えのうえ温存。
#
# 粒度方針（Tier C・deck-edit-layout条件書と同一）:
# - script setup相当のロジック分岐（ハンドラ分岐・computed・watch副作用）を主対象とし、
#   template表示結果は簡潔に
# - UI操作はDOMイベント経由で検証する（vm内部呼び出し・vm内部状態の直接参照はしない）
#
# 線引き（use-category-matcher / category-grouping / BaseDialog との）:
# - countCardsForCategoryLabel の判定内部（name/text一致・quantity 0→1の扱い・
#   cardDB undefined読み飛ばし）は use-category-matcher 条件書
#   （tests/design/use-category-matcher/conditions.toml）の対象。
#   本書はCategoryDialogからの委譲呼び出し条件と結果のUI反映のみ
# - categories prop の生成・順序管理（value/label/groupの決定、originalIndexの本来の用途）は
#   category-grouping 側の対象。本書は渡された配列の消費のみ
# - BaseDialog 内部（v-if/Teleport/overlayクリックclose/fade）は BaseDialog 側の対象。
#   本書はCategoryDialog側の×ボタンclose emitまで
#
# 探索中の発見事項:
# - selectedGroup（五十音タブ）はダイアログ再オープン時にリセットされない
#   （watch isVisible L122-L128のリセット対象は isFilterEnabled/searchQuery のみ）。
#   条件 reopen-keeps-selected-group として現行挙動を条件化（暫定: TASK-498で仕様確認待ち。
#   確定時に本条件を見直す）
# - categories prop の originalIndex フィールド（L104）はコンポーネント内で未使用。
#   [[excluded]]に記録。フィールド掃除の要否はcategory-grouping側の整理と合わせて判断

