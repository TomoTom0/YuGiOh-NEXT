# 検証対象: src/content/session/session.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開、content残り)。
#
# 本ファイルの性質: SessionManagerクラスのインスタンス(sessionManager)をexportする形式。
# extract-ast-skeleton.tsはexport classの各メソッドを検出できるが、本ファイルは
# 「class自体はexportされず、インスタンスのみexportされる」形式(`export const sessionManager
# = new SessionManager()`)のため、AST抽出はモジュールレベルのexport関数getCgid()しか
# 検出できない(既知の限界)。SessionManagerの各メソッドについては手動で条件を記載した。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - src/content/session/__tests__/session.test.ts (216行、20テスト)は既に実装を直接importし
#   実際の分岐を検証する高品質なテストだった（ensureCgidのフォールバック・isLoggedIn・
#   saveDeckのstale ytkn再試行ロジック等）。ただしsaveDeckの「成功」パス自体のテストが
#   無く（既存4件は全て失敗/再試行シナリオ）、createDeck/deleteDeck/getDeckList/
#   issueDeckCode/getDeckLikes/isStaleYtknError/preloadNextYtknは未テストだったため、
#   本タスクで追加した。

