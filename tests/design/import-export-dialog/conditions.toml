# 検証対象: src/components/ImportExportDialog.vue（UIコンポーネント。template L1-222、
#   script setup L224-574、scoped CSS L576-1225）
# 経緯: TASK-500（Tier C第3号・条件書新設。TASK-331展開、TASK-488（category-dialog）様式踏襲）。
#   従来はE2E（tests/browser/test-import-export.cjs）のみで、unitテスト・条件書とも未存在。
#   本書はテストコード作成に先立つ設計条件書（fallback: 信頼できる要件・設計が存在しないため
#   実装を一次情報として条件を起こす。整備後は出典を要件側へ移す）。
#   初版ドラフトに対するcodex設計レビューの指摘13項目を反映済み（3条件追加・2条件拡張・
#   3条件の分割（旧id廃止→新id6件発行）・記載修正5件・excluded 2件を条件化へ移行）。
#
# 粒度方針（Tier C・category-dialog条件書と同一）:
# - script setup相当のロジック分岐（ハンドラ分岐・computed・watch副作用）を主対象とし、
#   template表示結果は簡潔に
# - UI操作はDOMイベント経由で検証する（vm内部呼び出し・vm内部状態の直接参照はしない）
# - 期待値は実装の内部状態そのものでなくUI観測可能な形（DOM描画・emit・委譲先mockの
#   呼び出し引数）で書く
#
# テスト手法（テストコード作成時に使用予定。条件のexpectはこれで観測可能な形で記載）:
# - BaseDialog実物をmountし、document.body.querySelector でTeleport先を観測
#   （CategoryDialog.test.ts方式）
# - 依存モジュールは vi.mock で差し替え: @/utils/deck-import（importDeckFromFileの戻り値制御）、
#   @/utils/deck-export（generateExportRows/exportToTXT/downloadFile/downloadDeckAsTXT）、
#   @/content/deck-recipe/createDeckRecipeImage（ImageDialog.test.tsの保留キュー方式で解決順制御）
# - FileReaderは vi.stubGlobal で差し替え（ImageDialog.test.ts方式）
# - ファイル選択は input.file-input の files を差し替えて change イベントを発火
#
# 線引き（deck-import / deck-export / create-deck-recipe-image / BaseDialog との）:
# - importDeckFromFile の内部（拡張子判定・パース・ImportResult構造）は deck-import 条件書
#   （tests/design/deck-import/conditions.toml の import_file.* 等）の対象。
#   本書は handleFileSelect からの呼び出しと戻り値のUI反映のみ
# - generateExportRows / exportToTXT / downloadFile / downloadDeckAsTXT の内部は deck-export 条件書
#   （tests/design/deck-export/conditions.toml）の対象。本書は「どの操作がどの関数にどの引数で
#   委譲するか」。なおCSV出力は downloadDeckAsCSV でなく自前の buildCustomCsv → downloadFile 経由
#   （L566）のため、CSV組み立て（buildCustomCsv・escapeCsvField・csvColumns操作）は本書の対象
# - createDeckRecipeImage の内部（引数の効果・Blob生成）は create-deck-recipe-image 条件書
#   （tests/design/create-deck-recipe-image/conditions.toml）の対象。本書はプレビュー生成の
#   固定引数での委譲・previewImageGenerationトークンによる競合ガード・loading/error状態のUI反映
# - BaseDialog内部（v-if/Teleport/overlayクリックclose/fade/theme属性反映）は [[excluded]] に記録
#   （category-dialog・load-dialog条件書のexcluded記載と同根拠）。ただしLoadDialog条件書の前例
#   （load-dialog.overlay-self-click-emits-close）と同様、このコンポーネントから観測できる
#   公開挙動（overlay自己クリックでclose）は条件化する
#
# 探索中の発見事項:
# - resetDialogのExport状態の扱い: 当初はImport状態のみのリセットで、Export状態（format・
#   includeSide・csvColumnsのON/OFFと並び替え・filenameBase）が再オープンでもすべて残る
#   挙動だった。TASK-501での仕様確認「すべて残すのがおかしい」を4項目すべてのリセットと
#   拡大解釈して全リセットを実装したが、ユーザー確認の結果、正しい仕様は「filenameBaseのみ
#   props基準で再生成し、format・Side Deck・CSV列（ON/OFF・並び替え）は前回値を保持」と
#   確定したため、実装・条件・テストを保持仕様へ修正済み。
#   reopen-keeps-export-settings（保持仕様）/ reopen-regenerates-filename-base
#   （filenameBase再生成）が現行仕様の条件
# - onColumnDrop の同一indexへのdropは旧実装では早期returnのため dragColumnIndex がnullに戻らず
#   当該ピルのdraggingクラス（半透明表示）が残っていたが、TASK-502で修正済み
#   （同一index dropでもdragColumnIndexをクリアしdraggingクラスを解除）。column-drop-noop-guards 参照
# - import失敗時（非PNG）はプレビュー領域のv-else-ifチェーン（L90-97）のいずれにも該当せず
#   プレビュー領域が空表示になる（'Preview will appear here'プレースホルダはファイル未選択時のみ）。
#   エラーメッセージ自体は別途表示されるため致命的ではないが、import-failure条件の期待値に明記
# - asキャスト3箇所（reader.result as string・blob as Blob・event.target as HTMLInputElement）は
#   プロジェクトの型安全規約（as禁止・型ガード使用）に反していたが、TASK-502で解消済み
#   （typeof stringチェック・instanceof Blobガード・isHTMLInputElement型ガード）
# - handleFileSelect内の 'インポートに失敗しました' フォールバック（L516）と if (result.deckInfo)
#   ガード（L524）は、deck-import.ts の戻り値契約（失敗時は必ずerror設定・成功時は必ずdeckInfo添付、
#   L83/L142/L223・全success:false戻り）では実経路で到達不能な防御コード。
#   設計レビューでmock差し替えによる観測が可能との指摘があり、import-failure-uses-default-error・
#   import-success-without-deckinfo-does-not-enable として条件化した（excludedからは移行済み）
# - escapeCsvField（L396-401）は deck-export.ts 側のCSVエスケープと論理が重複した実装。
#   本書ではコンポーネントローカル実装（buildCustomCsv経由）の観測として条件化するが、
#   重複解消の要否はdeck-export側の整理と合わせて判断

