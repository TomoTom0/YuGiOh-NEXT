# 検証対象: src/composables/deck/useDeckDisplayOrder.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、Vue composableの表示順序操作ロジック。
#
# 到達不能/実質到達不能分岐:
