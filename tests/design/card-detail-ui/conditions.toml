# 検証対象: src/content/deck-display/card-detail-ui.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開、content残り)。
#
# 発見したデッドコード・到達不能分岐:
# - モジュールレベルの`selectedCard`変数はファイル内のどこからも再代入されない
#   （宣言時のnullのまま）。そのため`getSelectedCard()`は常にnullを返し、
#   `updateTabContent()`のinfo/qaタブ描画分岐・`fetchFAQData()`・`renderFAQContent()`は
#   本番実行時に到達不能。また`EXTENSION_IDS.deckDisplay.cardDetailContainer`/
#   `cardInfoContent`のDOM要素はどのVueコンポーネントからも描画されておらず、
#   `initCardDetailUI()`内のタブボタンクリックリスナー登録も常に空配列に対して
#   実行される。実際のカード詳細表示はsrc/components/CardDetail.vueが
#   cardDetailStore(Pinia)を直接参照する形に移行済み。
#   技術的負債として記録: docs/dev/feature/dead-code-card-detail-ui-legacy-tab-ui.md
#   （削除するかどうかはユーザー判断待ちのため、本conditions.tomlでは
#   現状のコードに対して条件を記載し、到達不能な分岐はverified=falseとする）
#
# 既存テストの説明文・アサーションの不正確さ:
# - tests/combine/card-detail-ui-integration.test.ts は card-detail-ui.ts を
#   一切importせず、DOM/MutationObserverの一般的な振る舞いや
#   `expect(deckDetailParser.parseDeckDetail).toBeDefined()`のような
#   実質何も検証しないアサーションのみで構成されており、実装の分岐を
#   一切カバーしていない。本conditions.toml・新規テスト作成の動機となった。

