[[condition]]
id = "limit_override.ocg_effective_date_reads_cache"
target_function = "getOcgLimitOverride"
source_lines = "57-58"
description = "mode='ocg'かつeffectiveDateがtruthyでhasListがtrueの場合、forbiddenLimitedCache.getRegulation(cid, effectiveDate)の戻り値をそのまま返す"
given = "resolved = { mode: 'ocg', effectiveDate: '2026-08-01' }, hasList=true, getRegulation('cid','2026-08-01')='limited'"
expect_return = "'limited'"

