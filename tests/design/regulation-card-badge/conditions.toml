[[condition]]
id = "limit_override.none_or_ocg_latest_returns_null"
target_function = "getOcgLimitOverride"
source_lines = "54"
description = "resolved.mode='none'、またはmode='ocg'でeffectiveDateがfalsyの場合、キャッシュを参照せずnullを返す（呼び出し側の既存バッジをそのまま維持させる）"
given = "resolved.mode = 'none' または { mode: 'ocg', effectiveDate: null }"
