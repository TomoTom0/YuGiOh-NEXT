[[condition]]
id = "limit_override.list_not_in_cache_returns_null"
target_function = "getOcgLimitOverride"
source_lines = "57"
description = "mode='ocg'かつeffectiveDateがtruthyでも、forbiddenLimitedCache.hasList(effectiveDate)がfalseの場合、getRegulationを呼ばずnullを返す（APIが過去日付非対応等でリスト未取得時、全カードの制限バッジが消えるのを防ぐ）"
