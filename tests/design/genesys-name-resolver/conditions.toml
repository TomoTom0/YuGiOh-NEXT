# 検証対象: src/utils/genesys-name-resolver.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、GENESYSポイントのカード名->cid逆引きリゾルバ。
#
# 実装コメントとの差異: 無し（実装コメントは正確）。
#
# 補足:
# - matchesKindClass はモジュール内非exportヘルパー関数（L40-57）。
#   AST骨格抽出スクリプトはexport関数のみを走査するため「未カバー検出」の対象外だが、
#   README 2節の粒度基準（意味のある分岐）に該当するため人手でconditionsを書いた
#   （tests/design/README.md「Phase 1.6の知見」のforbidden-limited.ts前例を踏襲）。
#   検証はGenesysNameResolver.resolveCid()経由の間接テストで行う（直接exportされていないため）。
# - resolveCid() L113 `this.nameToCids?.get(name)` のoptional chainingは、
#   直前でthis.build()を必ず呼び出しており、build()はreturn前に必ずthis.nameToCidsを
#   設定してからthis.built=trueにする（早期returnルートも「既にnameToCidsが設定済み」の場合のみ）。
#   そのため公開APIの通常呼び出し経路ではnameToCidsがnullのままresolveCidに到達することはなく、
#   conditionとしては書いていない（型システムでの保証ではなく実装の呼び出し順序による論理的保証）。

[meta]
feature = "genesys-name-resolver"
source_file = "src/utils/genesys-name-resolver.ts"
verified = true
verified_at = "2026-08-28"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/genesys-name-resolver.test.ts"
source_hash = "a8eb7cc050694b2cfc9e8e8b4255f1258a6fa7af"
note = "verified=falseは1件（build.skip_missing_name、理由はunverifiable_reason参照）"

# --- GenesysNameResolver#build(): void ---

[[condition]]
id = "build.idempotent_no_rebuild"
target_function = "GenesysNameResolver#build"
source_lines = "73"
description = "既にthis.builtがtrueの場合は即returnし、getUnifiedCacheDB()すら呼ばれない（再スキャンしない）"
given = "buildを完了済みのresolverに対し、さらにresolveCid経由でbuildを呼ぶ"
expect_side_effect = "2回目以降はgetUnifiedCacheDB()が呼ばれない（呼び出し回数が増えない）"

[[condition]]
id = "build.skip_missing_name"
target_function = "GenesysNameResolver#build"
source_lines = "81-84"
description = "tableA.langsName.ja が無い（falsy）カードは nameToCids にも cidToKind にも登録されずスキップされる"
given = "db.getCardBasicInfo(cid) が tableA.langsName.ja を持たないカードを含む"
expect_side_effect = "そのcidはどの名前でも解決候補にならない"
verified = false
unverifiable_reason = "名前が存在しないカードは、そもそもどの文字列キーでresolveCidを呼んでも参照しようがなく（resolveCidはstring型のnameしか受け付けない）、'除外されている'ことと'そもそも参照不能'であることを公開APIだけでは区別できない。skip_missing_table_bのように「名前はあるがtableBが無いため除外される」ケースは単独候補が解決不能になることで観測できるが、名前自体が無いケースは対照実験を組めない。"

[[condition]]
id = "build.skip_missing_table_b"
target_function = "GenesysNameResolver#build"
source_lines = "81-84"
description = "tableA.langsName.ja はあるが tableB が無い（falsy）カードは nameToCids にも cidToKind にも登録されずスキップされる。cids.length===1の分岐(L117-119)はcidToKindを一切参照しないため、tableBが無くてもskipされていなければnameToCidsにname->[cid]が登録され単独候補としてcidが返るはずで、実際はnullが返ることでskip（未登録）が確認できる"
given = "唯一の候補カードがja名を持つがtableBを持たない"
expect_return = null

[[condition]]
id = "build.types_defaults_to_empty_array"
target_function = "GenesysNameResolver#build"
source_lines = "95"
description = "tableB.types が undefined の場合、cidToKindにはtypes: []として登録される（?? [] フォールバック）"
given = "同名で複数候補があり、うち1件のtableBにtypesキーが無い（cardType: 'monster'のみ）"
expect_return = "types未定義の候補のcidが、cardKindClass='effect'（extra deck型でない）として一致し返る"

[[condition]]
id = "build.groups_duplicate_names"
target_function = "GenesysNameResolver#build"
source_lines = "86-90"
description = "同名カードが複数ある場合、1件目はnameToCidsに新規配列[cid]として登録され、2件目以降は既存配列にpushされる（同名グループ化）"
given = "同じja名を持つカードが複数存在する"
expect_return_shape = "nameToCids.get(name) が全候補cidを含む配列になる（resolveCidが複数候補分岐に入ることで間接確認）"

