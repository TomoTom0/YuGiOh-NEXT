# 検証対象: src/utils/page-detector.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、URL/DOM判定によるページ種別検出utils。
#
# 実装コメントとの差異・特記事項:
# - isDeckDisplayPage は URLに ope パラメータが無い場合を「ope=1のデフォルト」として true 扱いする。
#   isDeckEditPage/isDeckListPage は ope パラメータが明示的に無いと false になる（デフォルト解釈が無い）。
#   両者は排他（ope=1とope=2は同時に真にならない）。
# - isCardSearchPage/isFAQSearchPage/isDeckSearchPage は ope パラメータを一切見ない（パスのみ判定）。
#   そのため isCardSearchPage(ope=2のURL) と isCardDetailPage(同URL) は両方 true になりうる
#   （実装上は互いに排他ではない。呼び出し側が別途 ope を見て使い分けている前提と推測される）。
#   同型のisFAQSearchPage/isDeckSearchPageも同じ性質を持つが、条件の重複を避けるため
#   isCardSearchPageを代表例として1件のみ明記する。
# - isDeckDisplayPage/isDeckEditPage/isDeckListPage/isCardSearchPage/isCardDetailPage/
#   isFAQSearchPage/isFAQDetailPage/isDeckSearchPage/isYugiohDBSite の9関数は全て
#   `const type = gameType || detectCardGameType(url)` という共通パターンを持つ
#   （gameType引数が明示された場合はURL自動判定より優先される）。この優先順位条件は
#   isDeckDisplayPageの代表例1件のみ記載し、他8関数への重複記載はしない。
# - getMyDeckCgid の `if (match && match[1])` は、正規表現 `[a-f0-9]+` が1文字以上を要求するため
#   match が非nullなら match[1] は必ず truthy になる。match[1] 単独が falsy になる分岐は
#   実質到達不能なため条件化しない（matchがnullの場合と統合して1条件として扱う）。

