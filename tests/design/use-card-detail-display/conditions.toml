# 検証対象: src/composables/useCardDetailDisplay.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、カード詳細取得→表示の共通フロー
# (getCardDetailWithCache -> setSelectedCard -> activeTab切替 -> setCardTab)
# を提供するVue composable。DeckCard, RightArea, useCardLinksで重複していたフローを統一。
#
# target_function の記述形式について（composable factory パターン）:
# 本ファイルは `export function useCardDetailDisplay()` がオブジェクト `{ showCardDetail }`
# を返す構造で、実質的なロジックは factory 内のローカル const arrow function `showCardDetail`
# にあります。extract-ast-skeleton.ts は Pinia Setup Store (defineStore()) の factory は
# 検出しますが、一般の composable factory (export function useXxx()) は未対応のため、
# export関数一覧には `useCardDetailDisplay` 1件のみが現れ、`useCardDetailDisplay#showCardDetail`
# は抽出されません。このため conditions.toml の target_function には
# `useCardDetailDisplay#showCardDetail` 形式で記載し、README Phase1.6 知見の Pinia Setup Store
# と同じ `#` 区切り形式に合わせています。スクリプト実行時の未カバー検出で
# `useCardDetailDisplay` が1件出ますが、これは上記のスクリプト側の限界であり、
# 本ファイルでは showCardDetail の条件を網羅しています。
#
# 到達不能/実質到達不能分岐:
# - L57 `fullCard.imgs ? [...fullCard.imgs] : []`: CardBase.imgs は型上必須フィールドだが、
#   API由来データに対する実行時ガードとして入っている。型システム上は到達不能だが、
#   実データでの imgs undefined を想定した防御的フォールバック（条件化せず、該当条件の
#   description で言及のみ）。
# - L53 `result?.detail?.card` のうち result のオプショナルチェーン: result は
#   getCardDetailWithCache の await 戻り値で常に定義されるため、result?. の ? は実質到達不能。
#   一方 detail?.card の detail は CardDetailCacheResult.detail が `CardDetail | null` なので
#   null の可能性があり、ここの ?. は意味を持つ（fullCard が undefined になる経路）。
# - L49-51 `if (result.isPartialFromError) console.warn(...)`: 単なる警告ログ出力であり、
#   その後の返り値・副作用・処理継続の有無に差を生まない（warn 後も fullCard の有無で
#   同じ分岐に入る）。README セクション2「ログ出力のみで挙動差なし」は条件化しない。
#
# 既知の設計上の注意点（バグではないが複雑な挙動。実装読解で判明）:
# - L55-68 の3分岐 (fullCard / fallbackCard / どちらも無し) のうち、早期returnするのは
#   「fullCard無し かつ fallbackCard無し」の最末梢のみ。それ以外の経路では必ず
#   setSelectedCard -> activeTab='card' -> (resetCardTabなら) setCardTab('info') が続く。
#   つまり「カード情報を一つも表示できない場合のみタブ切替をスキップする」設計。
# - L56-58 の fullCard ルートでの ciid 上書きは `preserveCiid && fallbackCard` の2条件が
#   両方真の場合のみ動作する。preserveCiid=true でも fallbackCard が無い場合は上書きせず
#   fullCard をそのまま使う（上書き元の ciid が無いため当然だが、呼び出し側で
#   preserveCiid=true を指定しても fallbackCard を渡さないと機能しない点に注意）。
# - L60-64 の fallbackCard ルートの preserveCiid=true 分岐では
#   `{ ...fallbackCard, imgs: [...fallbackCard.imgs], ciid: fallbackCard.ciid }` と
#   ciid に fallbackCard.ciid を再設定している（同じ値）。これは「オブジェクトを新しく作って
#   参照を分ける」意図（防御的コピー）。imgs も新しい配列インスタンスにコピー。
#   一方 preserveCiid=false の場合は fallbackCard の参照をそのまま setSelectedCard に渡す
#   （参照共有）。呼び出し側が後から cardData を変更した場合に影響範囲が変わる。
# - catch節 (L72-82) の fallbackCard 処理は L60-64 の fallbackCard ルートと同じデータ構築
#   ロジックだが、実行コンテキストが異なる（API呼び出しやそれ以降の処理で例外が飛んだ場合）。
#   例外時も正常系と同じフォールバックを提供する意図的な重複。
# - catch節で fallbackCard が無い場合は console.error のみ。deckStore.activeTab の変更も
#   setCardTab も setSelectedCard も行われない（現在の表示状態を維持）。
# - finally節 (L83-85) の endLoadingCard は showLoading=true の場合のみ呼ばれる。
#   startLoadingCard (L44) と対で、try-finally により成功/例外に関わらず必ず実行される。
#   ただし startLoadingCard 自体が try の外（直前）なので、startLoadingCard呼び出し後〜
#   tryブロック開始前に例外が飛ぶことは通常起こらない（同期呼び出しなので）。

