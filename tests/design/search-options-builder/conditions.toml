# 検証対象: src/utils/search-options-builder.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、utils残り分。
#
# 実装コメントとの差異:
# - なし（コメント自体が少なく、実装と矛盾する記述は見つからなかった）
#
# 備考:
# - L15の `SORT_ORDER_TO_API_VALUE[sortOrder] || 1` は、SortOrder型で定義済みの14キーは
#   全て非0の数値を返すため型システム上は`|| 1`側に到達しないように見えるが、sortOrderは
#   AppSettings.sortOrderとしてlocalStorageからJSON.parseされた値が渡ってくる経路があり、
#   実行時に不正な文字列が渡るとフォールバックに到達しうる（デフォルト値のフォールバックとして
#   README 2節の基準に従い書く）。
# - f.atk.exact / f.atk.unknown / f.def.exact / f.def.unknown はこの関数内では一切参照されない
#   （SearchOptions.atk/defはmin/maxのみを転記する）。分岐ではないため条件化していないが、
#   exact/unknown指定がAPI検索オプションに反映されない実装である点は留意。

[meta]
feature = "search-options-builder"
source_file = "src/utils/search-options-builder.ts"
verified = true
verified_at = "2026-08-28"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/search-options-builder.test.ts"
source_hash = "c5a4c37a79ec08ea3437bc71322e9e520af95f2e"
note = "verified=falseは0件"

