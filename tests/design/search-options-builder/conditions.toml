[[condition]]
id = "sort.known_order_maps_to_api_value"
target_function = "buildSearchOptions"
source_lines = "15"
description = "sortOrderがSORT_ORDER_TO_API_VALUEに存在するキーの場合、対応するAPI値をsortに設定する"
given = "sortOrder = 'atk_desc'"
expect_return_shape = "searchOptions.sort === 4"

[[condition]]
id = "sort.unknown_order_falls_back_to_1"
target_function = "buildSearchOptions"
source_lines = "15"
description = "sortOrderがSORT_ORDER_TO_API_VALUEに存在しない値（型上は不正だが実行時にlocalStorage経由等で渡りうる）の場合、`|| 1`によりsort=1にフォールバックする"
given = "sortOrder = 'invalid_order' として実行時に渡す（as unknown as SortOrderでテスト内キャスト）"
expect_return_shape = "searchOptions.sort === 1"

