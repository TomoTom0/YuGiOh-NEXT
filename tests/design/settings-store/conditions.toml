source_lines = "647-688"
description = "ux.rightAreaWidthが'MAX-FIT'以外の場合、幅マップ値と固定レイアウト用flex/max-width CSS変数を設定する"
given = "ux.rightAreaWidth='S'でapplyRightAreaStyles()を呼ぶ"
expect_side_effect = "--right-area-width='300px'、flex-grow='0'、flex-shrink='0'、flex-basis='300px'、max-width='none'"

