source = "TASK-654 goal 後半「dev の branch protection で当該 check を必須にする案はオーナー承認を経てから反映すること」。body 手順2 (B)・手順3"
reason = "TASK-654 (B) でありオーナーの個別承認待ち (Item 133)。(A) のPRでは設定も文書も変えない"
