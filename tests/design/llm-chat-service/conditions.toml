# --- parseToolCall(response: string): ToolCall | null ---

[[condition]]
id = "parse_tool.code_block_content_is_parsed"
target_function = "parseToolCall"
source_lines = "21-25"
description = "response.trim()後、```tool```/```json```等のコードブロックがあれば中身をtrimしてJSON候補として扱う"
given = "Cloud初回応答が '```json\\n{\"tool\":\"getDeckState\",\"args\":{}}\\n```'"
expect_return_shape = "{ name: 'getDeckState', arguments: {} } としてツール実行に進む"

[[condition]]
id = "parse_tool.non_brace_returns_null"
target_function = "parseToolCall"
source_lines = "26"
description = "コードブロック処理後のtextが'{'で始まらない場合、JSON.parseせずnullを返す"
given = "Cloud応答が '最終回答です'"
expect_return = "null"

[[condition]]
id = "parse_tool.valid_tool_and_args_returns_call"
target_function = "parseToolCall"
source_lines = "27-31"
description = "JSON.parseに成功し、parsed.toolがtruthyかつparsed.args !== undefinedの場合、{ name: parsed.tool, arguments: parsed.args }を返す"
given = "Cloud応答が '{\"tool\":\"getDeckState\",\"args\":{\"a\":1}}'"
expect_return_shape = "{ name: 'getDeckState', arguments: { a: 1 } }"

[[condition]]
id = "parse_tool.null_args_are_accepted"
target_function = "parseToolCall"
source_lines = "29-30"
description = "parsed.argsがnullでもundefinedではないため、arguments:nullとしてツール呼び出し扱いになる"
given = "Cloud応答が '{\"tool\":\"getDeckState\",\"args\":null}'"
expect_return_shape = "{ name: 'getDeckState', arguments: null } としてツール実行に進む"

[[condition]]
id = "parse_tool.missing_args_returns_null"
target_function = "parseToolCall"
source_lines = "29-35"
description = "parsed.toolがtruthyでもparsed.args === undefinedの場合、returnせず最後にnullを返す"
given = "Cloud応答が '{\"tool\":\"getDeckState\"}'"
expect_return = "null"

[[condition]]
id = "parse_tool.invalid_json_returns_null"
target_function = "parseToolCall"
source_lines = "27-35"
description = "textが'{'で始まってもJSON.parseに失敗した場合、catch後にnullを返す"
given = "Cloud応答が '{invalid json'"
expect_return = "null"

[[condition]]
id = "parse_tool.falsy_tool_returns_null"
target_function = "parseToolCall"
source_lines = "29-35"
description = "JSON.parseに成功してargsが存在しても、parsed.toolがfalsyの場合はnullを返す"
given = "Cloud応答が '{\"tool\":\"\",\"args\":{}}'"
expect_return = "null"

