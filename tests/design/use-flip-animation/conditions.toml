[[condition]]
id = "animate.horizontal_weight_1_5x"
target_function = "animateCardMoveByUUID"
source_lines = "99-102"
description = "移動距離 distance を計算する際、deltaX（横方向）には1.5倍の係数を掛ける。deltaY（縦方向）はそのまま。これにより同一のユークリッド距離でも横方向へ移動するカードの方が distance が大きく算出され、結果として duration が長くなる（design intent：横方向は視覚的に目立ちにくいため強調）"
given = "(deltaX=100, deltaY=0) のカードと (deltaX=0, deltaY=100) のカードをそれぞれ1枚ずつ含む2セクション"
expect_side_effect = "横方向カードの distance = sqrt((100*1.5)^2) = 150、縦方向カードの distance = sqrt(100^2) = 100 となり、横方向カードの方が duration が長く設定される"

[[condition]]
