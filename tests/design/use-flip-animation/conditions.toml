given = "すべてのカードが firstPositions 未登録・1px未満移動・data-uuid 無しのいずれかで allCards が空"
expect_return = "undefined（早期return）"
expect_side_effect = "requestAnimationFrame・setTimeout のいずれもスケジュールされない"

[[condition]]
