# 検証対象: src/composables/deck/useFLIPAnimation.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330（Tier B展開）、FLIP（First, Last, Invert, Play）テクニックによる
# カード移動アニメーションを担うcomposable。
#
# 到達不能/実質到達不能分岐:
# - animateCardMoveByUUID line 92 の `if (first && last)` は `first` と `last` を
#   ともに truthy チェックしているが、`last = cardElement.getBoundingClientRect()`
#   は DOM 仕様上常に DOMRect を返すため falsy にならない（JSDOM のモックで
#   undefined を返すように細工した場合のみ到達可能）。実DOMでは実質到達不能だが、
#   `first` 側は firstPositions に UUID が未登録の場合 undefined になり得るため、
#   実質的に `first` のためのガードとして機能している。条件としては first の
#   未登録ケース（line 89 の firstPositions.get(uuid) が undefined を返す）として
#   扱う。
#
# 既知の設計上の注意点（バグではないが複雑な挙動。実装読解で判明）:
# - duration 計算式（baseDuration=300, maxDuration=600, distanceFactor=sqrt(distance)*12）が
#   line 121-124（requestAnimationFrame コールバック内で各要素に設定する transition）と
#   line 132-137（setTimeout の待機時間用 maxDuration）で**重複定義**されている。
#   定数化されていないため、将来どちらか片方だけ修正すると要素の transition 時間と
#   setTimeout のクリーンアップ時間が食い違うバグを生む可能性がある。
# - 横方向（deltaX）のみ 1.5 倍の重み付け（line 101）。縦方向（deltaY）はそのまま。
#   そのため同一のユークリッド距離でも「横方向へ移動するカード」の方が distance が
#   大きく算出され、duration が長くなる（design intent だが非対称性に注意）。
# - line 112 の `if (allCards.length === 0) return;` ガードが無いと、直後の
#   `Math.max(...allCards.map(...))`（line 132）が空配列を展開して -Infinity を返し、
#   `setTimeout(..., -Infinity)` が即時実行されてしまう。このガードは
#   アニメーション対象が1枚も無い場合の早期return と、Math.max の -Infinity 回避を
#   兼ねている。
# - line 114 の `document.body.getBoundingClientRect();` は戻り値を使用せず捨てている。
#   コメントも無く一見無意味だが、直前の transform 設定（line 104-106）で書き込んだ
#   スタイル変更後に DOM を再計算（force reflow）して `last` の取得（line 90 で
#   取得済みだが transform 設定前の座標）を確定させる意図と推測される。ただし
#   `last` は line 90 で取得済みのため、この reflow の実効性は実装からは読み取れない。
# - line 40, 85 で `(card as HTMLElement)` の `as` キャストを使用している
#   （プロジェクトの `as` キャスト禁止ルールに対する違反。type-guards未使用。
#   本 conditions.toml の対象外だが設計上の注意点として記録）。
# - useDeckEditStore() から取得した `isLoadingDeck`（Pinia の ref<boolean>）は、
#   ストア経由でアクセスすると自動 unwrap されて boolean として評価される
#   （Pinia の仕様）。テスト時はストアをモックして isLoadingDeck の値を制御する必要がある。

[meta]
feature = "use-flip-animation"
source_file = "src/composables/deck/useFLIPAnimation.ts"
verified = true
verified_at = "2026-08-07"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/composables/useFLIPAnimation.test.ts"
source_hash = "43f8caedeb626ad877abdbdaea5b6fbc530fd7f3"
note = "verified=falseは0件。テストファイル（tests/unit/composables/useFLIPAnimation.test.ts）は TASK-330 で process.exit() を使う独自ランナー形式から Vitest の describe/it 形式へリライトし、vitest.config.ts の exclude リストから除外済み。これにより Pinia の setup（tests/setup.ts + beforeEach で setActivePinia(createPinia())）を通じて isLoadingDeck=true のスキップ分岐も検証可能になった。"

# --- recordAllCardPositionsByUUID() ---

[[condition]]
id = "record.empty_section_skipped"
target_function = "recordAllCardPositionsByUUID"
source_lines = "35-36"
description = "main/extra/side/trash 各セクションについて `.${section}-deck .card-grid` を querySelector で検索し、該当要素が存在しない場合は forEach 内の早期return でそのセクションをスキップする（Map への追加は行われない）"
given = "DOM 上に `.main-deck .card-grid` 等のセクション要素が一切存在しない"
expect_return = "空のMap（size=0）が返る"

[[condition]]
id = "record.card_without_data_uuid_ignored"
target_function = "recordAllCardPositionsByUUID"
source_lines = "40-43"
description = "セクション内の `.deck-card` 要素のうち `data-uuid` 属性を持たないものは `if (uuid)` で弾かれ、Map へ追加されない（位置記録対象外）"
given = "`.deck-card` 要素のうち一部が `data-uuid` 属性を持たない"
expect_return = "data-uuid を持つカードのみが Map のキーとなる（data-uuid 無しのカードは含まれない）"

[[condition]]
id = "record.records_uuid_to_domrect_across_all_four_sections"
target_function = "recordAllCardPositionsByUUID"
source_lines = "30-48"
description = "main/extra/side/trash の4セクションを順に走査し、各 `.deck-card` の `data-uuid` をキー・`getBoundingClientRect()` の戻り値（DOMRect）を値としてMapへ格納する。複数セクションにまたがるカードをすべて1つのMapに統合する"
given = "main/extra/side/trash 各セクションに data-uuid を持つ .deck-card が存在する"
expect_return = "全セクションのカードが1つのMapに統合された状態で返る（size は全カード合計数）"

