given = "allCards に複数の移動対象カードが含まれる"
expect_side_effect = "maxDuration 経過後に各要素の style.transition・style.transform・style.zIndex がすべて '' にリセットされる"

[[condition]]
id = "animate.max_duration_uses_same_formula_as_per_card"
target_function = "animateCardMoveByUUID"
source_lines = "132-137"
description = "setTimeout の待機時間 maxDuration は `Math.max(...allCards.map(d => Math.min(600, 300+sqrt(d.distance)*12)))` で計算される。requestAnimationFrame 内で各要素に設定する duration と**同一の計算式**を使用（重複定義）。そのため maxDuration は常に最大の per-card duration と一致する"
given = "allCards に distance の異なる複数カード（それぞれ duration=314ms, 450ms, 600ms と算出される）が含まれる"
expect_side_effect = "maxDuration は 600 となり、setTimeout は 600ms 後に実行される"
