[[condition]]
id = "animate.duration_clamped_to_300_600ms"
target_function = "animateCardMoveByUUID"
source_lines = "121-124"
description = "各カードの duration は `Math.min(600, 300 + sqrt(distance) * 12)` で計算される。下限は実質300ms（distance=0 で 300）、上限は600msにクランプされる。distance は横方向1.5倍重み付け済みの値"
given = "(A) distance が非常に小さいカード（例: 1px移動→distance≈1.5）と (B) distance が非常に大きいカード（例: 10000px移動→distance≈1500）を含む"
expect_side_effect = "(A) の duration は 300+sqrt(1.5)*12 ≈ 314ms、(B) の duration は 600ms（上限クランプ）"

[[condition]]
