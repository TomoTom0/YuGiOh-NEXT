# 検証対象: src/services/llm/nano-pipeline.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、非同期処理・外部I/O系サービス。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 実装上の注意:
# - parseToolCallは `/\{[\s\S]*?\}/` で最初のJSON風部分を非貪欲に抽出するため、
#   `{"tool":"x","args":{"a":1}}` のようなネストしたargsオブジェクトは途中で切れてJSON.parseに失敗する。
#   これは到達不能ではなく、実装どおりの挙動として条件化しテストで固定する。

[meta]
feature = "nano-pipeline"
source_file = "src/services/llm/nano-pipeline.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/services/llm/nano-pipeline.test.ts"
source_hash = "19dc565a6d41e70028d0d29b8358d1c6e1fea071"
note = "verified=falseは1件: collect_names.skips_non_tool_message（非export関数で、runNanoPipeline内の呼び出し元は常にrole='tool'のみを渡すため公開APIから片側の状態を作れない）"

# --- parseToolCall(response: string): ToolCall | null ---

[[condition]]
id = "parse_tool.code_block_content_is_parsed"
target_function = "parseToolCall"
source_lines = "87-99"
description = "レスポンス全体をtrimした後、```tool```または```json```等のコードブロックがあれば中身をtrimしてからツールJSON抽出を行う"
given = "response = '```json\\n{\"tool\":\"getDeckState\"}\\n```'"
expect_return_shape = "{ name: 'getDeckState', arguments: {} }"

[[condition]]
id = "parse_tool.valid_tool_without_args_defaults_empty"
target_function = "parseToolCall"
source_lines = "93-99"
description = "抽出したJSONのtoolがtruthyな文字列でargsが未指定の場合、argumentsは空オブジェクトになる"
given = "response = '{\"tool\":\"getDeckState\"}'"
expect_return_shape = "{ name: 'getDeckState', arguments: {} }"

[[condition]]
id = "parse_tool.no_json_returns_null"
target_function = "parseToolCall"
source_lines = "93-94,103"
description = "レスポンス内に `{...}` 形式の部分が見つからない場合はnullを返す"
given = "response = '最終回答です'"
expect_return = "null"

[[condition]]
id = "parse_tool.invalid_or_nested_json_returns_null"
target_function = "parseToolCall"
source_lines = "93-103"
description = "抽出した文字列がJSON.parseできない場合はcatch後にnullを返す。非貪欲な抽出により、ネストしたargsオブジェクトを含むツールJSONも途中で切れてこの分岐に入る"
given = "response = '{\"tool\":\"getCardDetail\",\"args\":{\"cardId\":\"1\"}}'"
expect_return = "null"

[[condition]]
id = "parse_tool.tool_not_truthy_string_returns_null"
target_function = "parseToolCall"
source_lines = "96-103"
description = "JSON.parseに成功してもtoolが存在しない、空文字列、または文字列以外の場合はnullを返す"
given = "response = '{\"tool\":\"\"}' または '{\"tool\":123}'"
expect_return = "null"

