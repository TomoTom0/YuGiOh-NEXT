# --- buildRegulationTagOptions(available, isGenesysEnabled) ---
# 2026-09-03(TASK-450) その2: 「長い日本語で選択肢を示す必要はない」指摘への対応でラベル書式変更。
# 最新版は型名のみ（例: "OCG"）、過去版は実際のデッキ名タグ構文に合わせた"型名-YYMM"
# （例: "OCG-2607"）にした（以前は"OCG 2026年07月版"のような長い日本語表記だった）。

[[condition]]
id = "build_regulation_tag_options.genesys_disabled_excludes_genesys"
target_function = "buildRegulationTagOptions"
source_lines = "60-67, 75-81"
description = "isGenesysEnabled=falseの場合、GENESYS最新版・GENESYS過去版のいずれもオプションに含めない"
given = "isGenesysEnabled = false"
expect_return_shape = "全要素のtypeが'ocg'"

[[condition]]
id = "build_regulation_tag_options.order_and_labels"
target_function = "buildRegulationTagOptions"
source_lines = "64-81"
description = "OCG最新版→GENESYS最新版→OCG過去版(新しい順)→GENESYS過去版(新しい順)の順でオプションを構築し、各labelは最新版なら型名のみ（'OCG'/'GENESYS'）、過去版なら'{型名}-{YYMM}'形式（例: 'OCG-2607'）になる"
given = "available.ocgDates/genesysListParams に複数件、isGenesysEnabled=true"
expect_return_shape = "[{type:'ocg',yymm:null,label:'OCG'}, {type:'genesys',yymm:null,label:'GENESYS'}, ...OCG過去版(降順、label='OCG-YYMM'), ...GENESYS過去版(降順、label='GENESYS-YYMM')]"

[[condition]]
id = "build_regulation_tag_options.empty_available_returns_latest_only"
target_function = "buildRegulationTagOptions"
source_lines = "69-81"
description = "available.ocgDates/genesysListParamsが両方空の場合、最新版2件のオプションのみ返す"
given = "available = { ocgDates: [], genesysListParams: [] }, isGenesysEnabled = true"
expect_return_shape = "[{type:'ocg',yymm:null,label:'OCG'}, {type:'genesys',yymm:null,label:'GENESYS'}]"

