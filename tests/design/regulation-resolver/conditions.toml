# 検証対象: src/utils/regulation-resolver.ts
#
# TASK-346: デッキ名タグから適用すべきリミットレギュレーションを解決する純粋関数。
# resolveClosest で実在一覧が空の場合、YYMMから計算した値を返し ensureList に取得を試行させる。
#
# 到達不能/実質到達不能分岐:
# - resolveClosest内 `const oldest = sorted[0]`:
#   forループでavailableDatesが空の場合は早期return nullしており、
#   かつsorted = [...available].sort() は空配列をfilterした結果の非空配列しか
#   受け取らないため、sorted[0]がundefinedになることはない（実質到達不能）。
#
# 2026-09-03(TASK-450) その1: ocgDateToYymm/genesysListParamToYymmをexportし、
# buildRegulationTagOptions(available, isGenesysEnabled)を追加。実在する版一覧から
# デッキ名タグの選択肢一覧を構築するロジックを、デッキ編集画面のタグ入力補完
# （useDeckRegulationTagSuggestions.ts）とバッジクリックメニュー（DeckEditTopBar.vue）の
# 両方から共通利用できるよう一元化した（同種のリスト構築ロジックが複数箇所に
# 独立して書かれるのを避けるため）。
#
# 2026-09-03(TASK-450) その2: 「長い日本語で選択肢を示す必要はない。また、過去版を示す場合も
# 2年単位->それぞれというように二段階のまとめにしたい」指摘への対応。yymmToOcgDate/
# yymmToGenesysListParamをexportし、buildRegulationTagOptionsのラベル書式を短縮
# （型名のみ/型名-YYMM）、groupRegulationTagOptionsByYearPairを追加。
# regulation-ui.ts（閲覧画面）の手動切替メニューもbuildRegulationTagOptionsを使うよう
# 統合した（3箇所目の独立実装を回避）。

[meta]
feature = "regulation-resolver"
source_file = "src/utils/regulation-resolver.ts"
verified = true
verified_at = "2026-09-03"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/regulation-resolver.test.ts"
source_hash = "26038abd6b3b94e16b699f45758719700706bd8c"
note = "TASK-346でresolveClosestがnullを返した際の挙動を修正。TASK-450でbuildRegulationTagOptions/groupRegulationTagOptionsByYearPair追加"

