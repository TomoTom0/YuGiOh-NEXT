description = "OCGタグのYYMMが最古の実在より前の場合、最古版にフォールバックする"
given = "deckName = '[OCG-2001] デッキ', available.ocgDates = ['2024-10-01', '2025-01-01']"
expect_return_shape = "{ mode: 'ocg', effectiveDate: '2024-10-01', fallback.reason: 'not-exist' }"

[[condition]]
id = "resolve.ocg_yymm_empty_available_returns_computed_date"
target_function = "resolveDeckRegulation"
