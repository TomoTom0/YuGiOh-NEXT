# --- GenesysPointCache#reresolveLocal(entry): Promise<GenesysListEntry | null> (private, TASK-470) ---
#
# 背景: 新規インストール直後はカードDB(UnifiedCacheDB)が空で、GENESYS外部リストの
# 名前解決が全滅しincomplete:trueとしてキャッシュされる。カードDBは閲覧のたびに
# 逐次充実するが、それを検知して再解決する仕組みが無かった。外部fetch直後の生データ
# (RawGenesysEntry[])をGenesysListEntry.rawEntriesとして保持し、incompleteな
# エントリを外部fetch無しでローカル再解決できるようにする。

[[condition]]
id = "reresolve_local.no_raw_entries_falls_back_to_fetch"
target_function = "GenesysPointCache#reresolveLocal"
source = "tm TASK-470 body: 修正方針1・2、確定した実装方針の変更内容2"
description = "entry.rawEntriesが無い/空の場合、ローカル再解決対象が無いためnullを返す。呼び出し側は既存の外部fetchフォールバックへ進む"
given = "entry.rawEntriesがundefinedまたは空配列"
expect_return = "null"
expect_side_effect = "genesysNameResolver.reset()・resolveGenesysEntries()は呼ばれない"

[[condition]]
id = "reresolve_local.resolves_incomplete_to_complete_without_fetch"
target_function = "GenesysPointCache#reresolveLocal"
source = "tm TASK-470 body: 確定した実装方針の変更内容2"
description = "rawEntriesを保持したincompleteエントリは、カードDB充実後にresolveGenesysEntriesで全件解決できればincomplete:falseの新entryを返す"
given = "entry.incomplete=true、entry.rawEntriesにカードDB充実後は解決可能なカードのみを含む"
expect_return_shape = "points/incompleteが更新された新しいGenesysListEntry（incomplete=false）"

[[condition]]
id = "genesys-cache.partial-improvement-adopted-by-callers"
target_function = "GenesysPointCache#reresolveLocal"
source = "PR#155レビュー指摘(P1): カードDBがrawEntriesの一部のみ蓄積済みの状況（2つ目のデッキを開いてそのカードがDBへ追加される等のincremental cacheケース）が常態なのに、呼び出し元のguardが完全解決（!relocal.incomplete）のみ採用していたため部分改善が破棄され、新たに解決可能になったカードのポイントがINCOMPLETE_RETRY_TTL(6日)経過まで表示されなかった"
description = "ローカル再解決で一部のみ解決した（再解決後もunresolvedが残る）場合も、呼び出し元（ensureList/ensureCurrentList/forceUpdate）は改善済みエントリ（incomplete:true・解決済みpoints反映済み）を破棄せず永続化して返す。TTLゲート付き外部fetchへのフォールバックは、ローカル再解決が実行できない（rawEntries無し/カードDB件数不変でnull）場合のみ"
given = "rawEntries保持済みのincomplete:trueエントリ、カードDB充実により一部カードのみ解決可能（resolveGenesysEntriesのunresolvedが1件以上残る）"
expect_return_shape = "ensureList/ensureCurrentListは解決済みpointsを含むincomplete:trueの改善済みGenesysListEntryを返す（fetchGenesysPointList/forceUpdateは呼ばれず、safeStorageSetで改善済みentryを含むcacheが保存される）"

[[condition]]
id = "reresolve_local.resets_name_resolver_before_resolve"
target_function = "GenesysPointCache#reresolveLocal"
source = "tm TASK-470 body 設計レビュー指摘1（重大）: GenesysNameResolver.build()はthis.builtフラグで一度きりしか構築されず、reset()を呼ばない限りカードDBが後で充実しても名前解決マップが更新されない"
description = "resolveGenesysEntries()を呼ぶ前に必ずgenesysNameResolver.reset()を呼び、構築済みの名前解決マップを破棄してから再構築させる。順序を誤るとローカル再解決機能自体が無意味になる"
given = "entry.rawEntriesが1件以上ある"
expect_side_effect = "genesysNameResolver.reset()の呼び出しがresolveGenesysEntries()の呼び出しより先に発生する"

[[condition]]
id = "reresolve_local.preserves_fetched_at"
target_function = "GenesysPointCache#reresolveLocal"
source = "tm TASK-470 body 設計レビュー指摘4: fetchedAtは変更せず元の値を保持する（外部取得日時と再解決日時を混同しないため）"
description = "再解決結果のentryは、元entryのfetchedAt（外部取得日時）をそのまま維持する。再解決を行った時刻では上書きしない"
given = "entry.fetchedAtに任意のtimestampが設定されている"
expect_return_shape = "返るentryのfetchedAtは入力entryのfetchedAtと同一"

# --- GenesysPointCache#reresolveLocal: カードDB変化検知による間引き (TASK-471) ---
#
# 背景: reresolveLocal()（reset()を含むフルリビルドを伴う）が呼び出しのたびに
# 無条件実行され、無駄な計算コストが発生していた。前回試行時点のカードDB件数
# (cardTableACount)をインスタンスフィールドとして記録し、変化していなければ
# reset()を含む再解決処理そのものをスキップする。

[[condition]]
id = "reresolve_local.skips_reresolve_when_card_count_unchanged"
target_function = "GenesysPointCache#reresolveLocal"
source = "tm TASK-471 body 確定した実装方針（論点B）"
description = "getUnifiedCacheDB().getStats().cardTableACountが前回のローカル再解決試行時点(lastReresolveAttemptCardCount)から変化していない場合、genesysNameResolver.reset()・resolveGenesysEntries()を呼ばずnullを返す。呼び出し元は既存のTTLゲート付き外部fetchロジックへフォールバックする"
given = "entry.rawEntriesが1件以上あり、db.getStats().cardTableACountが前回記録値と同一"
expect_return = "null"
expect_side_effect = "genesysNameResolver.reset()・resolveGenesysEntries()は呼ばれない"

[[condition]]
id = "reresolve_local.retries_reresolve_when_card_count_changed"
target_function = "GenesysPointCache#reresolveLocal"
source = "tm TASK-471 body 確定した実装方針（論点B）"
description = "cardTableACountが前回記録値と異なる場合、lastReresolveAttemptCardCountを現在値へ更新したうえで通常通りgenesysNameResolver.reset()から再解決処理を実行する"
given = "entry.rawEntriesが1件以上あり、db.getStats().cardTableACountが前回記録値と異なる（初回呼び出しでlastReresolveAttemptCardCountがnullの場合を含む）"
expect_side_effect = "genesysNameResolver.reset()が呼ばれ、resolveGenesysEntries()の結果に基づく新しいentryが返る"

[[condition]]
id = "reresolve_local.tracks_card_count_per_list_param"
target_function = "GenesysPointCache#reresolveLocal"
source = "TASK-471 コードレビュー指摘（Major）: lastReresolveAttemptCardCountが全listParamで共有（インスタンス単位で1つ）だと、forceUpdate()のループ内で複数の異なるlistParamが同時にincompleteな場合、1件目の解決試行でカード数が記録され、まだ一度もこのDB状態で解決を試みていない2件目以降が誤って即座にスキップされ、本来不要な外部fetchへフォールバックしてしまう（genesysNameResolverは1件目のresetでbuild済みのため2件目以降のresolveGenesysEntries()自体は安価であり、本来スキップする必要は無い）"
description = "lastReresolveAttemptCardCountはlistParamごとに記録する（Record<string, number>）。entry.listParamをキーとして前回記録値と比較・更新するため、同一listParamの再試行のみがスキップ対象になり、異なるlistParamの初回試行はスキップされない"
given = "forceUpdate()のループ内で異なる2つのlistParamが両方incomplete:trueかつrawEntries保持済み、db.getStats().cardTableACountはループ全体を通じて不変"
expect_side_effect = "両方のlistParamでgenesysNameResolver.reset()とresolveGenesysEntries()が呼ばれ、どちらもローカル再解決だけでincomplete:falseに解決される（外部fetchは呼ばれない）"

