# --- 部分解決結果の採用（TASK-509、PR#155レビュー指摘P1） ---
#
# 背景: カードDBは閲覧単位で逐次充実するため、ローカル再解決で一部カードのみ
# 解決できる状態が常態。旧実装は完全解決（incomplete:false）のみ採用し部分改善を
# 破棄していたため、新たに解決可能になったカードのポイントがINCOMPLETE_RETRY_TTL
# (6日)経過まで反映されなかった。部分解決結果もincomplete:trueのまま永続化・返却し、
# カードDBの更なる充実で後続の再解決へ引き継がせる。

[[condition]]
id = "genesys-cache.ensure-list-partial-reresolve-persisted-and-returned"
target_function = "GenesysPointCache#ensureList"
source = "PR#155レビュー指摘(P1): incremental cacheケースで部分解決結果が破棄され、TTL branchが古いentryを返していた（src/utils/genesys-cache.ts:234のguard）"
source_lines = "234-240"
description = "ローカル再解決で一部のみ解決した場合も、改善済みエントリ（incomplete:true・解決済みpoints反映済み）をpersistResolvedEntryで永続化して返す。外部fetchもINCOMPLETE_RETRY_TTL判定も行わない"
given = "existing.incomplete=true、rawEntries保持済み、カードDB充実により一部カードのみ解決可能（resolveGenesysEntriesのunresolvedが1件以上残る）"
expect_return_shape = "解決済みpointsを含むincomplete:trueの改善済みGenesysListEntry（fetchGenesysPointListは呼ばれず、safeStorageSetで改善済みentryを含むcacheが保存される）"

[[condition]]
id = "genesys-cache.ensure-current-partial-reresolve-persisted-and-returned"
target_function = "GenesysPointCache#ensureCurrentList"
source = "PR#155レビュー指摘(P1): ensureList()と同一のguard問題。forceUpdate（外部fetch）より先に試みたローカル再解決が部分解決でも改善結果を返す必要がある"
source_lines = "194-200"
description = "現在有効なentryのローカル再解決で一部のみ解決した場合も、改善済みエントリ（incomplete:true）を永続化して返し、forceUpdateは呼ばない"
given = "現在有効なentryがincomplete:true、rawEntries保持済み、カードDB充実により一部カードのみ解決可能"
expect_return_shape = "解決済みpointsを含むincomplete:trueの改善済みGenesysListEntry（forceUpdate/fetchGenesysPointListは呼ばれず、safeStorageSetで改善済みentryを含むcacheが保存される）"

[[condition]]
id = "genesys-cache.force-update-partial-reresolve-replaces-entry-without-fetch"
target_function = "GenesysPointCache#forceUpdate"
source = "PR#155レビュー指摘(P1)と同根: forceUpdateループ内の同一guardも部分解決結果を破棄して外部fetchへ進んでいた"
source_lines = "378-385"
description = "ループ内で既存entryのローカル再解決が一部のみ解決した場合も、改善済みエントリ（incomplete:true）でlists[ref.listParam]を置き換え、そのlistParamの外部fetchをスキップする"
given = "lists[ref.listParam]が既存でincomplete:true、rawEntries保持済み、カードDB充実により一部カードのみ解決可能"
expect_return_shape = "lists[ref.listParam]が解決済みpointsを含むincomplete:trueエントリで上書きされる（fetchGenesysPointListは呼ばれない）"
