source_hash = "16350f35f99ef7a6f7fdcd94c7e09c8d7111905f"
note = "verified=falseは0件。TASK-470でrawEntries保持+ローカル再解決(reresolveLocal)条件を追加。TASK-471でINCOMPLETE_RETRY_TTLをDISCOVERY_TTL同値(6日)へ延長し、reresolveLocal()にカードDB件数(cardTableACount)変化検知による間引き(lastReresolveAttemptCardCount)を追加。TASK-473で、重複していたsrc/utils/__tests__/genesys-cache.test.tsに実在したTASK-302回帰テスト9件をtests/unit/utils/genesys-cache.test.tsへ移植し、あわせてTASK-470/471/472で追加されていたreresolveLocal関連（rawEntries保持・カードDB件数変化検知等）の未カバー条件9件を同ファイルへ新規作成、旧ファイルを削除して一本化した。移植に伴いensure_current.incomplete_within_ttl_returns_without_update / ensure_list.incomplete_within_ttl_returns_without_refetch / force_update.awaits_db_init_before_resolving_entries の3条件を新規追加（既存条件書に対応する条件が無かったTASK-302回帰テストの検証内容）。TASK-509（PR#155レビュー指摘P1）で、ローカル再解決が部分解決（再解決後もunresolved残）の場合の呼び出し元扱いを「完全解決のみ採用・部分改善は破棄してTTLゲート付き外部fetchへフォールバック」から「部分改善も永続化して返す」へ変更。旧id reresolve_local.still_incomplete_falls_back_to_ttl_gated_fetch を廃止し genesys-cache.partial-improvement-adopted-by-callers へ張替え、部分解決3条件（genesys-cache.ensure-list/ensure-current/force-update-partial-*）を新規追加（新規4条件はstable id形式・標準expectキーで作成。既存63条件のlegacy形式idはTASK-489のcorpus移行スコープ）"

