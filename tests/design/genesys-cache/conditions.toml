# TASK-323(Tier A本展開)、外部fetch + chrome.storageキャッシュ + UnifiedCacheDBを伴う中核utils。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - 既存テストは selectApplicableGenesysList の純粋関数のみを検証しており、GenesysPointCache本体の
#   storage/API/DB依存を含むキャッシュ挙動は未検証だった。本作業で実クラス + 依存モックを使う
#   確定的なテストを追加した。

