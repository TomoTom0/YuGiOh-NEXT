# 検証対象: src/composables/useDeckNameVariables.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、デッキ名入力欄の @-mark 変数入力（@orig で元のデッキ名挿入 等）を
# 管理するVue composable。
#
# target_function の記述形式について（composable factory パターン）:
# 本ファイルは `export function useDeckNameVariables(options)` がオブジェクトを返す構造で、
# 実質的なロジックは factory 内のローカル関数（handleInput/handleKeydown 等）にあります。
# extract-ast-skeleton.ts は Pinia Setup Store（defineStore()）の factory は検出しますが、
# 一般の composable factory（export function useXxx()）は未対応のため、export関数一覧には
# `useDeckNameVariables` 1件のみが現れ、`useDeckNameVariables#handleInput` 等は抽出されません。
# このため conditions.toml の target_function には `useDeckNameVariables#<method>` 形式で
# 記載し、README Phase1.6 知見の Pinia Setup Store と同じ `#` 区切り形式に合わせています。
# スクリプト実行時の未カバー検出で `useDeckNameVariables` が1件出ますが、これは上記の
# スクリプト側の限界であり、本ファイルでは全メソッドの条件を網羅しています。
#
# 到達不能/実質到達不能分岐:
# - L50 `match[1] ?? ''`: TRIGGER_PATTERN `/@([a-zA-Z0-9_-]*)$/` のキャプチャグループは
#   マッチした場合常に存在（空文字列を含む）するため、match[1] が undefined になる経路は
#   実質到達不能。フォールバック `?? ''` は実質効果なし（条件化せず）。
# - handleKeydown L105 `if (suggestion)`: suggestions.value.length === 0 は L88 ガードで除外済み。
#   ArrowDown/ArrowUp のラップアラウンド (suggestions.value.length でmod) により selectedIndex は
#   常に [0, length) に収まるため、`suggestions.value[index]` は実質常に存在。
#   ただし selectedIndex は ref で外部公開されているため、呼び出し側が直接負値や範囲外を
#   設定した場合は到達可能。そのため条件として一応記載します（verified=false にはせず、
#   テストで正常系のみ検証）。
#
# 既知の設計上の注意点（バグではないが複雑な挙動。実装読解で判明）:
# - TRIGGER_PATTERN `/@([a-zA-Z0-9_-]*)$/` は @ 直後に ASCII 英数字・アンダースコア・ハイフン
#   のみを許容。`@あいう` のように @ 直後に非ASCII文字（日本語等）がある場合はマッチせず、
#   候補が出ない（仕様）。
# - handleKeydown の Enter 処理で selectedIndex が -1（未選択）の場合は 0（先頭）を使うため、
#   候補が表示されていれば Enter で常に先頭が確定される（ユーザが明示的に選択していなくても）。
# - Tab は ArrowDown と同じ「次へ進む」挙動だが、event.preventDefault() するためブラウザの
#   デフォルトのフォーカス移動（次の入力欄へ遷移）がキャンセルされる。
# - applyVariable は triggerStart = cursorPos - query.length - 1 を計算するが、cursorPos は
#   getCursorPos() が inputElement.value?.selectionStart を読むため、呼び出し時に focus が外れて
#   selectionStart が null の場合は inputValue.value.length にフォールバックする。つまり
#   selectSuggestion 呼び出し直前にフォーカスが失われていると、入力末尾の @word ではなく
#   末尾付近の文字列が置換対象と見なされ、意図しない箇所が置換される可能性がある。
# - handleInput は呼び出されるたびに selectedIndex.value = -1 を必ず実行する（条件なしの副作用）。
#   これは候補リストが更新されるたびに選択状態がクリアされることを意味する。

