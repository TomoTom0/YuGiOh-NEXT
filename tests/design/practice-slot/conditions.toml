# - TASK-569（TASK-331 Tier C第20号・TASK-568第19号の後続）。Practice系コンポーネント
#   11ファイルの条件化9ファイル目。333行（template＋script setup。props: cards/zone/
#   slotIndex/stackDirection/maxVisible/forceReveal/cardWidth/cardHeight。
#   ドロップ受け入れ・四分円オーバーレイ・drag状態へのfaceDown/stackTop通知を担う）。
#   既存の専用ユニットテストは無く、tests/unit/components/PracticeSlot.test.tsを新規作成
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm TASK-569
# - Practice機能はカテゴリ3（configs/features.toml [practice] default = "dev-only"）
#
# 粒度方針（Tier C・第8号〜第19号条件書と同一）:
# - 1条件=1振る舞いclass。ゾーン・座標の列挙はテスト側で持ち、条件書には親条件のみ置く
# - 観測対象は描画結果（クラス・オーバーレイ・子props）とemit・共有drag状態
#   （usePracticeDragStateの公開ref）。vm内部computedは直接参照しない
# - 子PracticeCardStackはカスタムstubで置き換え（内部挙動は第16号practice-card-stack
#   条件書が保証）。useDragQuarter/usePracticeDragState/drag-dataの各ガードは実物を
#   使い、内部仕様は各条件書へ委譲する
# - ドラッグ系イベントはhappy-domのDragEventがEventのエイリアスである前提
#   （tests/unit/utils/drag-data.test.tsの注記どおり）で、実要素へのdispatchEventと
#   dataTransferのdefineProperty付与で再現する

