# 検証対象: src/components/practice/PracticeCardStack.vue
#
# 経緯:
# - TASK-563（TASK-331 Tier C第16号・TASK-561第15号の後続）。Practice系コンポーネント
#   11ファイルの条件化5ファイル目。185行（template＋script setup。props: cards/
#   direction/maxVisible/forceReveal/zone/slotIndex/dragOver/cardWidth/cardHeight、
#   子DeckCardのラッパー）。既存の専用ユニットテストは無く、
#   tests/unit/components/PracticeCardStack.test.tsを新規作成
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm TASK-563
# - Practice機能はカテゴリ3（configs/features.toml [practice] default = "dev-only"）
#
# 粒度方針（Tier C・第8号〜第15号条件書と同一）:
# - 1条件=1振る舞いclass。カード構成・方向の列挙はテスト側fixtureで持ち、
#   条件書には親条件のみ置く
# - 観測対象は描画結果（DeckCardへ渡されるprops・style・バッジ）とemitのみ。
#   vm内部computedは直接参照しない
# - 子DeckCardはDeckMetadata.test.tsと同一手法のカスタムstubで置き換え、受け取った
#   propsをdata属性へ描画しボタンで親がlistenするイベントを発火する。子の内部挙動は
#   DeckCard自身の条件書が保証
# - ルートの direction-* クラスに対応するSCSSルールは存在しない（クラスは目印のみで、
#   視覚配置はoffsetStyleのinline styleが担う）。クラス自体は条件化する
# - dragOver propは宣言のみで描画・ロジックに一切使われていない（受け取りのみ）。
#   観測可能な出力が無いため条件化対象外（excluded参照）
#
# 作業中に発見した不具合疑い（src不変のため別タスクへ分離）:
# - defineEmitsの card-dragstart / practice-action / practice-dragend は宣言のみで
#   template内で一度もemitされない。特に card-dragstart は親PracticeSlot.vueが
#   (card, event) でlistenして自らのcard-dragstartへ再emitする実装があるため、
#   ドラッグ開始経路が成立していない疑いがある。[[excluded]]に記録しTASK-562へ分離起票

