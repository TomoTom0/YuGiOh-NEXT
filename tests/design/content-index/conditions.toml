# 検証対象: src/content/index.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開、content残り)。
#
# TASK-510追記分（2026-09-15・テスト先行）: ロード画面の最初の描画前表示のための
# loader.jsとの引き継ぎプロトコル（notifyStart/removeLoaderDerivedElements/
# runEditPageBoot/DCL待ち/#bg事前検証/handoff/復帰catch）の12条件を末尾に追記した。
# 出典はTASK-510技術設計（docs/design/loader-early-loading-tech.md。実装完了時に
# 一次出典の設計rev2から清書し、source参照も更新済み）。追記条件は本ファイル既存の方針（トップレベル副作用のためunitテスト
# での検証は行わずverified=false + unverifiable_reason、実際の検証はtests/browser/の
# E2Eが適切）を踏襲する。idはtest-structure skill §2のstable id形式（kebab）で発行
# （既存19条件のunderscore形式idは本追記の時点で既存のため変更しない）。
#
# 本ファイルの性質: Content Scriptのエントリーポイントで、export関数を1件も持たない
# （import時にトップレベルで副作用を実行するオーケストレーション専用ファイル）。
# 実際の業務ロジック（デッキパース・API通信・DOM描画等）は全て他モジュールに委譲されており、
# 本ファイル自体が持つ分岐はほぼ「どのモジュールを・いつ・どの条件で呼ぶか」という
# 配線ロジックのみ。個々の分岐の意味は転記するが、トップレベル副作用の実行順序・
# 大量の動的import・chrome.storage/window.matchMedia等のグローバル状態に依存するため、
# 全分岐を実際にvitestで駆動するには依存モジュール(10件以上)を全てモック化した上で
# vi.resetModules()による都度の再import が必要で、費用対効果が低いと判断した。
# 「意味のある分岐」の記載は行うが、検証(テスト)は個別に切り出しやすく実害の大きい
# 条件（dno検証・cgid欠如判定・editUILoaded重複防止・タイムアウトエラー分岐）に絞り、
# 残りはverified=falseとしてunverifiable_reasonに理由を記載する。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - content/index.ts専用のテストは存在しなかった。
#
# ユニットテスト非採用の技術的根拠:
# - 本ファイルは`import './public-path'`を先頭で実行し、public-path.tsは
#   `__webpack_public_path__ = chrome.runtime.getURL('')`というwebpack DefinePlugin
#   依存のグローバル代入を行う（`@ts-ignore`/`eslint-disable no-undef`付き）。
#   Vitest実行環境(Vite)ではこの変数は事前定義されておらずstrict modeでの素の識別子代入は
#   ReferenceErrorになりうる。vi.stubGlobalで回避可能だが、その他10件以上の依存モジュール
#   (initializeMappingManager/getDeckMetadata/forbiddenLimitedCache/genesysPointCache/
#   session/deck-operations/ytkn-fetcher等)を全てモックしvi.resetModulesで都度再import
#   する必要があり、配線ロジックの検証としては費用対効果が低いと判断し、
#   全条件をverified=falseとした。実際の検証はtests/browser/でのE2E経由が適切。

