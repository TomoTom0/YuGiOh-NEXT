# 検証対象: src/composables/useDeckRegulationTagSuggestions.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、デッキ名冒頭のレギュレーションタグ（[OCG-YYMM] / [GENESYS-YYMM]）
# 入力補助Composable。
#
# 到達不能/実質到達不能分岐:
# - handleInput内の `match[1] ?? null` / `match[2] ?? ''`（66-71行目）:
#   tsconfigでnoUncheckedIndexedAccess=trueのためTypeScript上はmatch[1]/match[2]が
#   `string | undefined`型となり`??`が要求されるが、TRIGGER_PATTERN
#   (`/^([[【])([^\]】]*)$/`)の2つのキャプチャグループはどちらも`?`等の省略記号を
#   持たないため、execがmatchを返す（truthyになる）時点で両グループは必ず文字列を
#   持つ。実行時にmatch[1]/match[2]がundefinedになるケースは存在しないため、
#   `?? null` / `?? ''`側の分岐は型システムが要求する防御コードであり実質到達不能。
# - candidates内の `if (!open) return []`（79-82行目、openはmatchedBracket.value）:
#   matchedBracket/matchedQueryは非公開のクロージャ内refでhandleInput内でしか変更されず、
#   常にペアで設定される（一方がnullなら他方も必ずnull。両方null始まり）。candidates.value
#   はsuggestions computedの`matchedQuery.value === null`ガードを通過した後にのみ参照される
#   ため、candidates内でmatchedBracket.valueがnullになる状態でcandidates.valueが評価される
#   ことは公開API経由の実行時には発生しない（実質到達不能）。

