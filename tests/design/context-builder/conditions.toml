# --- cardHeader(card: CardInfo): string ---

[[condition]]
id = "card_header.monster_level_label"
target_function = "cardHeader"
source_lines = "69-70"
description = "monsterカードの場合、levelTypeが'rank'なら'R'、'link'なら'L'、それ以外なら'Lv'をlevelValueの前に付ける"
given = "levelType='level' / 'rank' / 'link' のmonsterカード"
expect_return_shape = "それぞれ 'Lv4' / 'R4' / 'L2' をヘッダー内に含む"

[[condition]]
id = "card_header.monster_type_label_maps_and_filters"
target_function = "cardHeader"
source_lines = "71-74,76"
description = "typesがtruthyなlengthを持つ場合、'effect'と'normal'を除外し、既知typeを日本語短表記にmapして区切りなしでjoinし、空でなければparts先頭に入れる"
given = "types = ['effect', 'fusion', 'tuner']"
expect_return_shape = "'融合チューナー' が属性より前に出力され、'effect'は出力されない"

[[condition]]
id = "card_header.monster_type_label_unknown_fallback"
target_function = "cardHeader"
source_lines = "72-74"
description = "types内のmapに存在しない値は元の文字列をそのままtypeLabelへ入れる"
given = "types = ['custom']（実行時に型外値が入った場合）"
expect_return_shape = "'custom' がヘッダー内に出力される"

[[condition]]
id = "card_header.monster_type_label_empty_omitted"
target_function = "cardHeader"
source_lines = "71,76,82"
description = "typesが空配列またはundefinedの場合、typeLabelは空文字列になり、partsではundefined扱いで除外される"
given = "types = [] または undefined（実行時に型外状態が入った場合）"
expect_return_shape = "ヘッダーは属性から始まり、先頭に空要素や余分な'/'を含まない"

[[condition]]
id = "card_header.monster_attribute_race_map_or_raw"
target_function = "cardHeader"
source_lines = "77-78"
description = "attribute/raceは対応する表示名がマップに存在すれば日本語名を使い、存在しなければ元の値をそのまま使う"
given = "attribute='dark', race='dragon' / attribute='customAttr', race='customRace'"
expect_return_shape = "前者は'闇/ドラゴン族'、後者は'customAttr/customRace'を含む"

[[condition]]
id = "card_header.monster_atk_def_nullish_omitted"
target_function = "cardHeader"
source_lines = "80-82"
description = "atk/defはnullまたはundefinedでなければ'攻${atk}'/'守${def}'としてpartsに入り、nullishなら除外される"
given = "atk=0, def='?' のmonsterカード / atk・def未指定のmonsterカード"
expect_return_shape = "前者は'攻0/守?'を含み、後者は攻守表記と余分な'/'を含まない"

[[condition]]
id = "card_header.monster_return_template"
target_function = "cardHeader"
source_lines = "75-83"
description = "monsterカードはpartsを'/'で結合し、'${card.name}（${parts.join('/')}）'を返す"
given = "name='青眼の白龍'、属性・種族・Lv・攻守を持つmonsterカード"
expect_return_shape = "'青眼の白龍（光/ドラゴン族/Lv8/攻3000/守2500）'"

[[condition]]
id = "card_header.spell_kind_and_effect_type"
target_function = "cardHeader"
source_lines = "85-86"
description = "monster以外でcardTypeが'spell'の場合kind='魔法'になり、effectTypeがtruthyなら'${name}（${effectType}魔法）'、falsyなら'${name}（魔法）'を返す"
given = "effectType='quick'のspellカード / effectType未指定のspellカード"
expect_return_shape = "それぞれ '速攻魔法（quick魔法）' 形式ではなく、実装どおりeffectType生値を使うため '${name}（quick魔法）' / '${name}（魔法）'"

[[condition]]
id = "card_header.trap_kind_and_effect_type"
target_function = "cardHeader"
source_lines = "85-86"
description = "monster以外でcardTypeが'spell'でない場合kind='罠'になり、effectTypeがtruthyなら'${name}（${effectType}罠）'、falsyなら'${name}（罠）'を返す"
given = "effectType='counter'のtrapカード / effectType未指定のtrapカード"
expect_return_shape = "それぞれ '${name}（counter罠）' / '${name}（罠）'"

# --- formatCardEntry(card: CardInfo, count: number): string ---

[[condition]]
id = "format_card_entry.count_gt_one_suffix"
target_function = "formatCardEntry"
source_lines = "89-91"
description = "count > 1 の場合、cardHeader(card)の後に'×${count}'を付け、末尾に' [cardId:${card.cardId}]'を付ける"
given = "count=2, cardId='100'"
expect_return_shape = "'...×2 [cardId:100]'"

[[condition]]
id = "format_card_entry.count_le_one_no_suffix"
target_function = "formatCardEntry"
source_lines = "89-91"
description = "count <= 1 の場合、枚数サフィックスを付けず、末尾に' [cardId:${card.cardId}]'を付ける"
given = "count=1（buildSystemPromptのfocusedCardでは常に1）"
expect_return_shape = "'... [cardId:100]'（'×1'は含まない）"

# --- summarizeCards(cards: CardInfo[]): string ---

[[condition]]
id = "summarize_cards.empty_returns_empty_string"
target_function = "summarizeCards"
source_lines = "94-104"
description = "cardsが空配列の場合、Mapも空のままになり、join('\\n')の結果として空文字列を返す"
given = "cards = []"
expect_return = "''"

[[condition]]
id = "summarize_cards.duplicates_grouped_by_name"
target_function = "summarizeCards"
source_lines = "95-104"
description = "同じnameのカードが複数ある場合、cardId等が異なっていても同一entryとしてcountを増やし、最初に見たcard情報でformatCardEntryする"
given = "同じnameでcardIdが異なるカード2件"
expect_return_shape = "1行だけ出力され、最初のcardIdと'×2'を含む"

[[condition]]
id = "summarize_cards.unique_entries_keep_insertion_order"
target_function = "summarizeCards"
source_lines = "95-104"
description = "nameが異なるカードは初出順にMapへ追加され、戻り値では各entryを'\\n'で結合する"
given = "nameが異なるカード2件"
expect_return_shape = "1件目の行、改行、2件目の行の順で出力される"

