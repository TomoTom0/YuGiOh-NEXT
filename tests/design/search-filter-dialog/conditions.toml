# 検証対象: src/components/SearchFilterDialog.vue（template L1-102、script setup L104-377、
#   scoped CSS L379-597。pinia直参照でprops/emits/exposeなし。親はSearchInputBarの
#   v-if position!=='bottom'）
# 経緯: TASK-504（Tier C第5号・TASK-331展開）。競合バグ修正履歴を持つコンポーネントで、
#   git fa8dd0d（useSearchExecutionスナップショット化によるレース条件修正）・
#   git 304d2b4（検索世代ガード追加）の対象領域に隣接する履歴再検索経路を含む。
#   直前の品質リファクタ（git e18997b）で structuredClone防御コピー・
#   isCardSearchResultsArrayガード・.catch追加・SortOrder 'name_asc'固定化済み
#   （その後TASK-507でisCardSearchResultsArrayガードは廃止し、store型CardInfo[]による
#   直接代入へ移行）。
#
# 粒度方針（Tier C・category-dialog/load-dialog条件書と同一）:
# - script setup相当のロジック分岐（executeHistorySearch・removeHeaderChip・filterCount・
#   ダイアログ開閉・タブ切替）を主対象とし、template表示結果は簡潔に
# - UI操作はDOMイベント経由で検証する（vm内部呼び出し・vm内部状態の直接参照はしない）
#
# 線引き（隣接条件書・別タスクとの）:
# - useFilterLogic本体（チップ計算・トグル・無効化判定・clearFilters。34条件）は
#   use-filter-logic条件書（tests/design/use-filter-logic/conditions.toml）の対象。
#   本書はヘッダーでの表示・削除ボタン接続のみ
# - filters→FilterIcon変換（spellType/trapType等のtype値生成を含む）は filter-icons、
#   ラベル・整形は filter-label / filter-chip-formatter 条件書の対象
# - 検索API本体は card-search（86条件）、SearchOptions構築は search-options-builder（34条件）、
#   searchStore状態は search-store、履歴操作本体は use-search-history 条件書の対象。
#   本書はそれぞれの呼び出し契約（引数・分岐条件）のみ
# - FilterTab.vue固有のscript分岐・useFilterLogicとの重複問題は TASK-505/506、
#   searchResults要素型検証の強化は TASK-507、履歴再検索の世代チェックは
#   TASK-508で解消済み（TASK-506で8関数重複解消・TASK-505でfilter-tab条件書
#   38条件として全面条件化済み。該当条件のdescription/excludedで別件であることを明示）
#
# 探索中の発見事項:
# - removeHeaderChipのswitch（L338-375）は spellType / trapType のcaseを持たない。
#   一方 convertFiltersToIcons（filter-icons.ts）は spellType/trapType チップを生成するため、
#   これらのヘッダーチップクリックはフィルターを削除せず無言でno-opになる。
#   検収でバグ確定（チップ表示と削除不能の不整合）のため修正を条件化
#   （remove-chip-spell-trap-type-removes-value）。TASK-504テスト実装時に
#   attr/raceと同パターンのvalue一致除外として修正する
# - filterCount（L147-166）は atk/def を min/max のみでカウントし exact/unknown フラグを
#   数えない。一方クリアボタン表示の hasActiveFilters（useFilterLogic activeConditionChips）は
#   exact/unknown も数える。そのため「ATK固定のみ設定」状態はバッジ0件（非表示）かつ
#   クリアボタン表示となる。filter-count-ignores-mode-settings-and-stat-flags として現行挙動を条件化
# - タブ選択（activeDialogTab）はダイアログを閉じてもリセットされない（コンポーネントは
#   親の v-if position!=='bottom' で常駐マウントで、isVisibleはBaseDialog内部のv-if）。
#   tab-selection-persists-across-close として現行挙動を条件化
# - 履歴バックグラウンド再検索（L257-304）のsearchGeneration世代チェック欠如は
#   TASK-508で解消（履歴実行時の世代取得と再検索完了後の世代ガードを追加。
#   history-search-advances-generation-and-clears-loading /
#   history-search-rerun-discard-after-empty-clear /
#   history-search-latest-run-wins-consecutive-runs を新設し、
#   history-search-rerun-lacks-generation-guard は
#   history-search-rerun-respects-generation-guard へ改名）

