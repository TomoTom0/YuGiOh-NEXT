note = "verified=false は1件（process_queue.shift_guard_defensive_unreachable、公開APIからは到達不能な防御的分岐）"

# --- BackgroundFetchQueue#enqueue(cardId, priority='normal', onComplete, onError?): void ---

[[condition]]
id = "enqueue.duplicate_active_ignored"
target_function = "BackgroundFetchQueue#enqueue"
source_lines = "50-55"
description = "cardIdが既にactiveRequests(処理中)に存在する場合、queueへの追加・sortQueue/processQueueの呼び出しを行わず即座にreturnする"
given = "同一cardIdが既にactiveRequestsに登録されている状態でenqueueを呼ぶ"
expect_side_effect = "queueにアイテムが追加されない。onComplete/onErrorも呼ばれない"

[[condition]]
id = "enqueue.duplicate_queue_ignored"
target_function = "BackgroundFetchQueue#enqueue"
