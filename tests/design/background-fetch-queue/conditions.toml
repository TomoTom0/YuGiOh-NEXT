# --- BackgroundFetchQueue#processQueue(): Promise<void> (private) ---

[[condition]]
id = "process_queue.already_processing_guard"
target_function = "BackgroundFetchQueue#processQueue"
source_lines = "83-84"
description = "isProcessingが既にtrueの場合、whileループに入らず即座にreturnする（多重実行防止）。isProcessingは最初のprocessQueue呼び出しがfinallyに到達するまで（100ms待機区間を含む）trueのまま保持される"
given = "先行するprocessQueue呼び出しが100ms待機のawait区間で一時停止している間に、別の呼び出し経路（enqueueの再呼び出し等）でprocessQueueが呼ばれる"
expect_side_effect = "後発の呼び出しはqueueから何もdequeueしない。結果としてqueue内のアイテムが即座には処理されず残る"

[[condition]]
id = "process_queue.concurrency_limit"
target_function = "BackgroundFetchQueue#processQueue"
source_lines = "87-90"
description = "while文はqueue.length>0かつactiveRequests.size<maxConcurrent(3固定)の間のみ継続する。3並行に達するとループを抜ける"
given = "queueに4件以上あり、activeRequests.sizeがmaxConcurrent(3)に達する"
expect_side_effect = "同時にfetchCardが開始されるのは最大3件までで、4件目以降はqueueに留まる"

[[condition]]
id = "process_queue.shift_guard_defensive_unreachable"
target_function = "BackgroundFetchQueue#processQueue"
source_lines = "91-92"
description = "queue.shift()がundefinedを返した場合はbreakする防御的分岐。TypeScript型上はArray#shift()がT|undefinedを返すためnarrowingで保証された分岐ではないが、直前のwhile条件でqueue.length>0を確認済みかつシングルスレッド実行のため、同一while反復内でこの分岐がtrueになる経路は存在しない"
given = "queue.length>0を満たした直後のshift()がundefinedを返す状況（通常の公開API経路では発生しない）"
expect_side_effect = "breakしてwhileループを抜ける"
verified = false
unverifiable_reason = "queueはprivateフィールドでprocessQueue内の同期処理中に外部から変更する手段が公開APIに無く、length>0確認直後のshift()がundefinedになる状況を公開APIからは再現できない"

[[condition]]
id = "process_queue.per_item_dequeue_side_effects"
target_function = "BackgroundFetchQueue#processQueue"
source_lines = "94-106"
description = "1件dequeueするごとに、requestId=cardIdでfetchCard(item)を開始し、その完了時にactiveRequestsから自身を削除するthenを繋げてactiveRequestsに登録する。さらにsetImmediateで次のprocessQueue呼び出しを即座にスケジュールしてから、100ms待機してから次のwhile反復に進む"
given = "queueに複数アイテムがあり、maxConcurrent未満の状態でprocessQueueのwhileループが反復する"
expect_side_effect = "各アイテムがactiveRequestsにcardIdキーで登録され、アイテム間に約100msの間隔が空く。setImmediateにより現在の待機中でも次のprocessQueue呼び出しが並行して試みられる"

[[condition]]
id = "process_queue.finally_resets_processing_flag"
target_function = "BackgroundFetchQueue#processQueue"
source_lines = "108-109"
description = "whileループが正常終了・例外いずれの場合でも、finally節でisProcessingを必ずfalseに戻す"
given = "processQueueのwhileループが完走する（queueが空になるかmaxConcurrentに達してループを抜ける）"
expect_side_effect = "isProcessingがfalseに戻り、以降のprocessQueue呼び出しがガードされなくなる"

[[condition]]
id = "process_queue.finally_restarts_if_pending"
target_function = "BackgroundFetchQueue#processQueue"
source_lines = "110-113"
description = "finally節でisProcessingをfalseに戻した直後、queue.length>0かつactiveRequests.size<maxConcurrentならprocessQueue()を再度呼び出す（await待機中に新たにenqueueされた分を拾うため）"
given = "whileループを抜けた時点でqueueにまだアイテムが残っており、activeRequestsに空きがある"
expect_side_effect = "processQueueが再帰的に呼ばれ、残りのアイテムも順次処理される"

