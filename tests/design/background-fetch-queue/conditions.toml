# 検証対象: src/utils/background-fetch-queue.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、キューイング・非同期リトライ・並行数制御を持つutils。
#
# 実装コメントとの差異:
# - なし（コード自体の分岐・throw条件は説明コメントと矛盾しない）。
#
# 機械抽出との関係:
# - `BackgroundFetchQueue` クラスは非export（モジュール内部専用）で、唯一のexportは
#   シングルトンfactoryの `getBackgroundFetchQueue()` のみ。
#   `scripts/design/extract-ast-skeleton.ts` はexport関数・exportクラスのメソッド・
#   Piniaストアのreturn公開関数のみを走査するため、非exportクラスのメソッド
#   （enqueue/sortQueue/processQueue/fetchCard/clear/size/activeCount）は
#   機械検出の対象外（README 5節 Phase1.6の「非exportのヘルパー関数は『未カバー検出』の
#   対象外」と同じ制約）。これらは全て人手で条件化した。
#   実行結果: `tsx scripts/design/extract-ast-skeleton.ts src/utils/background-fetch-queue.ts`
#   → export関数1件（getBackgroundFetchQueue）のみ検出、L163のif分岐とL166のreturnを検出。

[meta]
