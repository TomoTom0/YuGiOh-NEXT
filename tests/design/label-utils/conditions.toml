# 検証対象: src/utils/label-utils.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、utils残り（フォーマッタ/変換系・局所的なロジック）。
#
# 実装コメントとの差異:
# - 特になし。ヘッダコメント通り「属性・種族・タイプ等の内部値を現在の言語設定に応じた
#   表示用ラベルに変換する関数群」。
#
# 注記:
# - 非exportのヘルパー `currentLang()` (L21-23) は `detectLanguage(document)` を呼ぶだけの
#   薄いラッパーであり、README 2節の「書かない」基準（単純なgetter相当）に該当するため
#   個別条件は起票しない。各条件の `given` では currentLang() の戻り値（lang）を
#   直接指定する形で表現する。
# - `src/utils/filter-label.ts` に同名（getAttributeLabel等）の別実装が存在するが、
#   これは別ファイル・別用途（チップ表示用の短縮ラベル）であり本ファイルとは無関係。
#   混同しないこと。

[meta]
feature = "label-utils"
source_file = "src/utils/label-utils.ts"
verified = true
verified_at = "2026-08-28"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/label-utils.test.ts"
source_hash = "265f809055fec73edfa8674ee55d45b67fc35c7c"
note = "verified=falseは0件"

# --- getAttributeLabel(attr: string): string ---
# フォールバック優先順位: 動的マッピング(mappingManager) > 静的マッピング(ATTRIBUTE_ID_TO_NAME) > 入力値そのまま

[[condition]]
id = "get_attribute_label.dynamic_mapping_hit"
target_function = "getAttributeLabel"
source_lines = "28-33"
description = "mappingManager.getAttributeIdToText(lang)[attr]が真値を返す場合、その値を最優先で返す（静的マッピングは参照しない）"
given = "mappingManager.getAttributeIdToText(lang) が { light: '光' } を返し、attr = 'light'"
expect_return = "光"

[[condition]]
id = "get_attribute_label.static_fallback"
target_function = "getAttributeLabel"
source_lines = "28-33"
description = "動的マッピングにattrのキーが無い（undefined）場合、静的マッピングATTRIBUTE_ID_TO_NAMEの値にフォールバックする"
given = "mappingManager.getAttributeIdToText(lang) が {} を返し、attr = 'light'（ATTRIBUTE_ID_TO_NAMEにlightのエントリが存在する）"
expect_return_shape = "ATTRIBUTE_ID_TO_NAME['light']の値"

[[condition]]
id = "get_attribute_label.unmapped_returns_input"
target_function = "getAttributeLabel"
source_lines = "28-33"
description = "動的・静的いずれのマッピングにもattrのキーが無い場合、入力値attrをそのまま返す"
given = "mappingManager.getAttributeIdToText(lang) が {} を返し、attr = 'unknown_attr'"
expect_return = "unknown_attr"

