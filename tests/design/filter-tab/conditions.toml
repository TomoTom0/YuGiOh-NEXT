# 検証対象: src/components/search-filter/FilterTab.vue
#
# 経緯:
# - TASK-506（FilterTab/useFilterLogic重複8関数解消）のテスト先行Phaseで、
#   無効化配線・tooltip表示の最小4条件を作成（旧red緑記録:
#   tmp/tasks/tm-506/test_red_pre_impl.log）
# - TASK-505（Tier C第6号・TASK-331展開）で全面条件化。TASK-506完了後の構成
#   （読み取り系8関数+isMonsterTypeFieldDisabledをuseFilterLogicから直接
#   destructure）を前提に、template配線の表示契約・emit透過ラッパー15関数の
#   emit契約・ローカルscript分岐（activeStatTab/maxDate/ラベルフォールバック）を条件化
#
# 粒度方針（Tier C・search-filter-dialog条件書と同一）:
# - templateのv-if/v-show・:class/:disabled/:titleバインディングは表示契約として
#   条件化する。同一パターンのchip群（属性/魔法/罠/種族等）は1条件に束ね、
#   個別値の列挙はテスト側fixture表で持つ
# - UI操作はDOMイベント経由で検証する（vm内部状態の直接参照はしない）
#
# 線引き（隣接条件書との）:
# - 読み取り系8関数の内部挙動（isFieldDisabledのフォールバック推論・
#   getMonsterTypeDisabledReasonの優先順位・getMonsterTypeClassの分岐本体等）は
#   use-filter-logic条件書（tests/design/use-filter-logic/conditions.toml）が保証。
#   本書はFilterTab template/scriptからの呼び出し配線（引数・表示結果）のみ。
#   ただしTASK-506由来のtooltip 2条件（monster-type-chip-title-*）はid維持の
#   経緯（赤緑記録との対応）からuse-filter-logic条件書と文言レベルが重複保証に
#   なっており、これは意図的（レビュー指摘対応として明記）
#   cardTypeフォールバック経由の無効化（モンスター選択時の魔法/罠タイプ
#   無効化）は表示契約の一部として本書の条件に含める
# - 選択済みchipラベルの計算本体（selectedAttributeChips等）はuseFilterLogic/
#   filter-label条件書の対象。本書はpropsで受け取った配列をそのまま描画する契約のみ
# - SearchFilterDialog側のprops/emits受け渡し・ヘッダー表示は
#   search-filter-dialog条件書の対象
# - emitsの型定義（defineEmits）は15 emit条件が契約（イベント名・引数）として保証

