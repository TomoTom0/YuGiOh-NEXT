# 検証対象: src/content/deck-recipe/imageDialog.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開、content残り)。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# テスト作成中に発見し修正したバグ:
# - showImageDialogWithData()を、既存ダイアログが開いた状態のまま(onCloseを経ずに)
#   再度呼ぶと、dialogApp.unmount()はVueコンポーネントを破棄するのみでマウント先の
#   div要素(#ygo-next-image-dialog-mount)自体はDOMに残り、新規作成されるdiv要素と
#   id重複した空のdivが残留するバグを発見した。本タスクで
#   `document.getElementById('ygo-next-image-dialog-mount')?.remove()`を追加して修正した。
#
# 既存テストの説明文・アサーションの不正確さ:
# - imageDialog.ts専用のテストは存在しなかったため、新規作成した。
#   @/components/ImageDialog.vue自体のUIロジックは対象外とし、スタブに差し替えた。

