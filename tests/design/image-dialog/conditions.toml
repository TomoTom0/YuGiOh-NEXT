# --- showImageDialogWithData(cgid, dno, deckData, buttonRect, genesysPoints) ---

[[condition]]
id = "show_image_dialog_with_data.unmounts_existing_dialog_first"
target_function = "showImageDialogWithData"
source_lines = "28-31"
description = "既にdialogAppが存在する場合、新しいダイアログを作成する前に既存のものをunmountしdialogAppをnullにリセットする（多重ダイアログ防止）"
given = "1回目のshowImageDialogWithData実行中に2回目を呼ぶ"
expect_side_effect = "1回目に作成されたmountPointがDOMから消える"

[[condition]]
id = "show_image_dialog_with_data.creates_mount_point_and_mounts"
target_function = "showImageDialogWithData"
