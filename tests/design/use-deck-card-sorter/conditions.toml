# 検証対象: src/composables/deck/useDeckCardSorter.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、Vue composableのデッキカードソート比較ロジック。
#
# 到達不能/実質到達不能分岐:
# - matchesPriorityCategory L129: 呼び出し元はL260でcardA/cardBのnullishを先に
#   returnしてからcardA/cardBを渡すため、公開comparator経由では到達不能。
# - compareCardsByType L144: public comparatorのdefaultモードではL274でカードタイプ差を
#   先に返し、compareCardsByTypeはカードタイプが同じ場合にだけ呼ばれるため、
#   通常の同期実行では後続の同一比較は到達不能。

[meta]
feature = "use-deck-card-sorter"
source_file = "src/composables/deck/useDeckCardSorter.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/composables/useDeckCardSorter.test.ts"
source_hash = "2475237d7f088429258def469cb9024f2ad6e8c8"
note = "verified=falseは2件: priority_category.null_card_falseとtype_compare_card_type_orderはいずれも先行ガード/比較により公開APIから通常到達不能。throw文は存在しない"

