# --- retryWithTimeout<T>(executor, options = {}): Promise<T> ---

[[condition]]
id = "retry_with_timeout_first_success"
target_function = "retryWithTimeout"
source_lines = "193-195"
description = "最初のattemptでwithTimeout(executor(), { ms: timeoutMs })がresolveした場合、その値を返し以後リトライしない"
given = "executorの1回目がresolveする"
expect_return = "executorのresolve値"

[[condition]]
id = "retry_with_timeout_timeout_then_success_after_delay"
target_function = "retryWithTimeout"
source_lines = "193-205"
description = "TimeoutErrorかつ最終attemptでない場合、100ms待機してcontinueし、次attemptで成功すればその値を返す"
given = "1回目はtimeoutMs以内にsettleせず、2回目はresolveする、maxRetries>=1"
expect_return = "2回目のexecutorのresolve値"
expect_side_effect = "2回目のexecutor呼び出しは100ms待機後"

[[condition]]
id = "retry_with_timeout_last_timeout_rethrows"
target_function = "retryWithTimeout"
source_lines = "197-201"
description = "TimeoutErrorかつattempt === maxRetriesの場合、そのTimeoutErrorをthrowする"
given = "全attemptがtimeoutMs以内にsettleしない"
expect_throw = "最後のTimeoutError"

[[condition]]
id = "retry_with_timeout_non_timeout_rethrows_immediately"
target_function = "retryWithTimeout"
source_lines = "199-209"
description = "catchしたerrorがTimeoutErrorでない場合、リトライ待機せず即座にそのerrorをthrowする"
given = "executorが通常のErrorでrejectする"
expect_throw = "対象Promiseのreject理由"
expect_side_effect = "executor呼び出しは1回のみ"

[[condition]]
id = "retry_with_timeout_negative_retries_max_exceeded"
target_function = "retryWithTimeout"
source_lines = "193,213-214"
description = "maxRetriesが負数の場合、forループに入らずTimeoutError('Max retries exceeded')をthrowする"
given = "options={ maxRetries: -1 }"
expect_throw = "TimeoutError: Max retries exceeded"
expect_side_effect = "executorは呼ばれない"

