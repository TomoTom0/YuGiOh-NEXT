# 検証対象: src/utils/promise-timeout.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、非同期処理・タイムアウト制御を持つutils。
#
# 実装コメントとの差異:
# - retryWithTimeout L213-214 は「到達不可」とコメントされているが、maxRetries < 0 や NaN の場合は
#   forループに一度も入らず TimeoutError('Max retries exceeded') に到達する。

[meta]
feature = "promise-timeout"
source_file = "src/utils/promise-timeout.ts"
verified = true
verified_at = "2026-08-07"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/utils/promise-timeout.test.ts"
source_hash = "3befeb8d8d89e9148cb4f01283ab0d64210a6457"
note = "verified=falseは0件"

# --- withTimeout<T>(promise: Promise<T>, options: TimeoutOptions = {}): Promise<T> ---

[[condition]]
id = "with_timeout.promise_resolves_before_timeout"
target_function = "withTimeout"
source_lines = "59-63"
description = "対象Promiseがタイムアウト前にresolveした場合、その値でresolveし、finally内でtimeoutIdがundefinedでなければclearTimeoutする"
given = "promiseがms経過前にresolveする"
expect_return_shape = "Promiseは対象Promiseのresolve値でresolveし、タイムアウトコールバックは実行されない"

[[condition]]
id = "with_timeout.promise_rejects_before_timeout"
target_function = "withTimeout"
source_lines = "59-63"
description = "対象Promiseがタイムアウト前にrejectした場合、その理由でrejectし、finally内でtimeoutIdがundefinedでなければclearTimeoutする"
given = "promiseがms経過前にrejectする"
expect_throw = "対象Promiseのreject理由"

[[condition]]
id = "with_timeout.timeout_rejects_default_message"
target_function = "withTimeout"
source_lines = "44-56"
description = "options.ms/message未指定で対象Promiseがsettleしない場合、5000ms後にTimeoutError('Promise timeout after 5000ms')でrejectする"
given = "promiseがsettleしない、options={}"
expect_throw = "TimeoutError: Promise timeout after 5000ms"

[[condition]]
id = "with_timeout.timeout_rejects_custom_message_and_callback"
target_function = "withTimeout"
source_lines = "44-56"
description = "message/onTimeout指定時にタイムアウトした場合、onTimeoutを呼んでから指定messageのTimeoutErrorでrejectする"
given = "promiseがsettleしない、options={ ms: 25, message: 'custom timeout', onTimeout }"
expect_throw = "TimeoutError: custom timeout"
expect_side_effect = "onTimeoutが1回呼ばれる"

[[condition]]
id = "with_timeout.timeout_without_callback"
target_function = "withTimeout"
source_lines = "53-55"
description = "onTimeout未指定でタイムアウトした場合、optional chainingによりコールバック呼び出しは行われずTimeoutErrorでrejectする"
given = "promiseがsettleしない、options={ ms: 25 }"
expect_throw = "TimeoutError: Promise timeout after 25ms"

# --- TimeoutError.isTimeoutError(error: any): error is TimeoutError ---

[[condition]]
id = "timeout_error.instance_true"
target_function = "TimeoutError.isTimeoutError"
source_lines = "83-84"
description = "errorがTimeoutErrorインスタンスの場合はtrueを返す"
given = "error = new TimeoutError('x')"
expect_return = true

[[condition]]
id = "timeout_error.name_true"
target_function = "TimeoutError.isTimeoutError"
source_lines = "83-84"
description = "errorがTimeoutErrorインスタンスでなくてもname === 'TimeoutError'ならtrueを返す"
given = "error = { name: 'TimeoutError' }"
expect_return = true

[[condition]]
id = "timeout_error.other_false"
target_function = "TimeoutError.isTimeoutError"
source_lines = "83-84"
description = "errorがTimeoutErrorインスタンスではなくnameも'TimeoutError'でない場合はfalseを返す"
given = "error = new Error('x')"
expect_return = false

[[condition]]
id = "timeout_error.nullish_throws"
target_function = "TimeoutError.isTimeoutError"
source_lines = "83-84"
description = "errorがnull/undefinedの場合、error.name参照によりTypeErrorをthrowする"
given = "error = null"
expect_throw = "TypeError"

