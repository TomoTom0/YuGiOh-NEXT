# 検証対象: src/components/ChatPanel.vue
#
# 経緯:
# - TASK-507（searchStore.searchResults/allResultsのCardInfo[]型統一）のテスト先行Phaseで
#   回帰条件1件のみの最小条件書として作成（deck-sections-pass-search-results-directly。
#   同条件とそのテストは本書でも維持する）
# - TASK-573（TASK-331 Tier C第24号）でChatPanel.vue本体を全面条件化した。旧excluded
#   「ChatPanel.vue本体の全面条件化は別タスク」は本タスクで全面化するため削除し、
#   style L319-537は静的スタイル定義のためexcludedへ移動した
#
# TASK-507当時の背景（同条件の由来）:
# - ChatPanel.vue buildDeckSectionsの searchResults: searchStore.searchResults.map(r => r.card) は
#   CardInfo（MonsterCard/SpellCard/TrapCardのunion）にcardプロパティが存在しないため、
#   実行時は常にundefined配列をLLM用DeckSections.searchResultsへ渡す潜在バグだった
# - TASK-507のstore型統一（CardInfo[]）に伴い、searchStore.searchResultsの直接渡しへ修正した
#
# 粒度方針（Tier C・第8号〜第23号条件書と同一）:
# - 1条件=1振る舞いclass。分岐の列挙（summarizeToolResult/formatToolArgsのツール別書式・
#   ツール結果3形状の収集など）はテスト側（it.each等）で持ち、条件書には親条件のみ置く
# - 観測対象は描画結果・chat mockへの引数（request/apiKey/storeRefs/コールバック/signal）・
#   store状態・emit相当の振る舞い。vm内部（messages/inputText等のref）は直接参照しない
# - llm-chat-service（chat/ChatAbortError）とgetCardInfoはmodule mock、各storeは実物
#   （deckStoreのアクションはspy）で差し替え、ChatPanel側の呼び出し引数と反映のみ検証する

