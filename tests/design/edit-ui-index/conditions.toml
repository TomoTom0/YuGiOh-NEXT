# 検証対象: src/content/edit-ui/index.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開、content残り)。
#
# 本ファイルの性質: デッキ編集UI(Vue)のエントリーポイント。export関数を持たず、
# トップレベルのIIFE(356-368行目)からwatchUrlChanges()→loadEditUI()→initVueApp()の
# 呼び出し連鎖として全ロジックに到達する。content/index.tsと異なりwebpack依存の
# グローバル代入は無く、依存も少ないため、vi.resetModules()による都度の動的import
# + './DeckEditLayout.vue'のモック化で現実的にユニットテスト可能と判断した。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - edit-ui/index.ts専用のテストは存在しなかった（DeckEditLayout.vue自体のテストは
#   tests/unit/deck-display/DeckEditLayout.test.tsに別途40件存在する）。

