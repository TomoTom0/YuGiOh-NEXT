# --- 検証困難な条件 ---

[[condition]]
id = "load_edit_ui.updates_header_height_css_variable_on_resize"
target_function = "loadEditUI"
source_lines = "222-227"
description = "headerElement.offsetHeightを読み取り--header-height CSS変数に反映する。ResizeObserverのコールバックでも同様に更新する"
given = "header要素のoffsetHeightが変化する"
expect_side_effect = "document.documentElement.style.getPropertyValue('--header-height')が更新される"
verified = false
unverifiable_reason = "happy-domはレイアウト計算を行わないためoffsetHeightは常に0を返し、実際の高さ変動の再現ができない"

[[condition]]
id = "init_vue_app.mounts_app_and_waits_next_tick"
target_function = "initVueApp"
source_lines = "324-346"
description = "vueModulesPromise(vue/pinia/DeckEditLayout.vueの事前import)を待ち、createApp・pinia登録・app.mountを行った上でnextTick()の完了を待つ"
given = "正常系でinitVueAppを実行"
expect_side_effect = "#vue-edit-app配下にDeckEditLayoutコンポーネントがマウントされる"
verified = false
unverifiable_reason = "モジュールトップレベルのvueModulesPromiseはモジュール初回evaluate時に1度だけ生成されるため、DeckEditLayout.vueをテストごとにモック差し替えるには追加のモジュールキャッシュ制御が必要で、実際のマウント結果はDeckEditLayout.test.ts側で別途40件検証済みのため本ファイルでは重複検証としない"

[[condition]]
id = "watch_url_changes.header_resize_observer_leak_prevention_across_many_visits"
target_function = "loadEditUI"
source_lines = "228-235"
description = "編集URLへの複数回の出入りを繰り返してもheaderResizeObserverが1つのインスタンスに保たれる（モジュールスコープ変数のため、observerが際限なく増え続けない）"
given = "編集URL訪問→離脱→再訪問を3回繰り返す"
expect_side_effect = "3回目終了時点でもheaderResizeObserverは1インスタンスのみ生存する"
verified = false
unverifiable_reason = "実際のResizeObserverインスタンス数の生存確認にはグローバルなインスタンス追跡が必要で、単体テストでの直接観測が困難なため、disconnectが呼ばれることの確認(load_edit_ui.resize_observer_disconnects_previous_before_reobserving)で代替する"
