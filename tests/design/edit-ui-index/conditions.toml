# --- applyThemeFromSettings() [非export] ---

[[condition]]
id = "apply_theme.uses_memory_cache_when_available"
target_function = "applyThemeFromSettings"
source_lines = "52-55"
description = "window.ygoNextCurrentSettingsが既に設定済みの場合、Chrome Storageへの問い合わせを行わずそれを使う"
given = "window.ygoNextCurrentSettings = { theme: 'dark' }"
expect_side_effect = "chrome.storage.local.getは呼ばれない"

[[condition]]
id = "apply_theme.falls_back_to_storage_when_no_cache"
target_function = "applyThemeFromSettings"
source_lines = "55-67"
description = "メモリキャッシュが無い場合、chrome.storage.local.getから設定を取得しwindow.ygoNextCurrentSettingsに保存する"
given = "window.ygoNextCurrentSettingsが未設定"
expect_side_effect = "chrome.storage.local.getが呼ばれ、結果がwindow.ygoNextCurrentSettingsに設定される"

[[condition]]
id = "apply_theme.system_theme_follows_match_media"
target_function = "applyThemeFromSettings"
source_lines = "73-77"
description = "theme==='system'（またはthemeが未設定でデフォルト'system'扱い）の場合、window.matchMedia('(prefers-color-scheme: dark)')の一致有無でdata-ygo-next-theme属性を決定する"
given = "theme: 'system'、matchMediaがdark一致"
expect_side_effect = "document.documentElement の data-ygo-next-theme が'dark'になる"

[[condition]]
id = "apply_theme.explicit_theme_used_directly"
target_function = "applyThemeFromSettings"
source_lines = "78-80"
description = "themeが'system'以外の明示値の場合、そのままdata-ygo-next-theme属性に設定する（matchMediaは参照しない）"
given = "theme: 'dark'"
expect_side_effect = "document.documentElement の data-ygo-next-theme が'dark'になる"

[[condition]]
id = "apply_theme.error_falls_back_to_light_and_white_bg"
target_function = "applyThemeFromSettings"
source_lines = "98-105"
description = "Storage取得がタイムアウト/エラーになった場合、console.warnし、テーマを'light'・背景色を'#ffffff'に強制設定する"
given = "callbackToPromiseがタイムアウトでrejectする"
expect_side_effect = "document.documentElement の data-ygo-next-theme が'light'、backgroundColorが白になる"

