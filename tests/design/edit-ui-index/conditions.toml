# 検証対象: src/content/edit-ui/index.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開、content残り)。
#
# TASK-513（テスト先行更新+実装完了）: prefetch済みedit-uiモジュールがhash遷移時に
# マウントしない問題の修正（設計A案: 非編集ページでもwatchUrlChanges()を登録。
# applyThemeFromSettingsはisVueEditPage()ガード内に残留）+ 世代トークン機構
# （編集URL離脱時のloadEditUI中止）に伴う条件の書き換え・追加。
# 書き換え・新規のidはtest-structure skill §2のstable id形式（kebab-case・underscore禁止。
# content-index条件書のtop-level系idと同じ形式）で発行し、旧条件のタグは新idへ張り替えた。
# 実装後の全件PASS確認をもって[meta]の検証記録を書いた。実装後レビュー（codex）の
# 必須2件+改善2件に対応し、中止判定3（Vue初期化後の言語リンク差し替え前チェック）を
# 追加、テストのasキャストをヘルパー化、急速離脱->再入の同時進行テストを追加した。
# 旧snake_case id（TASK-330由来）のSTABLE_ID_RE不一致は既知のlegacy failのまま。
# TASK-513新規2条件（load-edit-ui.aborts.../init-vue-app.skips-mount...）のsource_linesは
# レビュー指摘4により実装行（legacy数値形式）を参照する。verify scriptのsource_lines
# 自動同期はlegacy形式を対象外とするため、この2条件は同期されず既存25条件と同じ
# 「legacy形式のため同期対象外」warnを1件ずつ生む（本ファイルの実装行参照の既存慣行と同一）。
#
# 本ファイルの性質: デッキ編集UI(Vue)のエントリーポイント。export関数を持たず、
# トップレベルのIIFE(397-410行目)からwatchUrlChanges()→loadEditUI()→initVueApp()の
# 呼び出し連鎖として全ロジックに到達する。content/index.tsと異なりwebpack依存の
# グローバル代入は無く、依存も少ないため、vi.resetModules()による都度の動的import
# + './DeckEditLayout.vue'のモック化で現実的にユニットテスト可能と判断した。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - edit-ui/index.ts専用のテストは存在しなかった。DeckEditLayout.vue自体のマウント検証は
#   TASK-487の再設計により tests/unit/content/deck-edit-layout.test.ts（実pinia+実store
#   によるmount、tests/design/deck-edit-layout/conditions.tomlに紐付け）が担う。

