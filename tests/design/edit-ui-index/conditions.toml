[[condition]]
id = "load-edit-ui.aborts-before-dom-prep-when-left-during-theme-await"
source_lines = "211-222"
target_function = "loadEditUI"
source = "TASK-513設計A案・世代トークン機構の中止判定1（恒久参照先はtm TASK-513。設計書: tmp/20260916_design_task513_hashchange-prefetch.md）"
description = "loadEditUIは開始時点の世代トークン（urlLeaveGeneration）を記録し、applyThemeFromSettings()のawait中に編集URLを離脱（hashchangeリスナの離脱分岐で世代増分）していた場合、await復帰後の世代不一致を検出してDOM準備（#bg書き換え・editUiStyles注入・#vue-edit-app生成）より前に中断する（公式DOMへの副作用ゼロで中止）。中止時にisEditUILoadedには触らない（離脱リスナがfalseに戻しており、離脱→即再入時は再入で開始した新規loadEditUIがフラグを管理するため）。急速離脱→再入で旧世代と新世代のloadEditUIが同時進行した場合も、旧世代の中止が新世代のフラグ/マウント結果を壊さない（レビュー改善指摘3対応テストで検証）"
given = "テーマ適用をchrome.storage.local.getのdeferredで保留した状態（メモリキャッシュ無し）でloadEditUIを開始し、保留中にisVueEditPage()=falseへ切り替えてhashchangeを発火（離脱・世代増分）させた後、deferredを解放する"
expect_return_shape = "#vue-edit-appが生成されずeditUiStylesも注入されない（#bgの既存内容も破壊されない）。同時進行ケースでは旧世代中止後に新世代のマウントが完了し、追加のhashchangeでも再ロードされない（#vue-edit-appの要素同一性が保たれる）"

[[condition]]
id = "init-vue-app.skips-mount-when-left-during-module-await"
source_lines = "333-338, 373-377"
target_function = "initVueApp"
source = "TASK-513設計A案・世代トークン機構の中止判定2（恒久参照先はtm TASK-513。設計書: tmp/20260916_design_task513_hashchange-prefetch.md）"
description = "マウント直前の世代チェック: vueModulesPromiseやsettings store dynamic importのawait中に編集URLを離脱（世代増分）していた場合、app.mountを実行せずreturnする（Vueアプリの公式ページへのマウント防止）。さらにVue初期化後の後続処理前にも同一の世代チェック（中止判定3）を置き、マウント中断と同一世代の場合はreplaceLanguageChangeLinksも実行しない（公式ページの言語リンク書き換えの副作用残存防止。実装後レビュー必須指摘1対応）。設計rev2ではvueModulesPromiseの完了タイミングをテストから制御できないためunverifiable扱いだったが、中止判定2はキャッシュ設定あり経路のdynamic import('../../stores/settings')もawait対象であるため、これをdeferred制御すればマウント直前離脱が決定的に再現できる"
given = "window.ygoNextCurrentSettingsが設定された状態でloadEditUIを開始し（中止判定1は通過しDOM準備済み）、initVueApp内のsettings store importをテスト側のdeferredで保留している間にisVueEditPage()=falseへ切り替えてhashchangeを発火（離脱・世代増分）させた後、deferredを解放する"
expect_return_shape = "DOM準備済みの#vue-edit-appにはVueアプリがマウントされない（mount時にVue 3がコンテナへ付与するdata-v-app属性が付かない）・言語リンク（javascript:ChangeLanguageパターン）も書き換えられない。再入時の新規loadEditUIではマウントと言語リンク差し替えが実行される"

