# --- computeImageDialogLayout: サイズ計算（設計書§1） ---

[[condition]]
id = "layout.scale-keeps-1-when-content-fits"
source_lines = "tests/unit/utils/image-dialog-layout.test.ts:35"
target_function = "computeImageDialogLayout"
source = "TASK-511設計書v2（tmp/20260916_design_task511_image-dialog-layout.md）§1"
description = "コンテンツ幅+両側paddingが外枠上限（min(vw-2*VIEWPORT_MARGIN, MAX_DIALOG_WIDTH)）に収まる場合は縮小しない（scale=1）。外枠幅は常にcontentWidth+2*DIALOG_PADDING"
given = "viewport=1280x800, contentWidth=600（600+40=640が上限640にちょうど収まる）, buttonRect=null"
expect_return = "scale=1, contentWidth=600, width=640, maxHeight=min(800*0.85, 800-32)=680"

[[condition]]
id = "layout.scale-shrinks-content-width-to-fit"
source_lines = "tests/unit/utils/image-dialog-layout.test.ts:60"
target_function = "computeImageDialogLayout"
source = "TASK-511設計書v2（tmp/20260916_design_task511_image-dialog-layout.md）§1"
description = "上限超過時はコンテンツ幅（.background-image実幅=画像表示幅）基準で縮小する。scale=max(0,min(1,(maxDialogWidth-2*padding)/contentWidth))でpaddingは縮小対象外の実px。高さはscaleで詰めずmaxHeight+縦スクロールで担保する（border-boxの二重縮小解消が本修正の目的）"
given = "viewport=1280x800（外枠上限=min(1248,640)=640）, contentWidth=750, buttonRect=null"
expect_return = "scale=0.8, contentWidth=600, width=640, maxHeight=680"

[[condition]]
id = "layout.max-height-normalized-on-short-viewport"
source_lines = "tests/unit/utils/image-dialog-layout.test.ts:76"
target_function = "computeImageDialogLayout"
source = "TASK-511設計書v2（tmp/20260916_design_task511_image-dialog-layout.md）§2（クランプ保証の成立条件）"
description = "maxHeight=min(vh*0.85, vh-2*VIEWPORT_MARGIN)の正規化により、vh<214ではvh-32が選ばれclampY上限（vh-maxHeight-16）>=16が成立する。vh<32は位置保証対象外（入力契約）"
given = "viewport=1280x160, contentWidth=750, buttonRect=null"
expect_return = "maxHeight=min(136,128)=128。top=clampY(16)=16でtop+maxHeight=144=vh-16に収まる"

