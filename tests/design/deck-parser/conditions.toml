# --- parseCardRow(row: HTMLElement): DeckCardRef | null ---

[[condition]]
id = "parse_card_row.card_type_missing"
target_function = "parseCardRow"
source_lines = "41-44"
description = "detectCardType(row)がnullを返す場合、以降のフィールドを読まずnullを返す"
given = ".box_card_attribute img が無い、またはsrcが認識対象のattribute_iconを含まないrow"
expect_return = "null"

[[condition]]
id = "parse_card_row.card_id_missing"
target_function = "parseCardRow"
source_lines = "50-53"
description = "検出したカードタイプに対応するinput[name=...CardId]が無い、またはvalueが空文字の場合nullを返す"
given = "モンスター行だが input[name=\"monsterCardId\"] が無い、または value=\"\""
expect_return = "null"

[[condition]]
id = "parse_card_row.name_missing_or_text_null"
target_function = "parseCardRow"
source_lines = "57-60"
description = ".card_name要素が無い、またはtextContentがfalsyの場合nullを返す"
given = "カードIDはあるが .card_name が無いrow"
expect_return = "null"

[[condition]]
id = "parse_card_row.name_trimmed_even_if_empty"
target_function = "parseCardRow"
source_lines = "57-61,95-128"
