[[condition]]
id = "parse_card_row.imgs_malformed_keeps_defaults"
target_function = "parseCardRow"
source_lines = "71-77"
description = "imgsValueがtruthyでもsplit結果が2要素未満、またはparts[1]が空文字の場合、ciid/imgHashはデフォルトのままになる"
