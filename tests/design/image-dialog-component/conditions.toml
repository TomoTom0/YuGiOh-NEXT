# 粒度方針（Tier C・第8号〜第22号条件書と同一）:
# - 1条件=1振る舞いclass。分岐の列挙はテスト側で持ち、条件書には親条件のみ置く
# - 観測対象は描画結果（表示・ラベル・クラス・style）とlocalStorage・生成/ダウンロード
#   関数の呼び出し引数・emit。vm内部状態は直接参照しない
