# - TASK-572（TASK-331 Tier C第23号・TASK-571第22号の後続）。Tier C残候補の
#   ImageDialog.vue本体（730行）。レイアウト計算はTASK-511で
#   src/utils/image-dialog-layout.tsへ抽出・条件化済み（image-dialog-layout条件書）。
#   起動側はimage-dialog条件書（src/content/deck-recipe/imageDialog.ts）が保証。
#   本書はコンポーネント本体のscriptロジック（初期化・設定永続化・プレビュー再生成・
