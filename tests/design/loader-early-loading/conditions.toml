[[condition]]
id = "main.ids-match-extension-ids-constants"
source_lines = "tests/unit/content/loader-early-loading.test.ts:560"
target_function = "loader.jsのID/キー定数"
source = "TASK-510技術設計（docs/design/loader-early-loading-tech.md）§1 IDS/SETTINGS_KEY（EXTENSION_IDS/STORAGE_KEY_SETTINGSと同一文字列）・リスク4（二重管理のずれ機械検知）+ §5条件案"
description = "loader.jsが直書きで持つoverlay/early-hide IDとsettingsキーが、src側定数（EXTENSION_IDS.loading / STORAGE_KEY_SETTINGS）と一致する（webpack外のため共有不能な二重管理のずれ検知）"
given = "loader.jsのソースと src/utils/dom-selectors.ts / src/constants/storage-keys.ts の実定数"
