# 検証対象: public/loader.js
#
# 経緯: TASK-510（ロード画面の最初の描画前表示・チラつき解消）。テスト先行として
# 実装（段階6）に先立って条件書・テストコードを作成した。一次出典はTASK-510実装設計
# rev2（codex設計レビュー6指摘反映済み。実装完了後に
# docs/design/loader-early-loading-tech.md へ清書し、source参照も清書先へ更新済み）。
#
# idについて: 設計書§5の条件ID案はunderscore形式（is_ytomo_hash.* 等）だが、
# test-structure skill §2のstable id形式（underscore不可・kebab）とverify-conditions.pyの
# schema検証に適合させるためkebab形式へ変換して発行した（案のunderscoreは`_`→`-`置換のみ。
# 対応は1:1）。設計書の「19条件案」は箇条書き19項目で、展開すると23idになる
# （純関数6 + createLoader 7 + 状態機械7 + 本番アダプタ3）。
#
# 本ファイルの性質: public/loader.js はwebpack外のclassic script（ESM化しない）。
# テストは fs.readFileSync + vm.Script による評価（module オブジェクト注入でexportフックから
# 取り出し）+ createLoader(deps) への依存注入（happy-dom document・fake timer・importContent spy）
# で駆動する（設計書§5テスト方式・指摘6対応）。本番アダプタはmodule定義下で起動しないため
# 動的importの実呼び出しは無く、コード包含検証で担保する。
#
# 実装（TASK-510段階6）完了: 全条件 green。検証記録は [meta] に記載。
# コードレビュー（codex）対応で4条件を追加: boot-non-ytomo-never-accesses-storage・
# boot-ytomo-storage-error-falls-back-to-default-theme・own-elements-carry-loader-attribute・
# production-adapter.style-loader-inserts-into-head-or-document-element（計27条件）。

