[[condition]]
id = "production-adapter.style-loader-inserts-into-head-or-document-element"
source_lines = "tests/unit/webpack/dynamic-import-bundle.test.ts:268"
target_function = "webpack.config.cjs の style-loader options.insert（scripts/lib/style-insert.cjs）"
source = "TASK-510技術設計（docs/design/loader-early-loading-tech.md）§9 追補（コードレビュー指摘1: document_startでのstyle-loader例外によりcontent.js起動不能になる経路の解消）"
description = "css/scss両ruleのstyle-loaderが挿入先モジュール scripts/lib/style-insert.cjs（document.head || document.documentElement）をoptions.insertに指定する。head未生成（document_start評価）でもスタイル注入の例外でcontent.jsのモジュール評価全体が失敗しない。headが存在する通常ページ（popup/options等）では挙動不変"
given = "webpack.config.cjs・scripts/lib/style-insert.cjs のソース、およびビルド後の dist/content.js"
expect_return_shape = "挿入先モジュールが存在しheadフォールバックを含む。css/scss両ruleがinsertに指定している。dist/content.jsはカスタム挿入先を含みデフォルト挿入モジュール（dist/runtime/insertBySelector）を含まない"

