# --- useFilterLogic(pageLanguage) ---

[[condition]]
id = "use_filter_logic.returns_public_members"
target_function = "useFilterLogic"
source_lines = "16-20,442-489"
description = "useSearchStore()を取得し、exclusionResultをsearchStore.exclusionResultへ追従するcomputedとして作成し、無効化判定・チップ表示・フィルタ操作の公開メンバーを返す"
given = "Piniaのsearch storeが有効な状態でuseFilterLogic(pageLanguage)を呼ぶ"
expect_return_shape = "isMonsterTypeFieldDisabled等のcomputedと、toggleAttribute等の操作関数を含むオブジェクト"

