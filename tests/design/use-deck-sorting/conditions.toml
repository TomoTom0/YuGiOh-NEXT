# 検証対象: src/composables/deck/useDeckSorting.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、デッキ編集の公式ソート（モンスター→魔法→罠＋最初の登場順）を行う
# 純粋関数 sortDisplayOrderForOfficial のみを export する composable ファイル。
#
# ファイル構成の注意:
# ファイル名は useDeckSorting.ts だが、export しているのは sortDisplayOrderForOfficial
# という通常の純粋関数1件のみ（composable factory パターン useXxx() がオブジェクトを返す形式
# ではない）。したがって target_function は関数名そのまま記載し、use-deck-snapshot と同じ
# 通常形式を使う。AST抽出スクリプトで export 関数1件が検出される（追加メソッドなし）。
#
# 到達不能/実質到達不能分岐（条件化せず）:
# - L70 `CARD_TYPE_SORT_ORDER[type] ?? 0`: type が truthy のとき到達しうるが、
#   CARD_TYPE_SORT_ORDER は `Record<CardType, number>` で CardType='monster'|'spell'|'trap'
#   の3キーを全て持つため、type が正しい CardType なら常に数値が返り `?? 0` は発火しない
#   （型システム保証済み）。
# - L91-92 `firstAppearance.get(a.cid) || 0` の `|| 0`: firstAppearance は displayOrder の
#   forEach で構築され、sorted は displayOrder 由来のため a.cid は必ず firstAppearance に存在
#   する。実質到達不能。index が 0 の場合は `0 || 0` = 0 で同じ結果になる。
#
# 既知の設計上の注意点（バグではないが複雑な挙動。実装読解で判明、ドキュメント側に記載なし）:
# - cardTypeMap は cid 単位で構築される（cid_ciid ではない）。同一 cid が deck に複数回出現
#   しても最後の cardType で上書きされるが、cardType は cid で一意に定まるため実害なし。
# - sortedDisplayOrder は displayOrder の全要素（重複含む）を保持するが、sortedDeck は
#   seenCards で cid_ciid の重複を除去する。そのため displayOrder に同一 cid+ciid の重複
#   エントリがある場合、sortedDisplayOrder.length > sortedDeck.length になり得る（非対称）。
# - DisplayCardRef.ciid は型上 number だが実行時には文字列で渡されることもあり（既存テスト
#   でも ciid: '1' と ciid: 1 が混在）、deck.find では `String(dc.ciid)` で文字列化して
#   DeckCardRef.ciid（string）と比較する。この型強制がないと number 1 !== string '1' で
#   マッチしない（L107）。
# - L84-85 `cardTypeMap.get(a.cid) || 0`: cardTypeMap は deck 由来だが sorted は displayOrder
#   由来のため、displayOrder にのみ存在する cid だと get が undefined を返り `|| 0` で
#   モンスター扱いになる。condition sort.skips_display_cards_without_matching_deck_card で
#   扱うシナリオ（deck にない cid は sortedDeck からも除外される）と同居する。
# - displayOrder に含まれるが deck に含まれない cid+ciid は、sortedDisplayOrder には
#   （モンスター扱いでソートされて）残るが sortedDeck からは除外される（find が undefined
#   を返すため）。displayOrder と deck の整合性が崩れているデータでのみ発生しうる。

[meta]
