# --- hiraganaToKatakana(char): string ---

[[condition]]
id = "hiragana_to_katakana.non_hiragana_fallback"
target_function = "hiraganaToKatakana"
source_lines = "48-51"
description = "コードが0x3041-0x3096の範囲外（ひらがなでない文字）の場合、変換せずcharをそのまま返す"
given = "hiraganaToKatakana('ア')のように、ひらがな以外の文字を直接渡した場合を想定"
expect_return = "引数と同じ文字"
verified = false
unverifiable_reason = "hiraganaToKatakanaはexportされておらず、唯一の呼び出し元getKanaGroup L61-63はisHiragana(char)===trueの場合のみこの関数を呼ぶ。そのため公開API assignCategoryGroups 経由ではelseブランチ（非ひらがな文字での呼び出し）に到達する入力を構成できない。コード上のフォールバックとして存在を確認したのみで、実行時の到達は未検証。"

# --- isKanaReadable(char): boolean ---
# isHiragana/isKatakana の単純な論理和であり、単体では意味のある分岐を生まない（README 2節の
# 「書かない」基準：trivialな判定の組み合わせ）。効果はassign.*/nonkana.*の各conditionで
# 間接的に検証されるため、個別のconditionは設けない。
