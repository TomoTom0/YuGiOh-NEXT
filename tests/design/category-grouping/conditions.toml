# 検証対象: src/utils/category-grouping.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、カテゴリリストの50音順グループ判定を行うutils。
#
# 実装コメントとの差異:
# - なし（実装コメントは概要のみで、個々の分岐条件についての記載はない）
#
# 公開APIは assignCategoryGroups のみ（他はモジュール非export）。
# extract-ast-skeleton.ts は export関数のみを対象とするため、determineGroupForNonKana /
# getGroupsBetween / getKanaGroup / hiraganaToKatakana / isHiragana / isKatakana /
# isKanaReadable は「未カバー検出」の対象にならない（tests/design/README.md 5節の既知の限界）。
# これらは assignCategoryGroups 経由の間接呼び出しとしてのみ到達可能なため、target_function に
# 内部関数名を用いつつ given/expect は assignCategoryGroups の入出力で記述する。

[meta]
feature = "category-grouping"
source_file = "src/utils/category-grouping.ts"
verified = true
verified_at = "2026-08-28"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/category-grouping.test.ts"
source_hash = "7dec654743f31f561a9e6f2ba03f88718d044138"
note = "verified=falseは1件（hiragana_to_katakana.non_hiragana_fallback、公開APIから到達不可）"

# --- assignCategoryGroups(categories): CategoryEntry[] ---

[[condition]]
id = "assign.index0_hardcoded_o"
target_function = "assignCategoryGroups"
source_lines = "181-183"
description = "index===0の場合、labelの内容に関わらずgroup=['ruby_オ']を固定で返す（カナ判定は行わない）"
given = "categories[0] = { value: 'x', label: '王家の神殿' }（labelを別の文字列に変えても結果は変わらない）"
expect_return_shape = "result[0].group === ['ruby_オ']"

[[condition]]
id = "assign.index1_hardcoded_a"
target_function = "assignCategoryGroups"
source_lines = "184-187"
description = "index===1の場合、labelの内容に関わらずgroup=['ruby_ア']を固定で返す"
given = "categories[1] = { value: 'y', label: '赤き竜' }"
expect_return_shape = "result[1].group === ['ruby_ア']"

[[condition]]
id = "assign.kana_readable_uses_getKanaGroup"
target_function = "assignCategoryGroups"
source_lines = "189-193"
description = "index>=2でlabelの先頭文字がひらがな/カタカナの場合、getKanaGroup(firstChar)の1件のみを含む配列を返す"
given = "index=2, categories[2].label = 'カラクリ'"
expect_return_shape = "result[2].group === ['ruby_カ']"

[[condition]]
id = "assign.empty_label_dispatches_nonkana_helper"
target_function = "assignCategoryGroups"
source_lines = "190-196"
description = "labelが空文字の場合、cat.label[0]はundefinedとなりfirstChar&&...の条件がfalseになるため、determineGroupForNonKanaに分岐する（カナ文字以外と同じ経路）"
given = "index>=2, categories[index].label = ''、前後は通常のカナ始まりlabel"
expect_return_shape = "determineGroupForNonKanaの戻り値（前後カテゴリのgroupに基づく）がそのまま使われる"

[[condition]]
id = "assign.nonkana_char_dispatches_helper"
target_function = "assignCategoryGroups"
source_lines = "194-196"
description = "index>=2でlabelの先頭文字が存在するがひらがな/カタカナでない場合（漢字・英数字・記号等）、determineGroupForNonKanaの結果を返す"
