expect_return_shape = "determineGroupForNonKanaの戻り値がそのまま使われる"

# --- determineGroupForNonKana(index, categories): string[] ---

[[condition]]
id = "nonkana.backward_search_skips_falsy_label"
target_function = "determineGroupForNonKana"
source_lines = "121-123"
description = "後方探索で categories[i]?.label が falsy（labelが空文字、または categories[i] 自体が存在しない）の場合、その要素は無視してさらに前(i-1)を調べる"
given = "index=4（対象label='甲虫装機'）, categories[3].label='', categories[2].label='アロマ'"
expect_return_shape = "prevGroupはcategories[2]（ruby_ア）から決まる（categories[3]の空labelはスキップされる）"

[[condition]]
id = "nonkana.backward_search_skips_nonkana_char"
target_function = "determineGroupForNonKana"
source_lines = "125-130"
description = "後方探索でfirstCharは存在するがカナ読み不可（漢字等）の場合、breakせずループを継続してさらに前を調べる"
given = "index=4, categories[3].label='甲虫装機'（漢字）, categories[2].label='カラクリ'"
expect_return_shape = "prevGroupはcategories[2]（ruby_カ）から決まる（categories[3]はスキップされる）"

[[condition]]
