# --- getGroupsBetween(start, end): string[] ---

[[condition]]
id = "groups_between.normal_range"
target_function = "getGroupsBetween"
source_lines = "89-101"
description = "start/endの'ruby_'を除いた文字がともにKANA_LIST内に存在し、startのインデックス<=endのインデックスの場合、その区間の全文字を'ruby_'プレフィックス付きで返す（endを含む）"
given = "start='ruby_カ', end='ruby_サ'"
expect_return = "['ruby_カ', 'ruby_キ', 'ruby_ク', 'ruby_ケ', 'ruby_コ', 'ruby_サ']"

[[condition]]
id = "groups_between.invalid_kana_fallback"
target_function = "getGroupsBetween"
source_lines = "89-94"
description = "startまたはendの'ruby_'を除いた文字がKANA_LISTに存在しない場合（小書き文字'ッ'や長音符'ー'等。isKatakanaの判定範囲(0x30A0-0x30FF)はKANA_LISTより広く、小書き文字や長音符も『カナ読み可能』と判定されてgetKanaGroupに渡るが、dakutenMapにもKANA_LISTにも含まれないためそのままseionとして使われる）、[start, end]をそのまま返す（範囲展開されない）"
given = "対象カテゴリ（漢字始まり）の直前のカテゴリlabelが小書きの'ッ'で始まり(例:'ッターゲット')、直後が通常のカナ始まりlabel(例:'サイバー')。determineGroupForNonKanaの後方探索でprevGroup=getKanaGroup('ッ')='ruby_ッ'、前方探索でnextGroup='ruby_サ'となり、prevGroup!==nextGroupのためgetGroupsBetween('ruby_ッ', 'ruby_サ')が呼ばれる"
expect_return = "['ruby_ッ', 'ruby_サ']（KANA_LIST.indexOf('ッ') === -1のため範囲展開されずstart/endがそのまま返る）"

[[condition]]
id = "groups_between.reversed_order_returns_empty"
target_function = "getGroupsBetween"
source_lines = "96-99"
description = "startのKANA_LIST内インデックスがendのインデックスより後ろにある場合（前方カテゴリの方が後方カテゴリより50音順で後にある＝カテゴリ配列が50音順に並んでいない場合）、for (i=startIndex; i<=endIndex; i++) が一度も実行されず空配列を返す"
given = "prevGroup='ruby_ラ', nextGroup='ruby_ア'（例: 前='ラッシュ'（ruby_ラ）, 対象='甲虫装機', 後='アロマ'（ruby_ア）というカテゴリ配列内での並び）"
expect_return = "[]"

