# 検証対象: src/composables/deck/useDeckSnapshot.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、デッキ編集のスナップショット比較（変更検知・並び順のみの差分判定）composable。
#
# 到達不能/実質到達不能分岐:
# - なし。全4つのexport関数は分岐がすべて公開APIから到達可能。
#
# 既知の設計上の注意点（バグではないが複雑な挙動。実装読解で判明、ドキュメント側に記載なし）:
# - captureDeckSnapshotWithoutOrder内のnormalize()はcid/ciid/quantityのみを比較キーに残し、
#   DeckCardRefが持つ`lang`フィールドを比較対象から除外する（source_lines 60-64）。そのため
#   hasOnlySortOrderChanges()はlangのみが異なるデッキ同士を「並び順のみの差分」として
#   true判定してしまう。quantityやcid/ciidと異なりlangは並び替えキーに使われるわけではなく、
#   単純に出力オブジェクトへコピーされないため比較不能になっている。
# - hasOnlySortOrderChanges()はcategory/tags/commentに`?? []`/`?? ''`のデフォルト値補完を
#   行うが、captureDeckSnapshot()自体はこの補完を行わない（undefinedのままJSON.stringifyされ
#   キーごと省略される）。そのため「category未設定(undefined)のデッキ」と「category=[]の
#   デッキ」は、compareSnapshots()では異なる文字列として区別されるが、
#   hasOnlySortOrderChanges()では両方とも`?? []`で[]に正規化されるため同一と判定される
#   （compareSnapshotsとhasOnlySortOrderChangesで判定結果が食い違う具体例）。
# - captureDeckSnapshotWithoutOrder()はmainDeck/extraDeck/sideDeckのみをcid→ciid順でソートし、
#   skippedCardsは一切正規化しない（そのままdataオブジェクトにコピーされる）。そのため
#   skippedCardsの並び順が異なるだけでもhasOnlySortOrderChanges()はfalseを返す
#   （main/extra/sideとは非対称な扱い）。
# - normalize()のsort比較関数はcidが等しい場合のみciidを比較し、ciidも等しい場合は0を返す
#   （同一cid+ciidの重複エントリが複数ある場合、Array.prototype.sortの安定ソート仕様
#   （ES2019以降で規定）により元の配列順が保たれる）。

