note = "verified=falseは0件"

# --- captureDeckSnapshot(deckInfo) ---

[[condition]]
id = "capture.excludes_deck_code"
target_function = "captureDeckSnapshot"
source_lines = "33-43"
description = "スナップショット生成時、DeckInfoが持つdeckCodeフィールドは意図的にdataオブジェクトへ含めない（フィールド選択）"
given = "deckCodeが設定されたDeckInfoを渡す"
expect_return = "JSON.parseした結果にdeckCodeプロパティが存在しない"

[[condition]]
id = "capture.no_default_fallback_for_optional_fields"
target_function = "captureDeckSnapshot"
source_lines = "33-43"
description = "category/tags/comment/skippedCardsはundefinedでもデフォルト値へ補完せずそのままdataへ設定する（?? 演算子を使わない）。JSON.stringifyによりundefinedのプロパティはキーごと省略される"
given = "category/tags/commentがundefinedのDeckInfoを渡す"
expect_return = "JSON.parseした結果でcategory/tags/commentがundefined（キー自体が存在しない）"

