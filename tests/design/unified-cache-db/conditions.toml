# 検証対象: src/utils/unified-cache-db.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)。永続化・キャッシュ層のため、Chrome Storage I/O、TTL、
# 言語別マージ、削除/クリーンアップ、エラーハンドリングを優先して条件化する。
#
# 発見したデッドコード・到達不能分岐:
# - resetUnifiedCacheDB L1273-1275: instance が存在する場合 clearAll() を呼ぶが await しない。
#   到達不能ではないが、ストレージ削除完了前に新インスタンスへ差し替わる非同期fire-and-forget分岐。
# - reconstructCardInfo L1089-1100: Map#get と単純代入のみのtry-catchであり、通常入力から
#   catchへ到達させる現実的な経路は見つからなかった（防御的catch）。
#
# 既存テストの説明文・アサーションの不正確さ:
# - tests/unit/utils/unified-cache-db-comprehensive.test.ts の「ストレージ読み込みエラーが発生しても初期化が完了する」は
#   実装上、loadMoveHistory と checkAndRunCleanup 以外のロード失敗は initialize() の Promise.all をrejectさせる。
#   該当テストは実際には moveHistory 読み込みエラーの握りつぶしを検証する内容へ修正する。

[meta]
feature = "unified-cache-db"
source_file = "src/utils/unified-cache-db.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/utils/unified-cache-db.test.ts tests/unit/utils/unified-cache-db-comprehensive.test.ts"
source_hash = "5cad83c415ddbdbca07e000b53e027604ec56ebe"
note = "verified=falseは3件: private saveMoveHistory catch、reconstructCardInfo defensive catch、resetUnifiedCacheDBの非await clearAll完了順。いずれも公開APIから副作用を確定検証しにくい防御的/非同期fire-and-forget分岐"

