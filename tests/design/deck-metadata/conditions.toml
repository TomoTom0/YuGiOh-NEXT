# 検証対象: src/components/DeckMetadata.vue
#
# 経緯:
# - TASK-532（Tier C第7号・TASK-331展開）。DeckMetadata系1/4ファイル目の親コンポーネント
#   （396行）。既存tests/unit/components/DeckMetadata.test.ts（7it・html長assertのみの
#   実装非検証テスト）を全面展開
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm
#
# 粒度方針（Tier C・filter-tab条件書と同一）:
# - 子コンポーネントへのprops配線は表示契約として条件化する。配列の要素列挙は
#   テスト側fixtureで持つ
# - 子コンポーネントからのイベントハンドリング（更新関数）はstoreへの書き込み結果で検証
# - UI操作はDOMイベント経由で検証する（vm内部状態の直接参照はしない）
#
# 線引き（隣接条件書との）:
# - 子コンポーネント5種（DeckMetadataHeader 806行/TagDialog 975行/CategoryDialog 517行/
#   DeckMetadataTags 177行/DeckMetadataDescription 104行）の内部挙動は本書の対象外。
#   CategoryDialogはcategory-dialog条件書（TASK-488）が保証。Header/TagDialog/Tags/
#   DescriptionはTier C第8号以降の対象。本書は親DeckMetadataが持つ配線
#   （props値・イベント→store書き込み）のみ
# - deck-edit storeの内部挙動（updateCategoryMatchingのマッチング本体・deckInfo管理）は
#   store/use-category-matcher側の対象。本書は呼び出し契約（呼ばれたか/呼ばれないか）
# - deck-metadata-loader/getDeckMetadataのフォールバック・キャッシュ・stale判定本体・
#   language-detectorの検出ロジック・type-guards（filterValidCategoryIds等）の関数本体は
#   各モジュールの既存条件書が保証。本書はmock経由の呼び出し契約（引数・結果反映）のみ
# - allDeckCardsが参照するunified-cache-db（reconstructCardInfo）の選択ロジックは
#   unified-cache-db条件書の対象。本書は重複cid除去とnullスキップの収集契約のみ

