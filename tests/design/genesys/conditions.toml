# 検証対象: src/api/genesys.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)。docs/api/*.md等の二次情報は参照していない。
#
# デッドコード・到達不能分岐:
# - なし。非exportのfetchText/fetchTextViaBackgroundはAST未カバー検出対象外だが、
#   CORS越えfetchの中核で意味のある分岐を持つためconditions化した。

[meta]
feature = "genesys"
source_file = "src/api/genesys.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/api/genesys.test.ts"
source_hash = "0f9e24f6666696c5e32f9a90d6a7e0b3ecc429e9"
note = "verified=falseは0件。fetchTextViaBackgroundの30秒タイムアウトはVitest fake timersで検証する"

# --- fetchTextViaBackground(url: string): Promise<string> ---

[[condition]]
id = "fetch_bg.sends_message_with_request"
target_function = "fetchTextViaBackground"
source_lines = "27-37"
description = "crypto.randomUUID()でrequestIdを作り、chrome.runtime.sendMessageに{ type: 'GENESYS_FETCH', requestId, url }を渡してservice workerを起こす。sendMessageの応答値は待たない"
given = "content script相当の環境でfetchGenesysIndex/fetchGenesysPointListを呼ぶ"
expect_return_shape = "chrome.runtime.sendMessageがGENESYS_FETCHメッセージで1回呼ばれ、最終結果はstorage.local経由の応答から作られる"

[[condition]]
id = "fetch_bg.send_message_last_error_ignored"
target_function = "fetchTextViaBackground"
source_lines = "33-37"
description = "sendMessage callback内でchrome.runtime.lastErrorが存在してもconsole.warnするだけで、fetch処理自体は失敗させない"
given = "sendMessage callback実行時にchrome.runtime.lastError.messageが存在し、その後storage.localに成功応答が入る"
expect_no_throw = true
expect_return_shape = "storage.localの成功応答に基づくテキストが返る"

[[condition]]
id = "fetch_bg.poll_ignores_missing_or_other_request"
target_function = "fetchTextViaBackground"
source_lines = "41-57"
description = "storage.local.get('genesysFetchResp')の結果が未設定、またはrequestId不一致の場合はremoveもreturn/throwもせず300ms待って再ポーリングする"
given = "1回目のstorage.local応答が別requestId、2回目が同じrequestIdの成功応答"
expect_return_shape = "1回目は無視され、2回目の成功応答が返る"

[[condition]]
id = "fetch_bg.matched_success_returns_text"
target_function = "fetchTextViaBackground"
source_lines = "49-54"
description = "storage.local応答のrequestIdが一致しsuccessがtruthyの場合、genesysFetchRespをremoveしてresp.textを返す"
given = "storage.localに{ requestId, success: true, text: '<html>' }が入る"
expect_return_shape = "'<html>'"

[[condition]]
id = "fetch_bg.matched_success_missing_text_empty"
target_function = "fetchTextViaBackground"
source_lines = "49-54"
description = "requestId一致かつsuccess truthyでtextがnull/undefinedの場合、空文字列を返す"
given = "storage.localに{ requestId, success: true }が入る"
expect_return_shape = "''"

[[condition]]
id = "fetch_bg.matched_failure_throws_error"
target_function = "fetchTextViaBackground"
source_lines = "49-55"
description = "requestId一致かつsuccessがfalsyの場合、genesysFetchRespをremoveしてresp.errorのErrorをthrowする"
given = "storage.localに{ requestId, success: false, error: 'Failed: 404 Not Found' }が入る"
expect_throw = "Failed: 404 Not Found"

[[condition]]
id = "fetch_bg.matched_failure_default_error"
target_function = "fetchTextViaBackground"
source_lines = "49-55"
description = "requestId一致かつsuccessがfalsyでerrorがnull/undefinedの場合、'GENESYS fetch failed'をthrowする"
given = "storage.localに{ requestId, success: false }が入る"
expect_throw = "GENESYS fetch failed"

[[condition]]
id = "fetch_bg.timeout_throws"
target_function = "fetchTextViaBackground"
source_lines = "40-59"
description = "開始から30000ms未満の間だけ300ms間隔でstorage.localをポーリングし、一致応答が無いまま30秒に達すると'GENESYS fetch timeout'をthrowする"
given = "storage.local.getが常に一致するgenesysFetchRespを返さない"
expect_throw = "GENESYS fetch timeout"

# --- fetchText(url: string): Promise<string> ---

[[condition]]
