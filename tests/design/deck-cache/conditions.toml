source_lines = "tests/unit/utils/deck-cache.test.ts:786"
target_function = "generateThumbnailsInBackground"
description = "force=falseでcached.lastThumbnailUpdateがtruthy、かつDate.nowとの差分が1日未満の場合、そのdeckではcheckDeckNeedsUpdateを呼ばずskipDueToRecentUpdate=trueにする"
given = "lastThumbnailUpdateが現在時刻、force=false"
expect_return_shape = "そのdnoのgetDeckDetailは呼ばれない"

[[condition]]
id = "background.order-preserved-no-update-skip-records-check-time"
source_lines = "tests/unit/utils/deck-cache.test.ts:802"
target_function = "generateThumbnailsInBackground"
description = "前回順序上で当該dnoより前にあったdnoのうち現存するものが、今回の当該dnoより前にも部分シーケンスとして存在し、needsUpdate=falseの場合shouldSkipになり、force=falseかつrecent skipでなければcached.lastThumbnailUpdateを現在時刻に更新する"
given = "前回順序[1,2]、今回順序[1,2]、dno 2のhash一致・期限内、force=false"
expect_return_shape = "dno 2のlastThumbnailUpdateが更新され、thumbnailは生成されない"

[[condition]]
id = "background.consecutive-five-skips-breaks"
source_lines = "tests/unit/utils/deck-cache.test.ts:846"
target_function = "generateThumbnailsInBackground"
description = "shouldSkipが5件連続した時点でループをbreakし、残りのtargetDecksをチェックしない"
given = "7件のdeckが順序保持かつ変更なし"
expect_return_shape = "getDeckDetailは5回だけ呼ばれる"

[[condition]]
id = "background.non-skip-changed-deck-queued"
source_lines = "tests/unit/utils/deck-cache.test.ts:862"
target_function = "generateThumbnailsInBackground"
description = "shouldSkipでない場合consecutiveSkippedを0に戻し、needsUpdate=trueかつdeckInfo truthyならdecksToUpdateに追加する"
given = "キャッシュなしのdeckInfoが取得できる"
expect_return_shape = "後続フェーズでthumbnail/deck info cacheが更新される"

[[condition]]
id = "background.no-decks-to-update-returns-after-save"
source_lines = "tests/unit/utils/deck-cache.test.ts:888"
target_function = "generateThumbnailsInBackground"
description = "ループ後にsaveDeckInfoCacheを呼び、decksToUpdateが空ならサムネイル生成を行わずreturnする"
given = "全targetDecksがskipまたはneedsUpdate=false"
expect_return_shape = "deck info cache保存は行われ、generateDeckThumbnailImageは呼ばれない"

[[condition]]
id = "background.generates-each-queued-after-idle"
source_lines = "tests/unit/utils/deck-cache.test.ts:862"
target_function = "generateThumbnailsInBackground"
description = "decksToUpdateがある場合、各deckについてwaitForIdleCallbackをawaitしてからgenerateAndCacheThumbnailをawaitする"
given = "2件のdeckが更新対象、requestIdleCallbackは即時callback"
expect_return_shape = "requestIdleCallbackが2回呼ばれ、thumbnail/deck info cacheが2件更新される"

[[condition]]
id = "background.random-delay-before-second-api-when-not-force"
source_lines = "tests/unit/utils/deck-cache.test.ts:923"
target_function = "generateThumbnailsInBackground"
description = "skipDueToRecentUpdateでなく、apiCallCount>0かつforce=falseの場合、次のcheckDeckNeedsUpdate前に500+Math.random()*1500 ms待機する"
given = "force=falseで2件以上をAPI確認し、1件目がskipでもrecent skipではない"
expect_return_shape = "2件目のgetDeckDetail前にsetTimeoutが呼ばれる"
