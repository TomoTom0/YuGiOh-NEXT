# 検証対象: src/content/edit-ui/DeckEditLayout.vue（root component・props/emitsなし・
#   export default { setup() } 形式。templateはL1-199、scriptはL201-1172、scoped SCSSはL1174-1913）
# 経緯: TASK-331（Tier C展開）× TASK-487（旧40it実装非検証テストの再設計）の統合。
#   TASK-462（ショートカット登録タイミング）は本条件化に先行して実装修正済み
#   （リスナー登録をonMounted冒頭・lastDno復元直後・初期化await直前へ移動）。
#
# 粒度方針（Tier C・load-dialog条件書と同一）:
# - script setup相当のロジック分岐（ハンドラ分岐・computed・ライフサイクル副作用）を主対象、
#   template表示結果は簡潔に
#
# 線引き（store・子コンポーネント側との）:
# - deck-edit storeの各アクション内部（addCard上限判定・undo履歴・saveDeck永続化等）は
#   deck-edit条件書側の対象。本書は「このコンポーネントでの呼び出し条件・引数・分岐」のみ
# - ImportExportDialog/LoadDialog/SettingsDialog/ConfirmDialog内部の挙動は各コンポーネント側
# - RightArea/DeckCard/DeckSectionの内部挙動は各コンポーネント側
#
# 探索中の発見事項:
# - デッドコード群（下記[[excluded]]・削除タスクTASK-493で起票済み）
# - 「保存せず続ける」ボタンのonClickにtry/catch無し（TASK-494で起票。条件
#   unsaved-button-continue-without-saving-no-catch は期待仕様ではなく現行挙動として条件化）
# - onUnmountedがwindow.ygoChangeLanguageを元に戻さない（override残留。TASK-495で起票。条件
#   unmounted-does-not-restore-ygo-change-language も現行挙動として条件化）
# - handleResizeのwasDesktop変数は「現在desktop」の意味（過去状態との比較ではない命名ミス）
# - checkDnoChangeがinitializeOnPageLoadをawaitしないため、初期化中・初期化後の連続hashchangeで
#   ロードが並走しうる（完了順によりhashと表示デッキが一時不一致になりうる。TASK-462のリスナー
#   早期登録で初期化中の窓が広がる。直列化（世代番号・Promise共有）の検討はTASK-496）
# - toggleLoadDialogのonLoadCallback内のlocalStorageキーはSTORAGE_KEY_LAST_DECK_DNO定数でなく
#   リテラル 'ygoNext:lastDeckDno'（値は同一のため挙動差なし）

