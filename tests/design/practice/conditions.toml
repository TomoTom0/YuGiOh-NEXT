# 検証対象: src/stores/practice.ts (usePracticeStore)
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# Pinia Setup Store形式のため、returnオブジェクトで公開されるローカル関数を
# "usePracticeStore#アクション名"として記載する。
