# --- setupRegulationDisplay() 適用パス ---

[[condition]]
id = "regulation_apply.ocg_past_success_renders_override_badges"
target_function = "setupRegulationDisplay/applyResolved"
source_lines = "496-525"
description = "OCG過去版の適用に成功した場合、getRegulationの結果でカード個別の上書きバッジを描画し、ネイティブの禁止/制限表示を非表示にする。tooltipに適用版を表示し警告は出さない"
given = "デッキ名タグ[OCG-2401]・ensureList成功・getRegulation='limited'"
expect_side_effect = "ygo-next-limit-limitedバッジが描画され、ネイティブoverlaysはdisplay:none、is-unavailableクラス無し"

[[condition]]
id = "regulation_apply.list_fetch_failure_on_initial_auto_reverts_to_native"
target_function = "setupRegulationDisplay/applyResolved"
source_lines = "499-518"
description = "初回auto適用（デッキ名タグ由来）でリスト取得に失敗した場合、取得不能な版を「無制限」と同じ扱いで描画せずタグ無し扱い（ネイティブの最新版表示）に戻す。tooltipとトリガー警告色（is-unavailable）で取得失敗を報告する（PR#151レビューThread 2）"
given = "デッキ名タグ[OCG-2401]・ensureListがnullを返す"
expect_side_effect = "ネイティブoverlaysは非表示にされず、独自バッジも描画されず、tooltipに「指定 OCG 2024年01月版 のリストを取得できなかったため、直前の選択に戻しました」"

[[condition]]
id = "regulation_apply.list_fetch_failure_on_manual_selection_keeps_previous"
target_function = "setupRegulationDisplay/applyResolved"
source_lines = "499-518"
description = "手動選択した過去版のリスト取得に失敗した場合、直前の適用済み選択（lastApplied、メニュー選択状態・バッジ・ネイティブ表示切替を含む）に戻し、tooltipと警告色で報告する"
given = "タグ無しデッキ（auto適用済み）でocg:2024-01-01を手動選択・ensureListがnullを返す"
expect_side_effect = "メニュー選択はautoのまま、ネイティブ表示は維持され、tooltipに取得失敗の警告が出る"

[[condition]]
id = "regulation_apply.stale_completion_does_not_overwrite_newer_selection"
target_function = "setupRegulationDisplay/applyResolved"
source_lines = "450-525"
description = "未キャッシュ過去版のfetch中に別版を選択した場合、applyResolvedは世代番号（applyGeneration）で並走を管理し、遅く完了した古い選択は描画（バッジ・tooltip・ネイティブ表示切替・メニュー選択状態）を行わない（PR#151レビューThread 3）"
given = "ocg:2024-01-01のensureListがpending中にocg:2023-01-01を選択し、その後2024のfetchが完了する"
expect_side_effect = "最終的な表示・tooltip・バッジは2023-01-01選択の結果のまま変化しない"

# --- export純粋関数 ---

[[condition]]
id = "effective_yymm.derives_from_fallback_tag_date_or_param"
target_function = "effectiveYymm"
source_lines = "53-64"
description = "fallback.appliedYymm > tag.yymm > OCG effectiveDate（手動選択） > GENESYS listParam（手動選択）の優先順位でYYMMを導出する。版指定が無ければnull"
given = "各優先順位のパターン"
expect_return = "対応するYYMM（例: '2501', '2401', '2608'）またはnull"

[[condition]]
id = "build_tooltip.describes_fallback_yymm_or_latest"
target_function = "buildTooltip"
source_lines = "74-84"
description = "fallback時は指定版と直近適用版を説明し、YYMM指定時は年月表記、省略時は最新版、mode=noneはOCG最新版として説明する。手動選択時は「(手動選択・未保存) 」接頭辞を付ける"
given = "resolved/isManualの各組み合わせ"
expect_return = "対応する説明文"

[[condition]]
id = "trigger_label_and_badge_text"
target_function = "triggerLabel / triggerBadgeText"
source_lines = "87-96"
description = "triggerLabelは種別+年月版（例: 'OCG 2024年01月版'）または最新版ラベル、mode=noneはOCG扱い。triggerBadgeTextは種別ラベル（OCG/GENESYS）のみ"
given = "各mode・版指定パターン"
expect_return = "対応するラベル文字列"

[[condition]]
id = "parse_selector_value.converts_value_string"
target_function = "parseSelectorValue"
source_lines = "222-231"
description = "'auto'は文字列のまま返す。'none'はmode=none。'ocg:latest'/'genesys:latest'は最新版（null）、'ocg:YYYY-MM-DD'/'genesys:YYYYMM'は指定値をResolvedRegulationに変換する"
given = "各value文字列"
expect_return = "'auto'または対応するResolvedRegulation"
