# 検証対象: src/utils/deck-import.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、tests/README.md記載の「重要なテスト対象」グループ最優先。
#
# 発見したデッドコード（実装は存在するが到達不可能。conditions化せず、ここに記録するに留める）:
# - importFromCSV L40-42, importFromTXT L144-146: `content.trim().split('\n')`は空文字列でも
#   `['']`(length=1)を返すため、`lines.length === 0`分岐は到達不能（Node.jsで実測確認済み）。
# - parseCSVLine L254: `result`は空行でも`['']`のように最低1要素pushされるため、
#   `result.length > 0 ? result : null`のnull分岐は到達不能。
# - importFromCSV L56: 上記によりparseCSVLineは常に配列を返すため、`if (!parsed)`のwarning分岐も到達不能。
# - parseImportRow L333-336: fields.length>=3の前提下で3/4/5/6+の4パターンが全て網羅されているため、
#   最終elseの「フィールド数が不正です」warningは到達不能。
#
# 既存テストの説明文の不正確さ（実装挙動とズレているが動作自体は正しいため要修正の記録に留める）:
# - tests/unit/utils/deck-import-comprehensive.test.ts の「コメント行（#）を無視する」テストは、
#   実際にはコメント無視ロジックは存在せず、`#`行はどのパターンにもマッチせず
#   「フォーマットが不正です」warning付きでスキップされているだけ（無視ではなく警告付きスキップ）。
#   テスト自体はPASSするが説明文が実装と異なる。

[meta]
feature = "deck-import"
source_file = "src/utils/deck-import.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/deck-import.test.ts tests/unit/utils/deck-import-comprehensive.test.ts"
source_hash = "5b518e2c73e2daa938f34914ccd8d13adcc7e358"
note = "verified=falseは3件: import_csv/import_png/import_txtの各catch_error(防御的try-catchで現実的な入力での再現不能)。FileReader系はglobalThis.FileReaderスタブによりimportDeckFromFile()経由で検証可能"

