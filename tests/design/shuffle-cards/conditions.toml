# 検証対象: src/content/shuffle/shuffleCards.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、tests/README.md記載の「重要なテスト対象: シャッフル」グループ。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - 旧shuffleCards.test.tsはテスト内にFisher-Yatesや各処理の模倣実装を置き、export関数の存在も
#   ローカルの空関数で確認していた。実装コードを呼ぶテストへ置き換えた。
#
# 実装読解で発見した注意点:
# - shuffleCardsBySection/sortCardsBySectionはgetSortfixedCards()（全セクションの固定カード）を使うため、
#   対象section以外のdata-ygo-next-sortfix付きカードもnewOrderの先頭に入り、対象imageSetへ移動し得る。
#   条件として現挙動を固定した。

[meta]
feature = "shuffle-cards"
source_file = "src/content/shuffle/shuffleCards.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/shuffle/shuffleCards.test.ts"
source_hash = "e34a5d1cfcb6e73d7533d7740d38db2480c7f7fc"
note = "verified=falseは0件"

# --- fisherYatesShuffle<T>(array: T[]): T[] ---

[[condition]]
id = "shuffle_fisher_yates.copies_input"
target_function = "fisherYatesShuffle"
source_lines = "18-26"
description = "入力配列をスプレッドでコピーし、戻り値は入力配列とは別参照になる"
given = "array = [a, b, c]"
expect_return_shape = "arrayと同じ要素を持つ別配列"

[[condition]]
id = "shuffle_fisher_yates.loop_swaps_from_tail"
target_function = "fisherYatesShuffle"
source_lines = "20-25"
description = "iを末尾から1まで減らし、各反復でMath.floor(Math.random() * (i + 1))をjとしてshuffled[i]とshuffled[j]を交換する"
given = "Math.randomが常に0を返す3要素配列"
expect_return_shape = "i=2で要素2と0、i=1で要素1と0が交換された順序"

[[condition]]
id = "shuffle_fisher_yates.empty_or_single_unchanged"
target_function = "fisherYatesShuffle"
source_lines = "20-26"
description = "配列長が0または1の場合、forループに入らずコピー配列を返す"
given = "[] または [a]"
expect_return_shape = "要素順は入力と同じ。戻り値は入力配列とは別参照"

# --- applyFlipAnimation(imageSet, newOrder, duration = 400) ---

[[condition]]
id = "shuffle_flip.reorders_and_animates"
target_function = "applyFlipAnimation"
source_lines = "35-91"
description = "duration省略時は400msを使い、現在の`:scope > a`位置を記録、imageSetにanimatingを追加、innerHTMLを空にしてnewOrder順にappendし、requestAnimationFrameでtransition/transformを設定し、duration後にstyleを空にしてanimatingを外す"
given = "imageSet直下にa要素があり、newOrderがそれらの並べ替え"
expect_return = "undefined"

[[condition]]
id = "shuffle_flip.skips_invert_when_position_missing"
target_function = "applyFlipAnimation"
source_lines = "60-70"
description = "newOrder内のcardについてfirstPositionsまたはlastPositionsが取得できない場合、そのcardには初期transition='none'とtransform=translate(...)を設定しない"
given = "newOrderに元のimageSet直下には無かった別sectionのsortfixカードが含まれる"
expect_return = "undefined"

