# --- convertCardLinksToTemplate(element: HTMLElement): string (非export) ---

[[condition]]
id = "convert_links.br_to_newline"
target_function = "convertCardLinksToTemplate"
source_lines = "156-161,175"
description = "入力要素をcloneし、clone内のbr要素を改行テキストに置換してからtextContentをtrimして返す"
given = "<div>テキスト1<br>テキスト2</div>"
expect_return = "テキスト1\nテキスト2"

[[condition]]
id = "convert_links.cid_anchor_to_template"
target_function = "convertCardLinksToTemplate"
source_lines = "164-172"
description = "href属性に'cid='を含み、/[?&]cid=(\\d+)/にマッチするa要素を、trim済みリンク文字列とcidを使った'{{カード名|cid}}'文字列に置換する"
given = "<a href=\"faq_search.action?ope=4&cid=5533\"> 王家の眠る谷－ネクロバレー </a>"
expect_return = "{{王家の眠る谷－ネクロバレー|5533}}"

[[condition]]
id = "convert_links.cid_anchor_without_regex_match_keeps_text"
target_function = "convertCardLinksToTemplate"
source_lines = "164-172,175"
description = "href属性に'cid='を含むa要素でも/[?&]cid=(\\d+)/にマッチしない場合は置換せず、最終textContent上はリンク文字列だけが残る"
given = "<a href=\"faq_search.action?acid=5533\">カード名</a>"
expect_return = "カード名"

[[condition]]
id = "convert_links.no_text_returns_empty"
target_function = "convertCardLinksToTemplate"
source_lines = "175"
description = "clone.textContent?.trim()がfalsyの場合、空文字列を返す"
given = "<div></div>"
expect_return = "''"

