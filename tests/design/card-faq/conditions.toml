# --- getCardFAQList(cardId: string): Promise<CardFAQList | null> ---

[[condition]]
id = "faq_list.request_params"
target_function = "getCardFAQList"
source_lines = "22-32"
description = "detectCardGameTypeの戻り値とURLSearchParams({ ope: '4', cid: cardId })でURLを組み立て、queuedFetchをGET/credentials:'include'で呼ぶ"
given = "cardId = '12345'"
expect_side_effect = "queuedFetchのURLにope=4とcid=12345が含まれ、optionsは{ method: 'GET', credentials: 'include' }"

[[condition]]
id = "faq_list.response_not_ok"
target_function = "getCardFAQList"
source_lines = "34-36"
description = "queuedFetchのresponse.okがfalseの場合、本文を読まずnullを返す"
given = "queuedFetchが{ ok: false }を返す"
expect_return = "null"

[[condition]]
id = "faq_list.title_extracts_card_name"
target_function = "getCardFAQList"
source_lines = "44-46"
description = "title.textContentを'|'で分割し、先頭要素をtrimした値をcardNameにする"
given = "<title> テストカード | カードに関連するＱ＆Ａ </title>"
expect_return_shape = "cardName === 'テストカード'"

[[condition]]
id = "faq_list.title_missing_empty_card_name"
target_function = "getCardFAQList"
source_lines = "44-46"
description = "title要素が存在しない場合、cardNameは空文字列になる"
given = "HTMLに<title>が存在しない"
expect_return_shape = "cardName === ''"

