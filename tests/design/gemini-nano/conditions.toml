# --- promptGeminiNano(systemPrompt: string, userMessage: string): Promise<string> ---

[[condition]]
id = "prompt.create_then_prompts_user_message"
target_function = "promptGeminiNano"
source_lines = "16-19"
description = "createNanoSession(systemPrompt)で作成したsessionにuserMessageを渡してpromptし、その結果文字列を返す"
given = "createNanoSessionがsessionを返し、session.prompt(userMessage)が'reply'にresolveする"
expect_return = "'reply'"

[[condition]]
id = "prompt.destroy_after_success"
target_function = "promptGeminiNano"
source_lines = "18-21"
description = "session.promptがresolveした場合、return前にfinallyでsession.destroy()を呼ぶ"
given = "session.prompt(userMessage)がresolveする"
expect_side_effect = "session.destroy()が1回呼ばれる"

[[condition]]
id = "prompt.destroy_after_prompt_reject"
target_function = "promptGeminiNano"
source_lines = "18-21"
description = "session.promptがrejectした場合でもfinallyでsession.destroy()を呼び、promptのreject理由はそのまま外へ伝播する"
given = "session.prompt(userMessage)がError('prompt failed')でrejectする"
expect_throw = "Error('prompt failed')"
expect_side_effect = "session.destroy()が1回呼ばれる"

[[condition]]
id = "prompt.create_session_rejects_without_destroy"
target_function = "promptGeminiNano"
source_lines = "16-17"
description = "createNanoSession(systemPrompt)がrejectした場合、try/finallyに入らないためsession.destroy()は呼べず、reject理由がそのまま外へ伝播する"
given = "API不在によりcreateNanoSession(systemPrompt)がError('Gemini Nanoが利用できません')でrejectする"
expect_throw = "Error('Gemini Nanoが利用できません')"

