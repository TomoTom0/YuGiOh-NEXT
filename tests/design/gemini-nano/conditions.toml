# --- getLanguageModelApi(): LanguageModelConstructor | undefined ---

[[condition]]
id = "get_api.prefers_window_language_model"
target_function = "getLanguageModelApi"
source_lines = "1-2"
description = "window.LanguageModelがtruthyの場合、window.ai?.languageModelより優先して返す"
given = "window.LanguageModelとwindow.ai.languageModelの両方が存在する"
expect_return_shape = "window.LanguageModelの参照"

[[condition]]
id = "get_api.falls_back_to_window_ai_language_model"
target_function = "getLanguageModelApi"
source_lines = "1-2"
description = "window.LanguageModelがnullishで、window.ai?.languageModelが存在する場合はwindow.ai.languageModelを返す"
given = "window.LanguageModelがundefined、window.ai.languageModelが存在する"
expect_return_shape = "window.ai.languageModelの参照"

[[condition]]
id = "get_api.absent_returns_undefined"
target_function = "getLanguageModelApi"
source_lines = "1-2"
description = "window.LanguageModelがnullishで、window.ai?.languageModelも存在しない場合はundefinedを返す"
given = "window.LanguageModelがundefined、window.aiがundefined、またはwindow.ai.languageModelがundefined"
expect_return = "undefined"

