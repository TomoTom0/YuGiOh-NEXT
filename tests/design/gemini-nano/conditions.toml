# --- promptGeminiNano(systemPrompt: string, userMessage: string): Promise<string> ---

[[condition]]
id = "prompt.create-then-prompts-user-message"
target_function = "promptGeminiNano"
source_lines = "tests/unit/services/llm/gemini-nano.test.ts:106"
