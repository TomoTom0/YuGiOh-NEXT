# 検証対象: src/composables/practice/usePracticeDropHandler.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、Practice画面のドラッグ&ドロップ着地処理を担うVue composable。
# targetZone と DropPosition(isTop/isRight/insertIndex) の組合せで呼び分ける
# practiceStoreの各種move/add APIの引数を組み立てるのが主役割。
#
# target_function の記述形式について（composable factory パターン）:
# 本ファイルは `export function usePracticeDropHandler()` がオブジェクトを返す構造で、
# 実質的なロジックは factory 内のローカル関数（handleCardDrop/handleExternalCardDrop）に
# あります。extract-ast-skeleton.ts は Pinia Setup Store（defineStore()）の factory は
# 検出しますが、一般の composable factory（export function useXxx()）は未対応のため、
# export関数一覧には `usePracticeDropHandler` 1件のみが現れ、
# `usePracticeDropHandler#handleCardDrop` 等は抽出されません。このため conditions.toml の
# target_function には `usePracticeDropHandler#<method>` 形式で記載し、README Phase1.6 知見
# の Pinia Setup Store と同じ `#` 区切り形式に合わせています。スクリプト実行時の未カバー
# 検出で `usePracticeDropHandler` が1件出ますが、これは上記のスクリプト側の限界であり、
# 本ファイルでは全メソッドの条件を網羅しています（use-deck-name-variables/conditions.toml
# と同じ運用）。
#
# 到達不能/実質到達不能分岐:
# - なし。targetZone の各分岐と DropPosition の組合せは全て公開APIから到達可能。
#   ZoneType は文字列union型だが、本関数は分岐ごとに早期return する構造で、
#   明示的に列挙されたzone(deck/gy/extra/banish/hand)以外はdefault(L66-)へ落ちるため、
#   到達不能分岐は存在しない。
#
# 既知の設計上の注意点（バグではないが複雑な挙動。実装読解で判明）:
# - deck zone は「isTop=false のときシャッフル」「isTop=true かつ isRight=true のとき
#   トップに裏向き挿入」「isTop=true かつ isRight=false のときボトムに裏向き挿入」の
#   3 Wayに分かれる（L23-32）。直感とは異なり、isTop=true のとき isRight フラグが
#   実質的な top/bottom 判定に流用される。faceは常に'down'で固定。
# - gy zone は DropPosition を完全に無視し position:'top' face:'up' で固定（L34-37）。
# - extra zone は position を常に'top'で固定し isRight を無視。faceのみ isTop で切替（L39-43）。
# - banish zone / default zone は existingCards.length > 0 のときだけ isRight が効き、
#   0枚（空ゾーン）の場合は無条件で position:'top' になる（L48-50, L68-70）。つまり
#   「空ゾーンへのドロップは強制的にトップ」。
# - hand zone の idx-1 補正（L58-60）は、同一hand内移動で移動元cardIndexが移動先idxより
#   前の場合、spliceで要素が1減る分を事前補正する。ただし clampedIdx の計算（L61）は
#   moveCard 呼出し前の hand length で行われる（カード未削除状態）。moveCard内部でも
#   同様に Math.max(0, Math.min(pos, target.length)) で再クランプされるため二重クランプ。
# - handleExternalCardDrop の face 決定（L81-86）は zone ごとに異なり、else 節（hand/field/
#   monster/spellTrap/extraMonster/temp）は `dropPos?.isTop !== false` という緩い判定で、
#   dropPos undefined または isTop=true なら 'up'、明示的に isTop=false のときのみ 'down'。
#   一方 extra/banish は `dropPos?.isTop ? 'up' : 'down'` で、dropPos undefined 時は 'down'
#   になる（else 節とは非対称）。
# - handleExternalCardDrop は dropPos 引数が optional（dropPos?: DropPosition）。dropPos undefined
#   時は hand の insertIndex 系分岐（L88）も抜けて default の addExternalCard(L93)へ落ち、
#   position省略 = ストア側デフォルト('bottom')で追加される。
# - handleCardDrop 側は dropPos が必須（非optional）。両関数で dropPos の扱いが非対称。

