# 検証対象: src/composables/practice/usePracticeActions.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、Practice画面のカードアクションメニュー（GY/Hand/Banish/Field/Deck底部/
# EX底部への移動、表裏・縦横切替）の実行とボタン構築を担うVue composable。
# executeAction は action 文字列で practiceStore.moveCard/setCardFace/setCardOrientation を呼び分け、
# getAvailableActions は zone と card の属性からアクションボタン配列（null=非表示）を構築する。
#
# target_function の記述形式について（composable factory パターン）:
# 本ファイルは `export function usePracticeActions()` がオブジェクトを返す構造で、
# 実質的なロジックは factory 内のローカル関数（executeAction/getAvailableActions）にある。
# extract-ast-skeleton.ts は Pinia Setup Store（defineStore()）の factory は検出するが、
# 一般の composable factory（export function useXxx()）は未対応のため export関数一覧には
# `usePracticeActions` 1件のみが現れ、`usePracticeActions#executeAction` 等は抽出されない。
# このため conditions.toml の target_function には `usePracticeActions#<method>` 形式で記載し、
# README Phase1.6 知見の Pinia Setup Store と同じ `#` 区切り形式に合わせている
# （use-deck-name-variables, use-practice-drop-handler と同じ運用）。
# スクリプト実行時の未カバー検出で `usePracticeActions` が1件出るが既知の限界であり、
# 本ファイルでは全メソッドの条件を網羅している。
#
# 到達不能/実質到達不能分岐:
# - executeAction L45/L52 の内側 `if (card)`: findCard が返した loc.cardIndex は実カードを指すため、
#   直後の getCards(loc.zone, loc.slotIndex) の同じ index は実質常に存在する（同期処理なので
#   状態が変化しない限り到達不能）。ただし loc.slotIndex が undefined になる単純ゾーン
#   （gy/banish/deck/extra/hand/field/temp）では getCards が slotIndex を無視して対象配列を
#   返すため安全。テストでは getCards を空配列にモックすることで到達可能。実質到達不能だが
#   防御的ガードとして残り、条件化してテストで検証する。
#
# 既知の設計上の注意点（バグではないが複雑な挙動。実装読解で判明）:
# - moveToField は必ず 'monster' ゾーンへ移動する（L38）。getAvailableActions 側は zone==='extra'
#   のときのみ moveToField ボタンを出すため、実運用では EXデッキのカードをmonsterゾーンへ展開する
#   挙動になる。Spell/TrapをmoveToFieldで送る経路はUI上は無いが、executeAction自体は受け付ける。
# - moveToField の空きスロット探索（L32-37）は5スロット全て埋まっている場合、breakせず
#   targetSlot が初期値 0 のまま moveCard に渡る。つまり「空きがない場合は slot 0 に強制的に
#   （既存カードと重複して）移動する」。エラーやスキップは無く、ストア側の moveCard が
#   unshiftで先頭に積むためカードがスタックする。
# - getAvailableActions の最終スロット（L73-77）は zone==='extra' を最優先し、次に zone!=='deck'
#   でdeckKey（isExtraCard依存）を出す。つまりゾーン判定がカード種別（isExtraCard）より優先。
#   EXデッキモンスター（isExtraDeck:true）が extra ゾーンにあれば moveToField、deck ゾーンに
#   あれば null（何も出さない）、それ以外のゾーンにあれば moveToExtraBottom になる。
# - moveToDeckBottom/moveToExtraBottom は必ず {position:'bottom', face:'down'} 固定。一方
#   moveToGY/moveToHand/moveToBanish は options を渡さない（undefined）。ストア側 moveCard の
#   デフォルトで position:'top' になり、face/orientationは変更なし（カードの現状を維持）。
# - toggleFace/toggleOrientation は face=='up'?'down':'up' / orientation=='vertical'?'horizontal':'vertical'
#   の二値切替。CardFace/CardOrientation は union型で二値のみのため型安全だが、card.face が
#   undefined（DB再水和失敗等で未設定）の場合は 'up' 扱いで 'down' に切替される（undefined は
#   store側 setCardFace で `card.face === face` 比較時に 'up'===face と不一致なら更新されるが、
#   ここでは単純に 'down' が渡る）。
# - getAvailableActions の toggleFace (Flip) ボタンはゾーンに関わらず常に表示（L70）。gy/deck 等
#   の「表裏切替が意味をなさない可能性があるゾーン」でも表示される。
# - NO_ROTATE_ZONES = {gy, banish, deck, extra, hand}。'temp' ゾーンは回転可（Setに含まれない）。
#   'field', 'monster', 'spellTrap', 'extraMonster' も回転可。
# - 不明な action 文字列を渡した場合、全 if/else if を抜けて何もしない（L24-57 の最終 else 無し）。
#   エラー/ログ出力も無く黙滞の no-op になるため、action キーのタイポは表面化しない。

