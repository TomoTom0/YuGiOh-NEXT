# --- basic type guards ---

[[condition]]
id = "is_record.object_non_null_non_array"
target_function = "isRecord"
source_lines = "154-155"
description = "obj !== null かつ typeof obj === 'object' かつ Array.isArray(obj) === false の場合trueを返す"
given = "{}、Dateインスタンス、null、undefined、[]、文字列、数値"
expect_return = "{}とDateインスタンスはtrue、それ以外の例はfalse"

[[condition]]
id = "has_property.key_in_record"
target_function = "hasProperty"
source_lines = "171-175"
description = "isRecord(obj)がtrueで、key in obj がtrueの場合trueを返す。in演算子のため継承プロパティもtrueになる"
given = "own propertyを持つobject、prototype上にkeyを持つobject"
expect_return = "true"

[[condition]]
id = "has_property.false_when_missing_or_not_record"
target_function = "hasProperty"
source_lines = "171-175"
description = "isRecord(obj)がfalse、またはkey in objがfalseの場合falseを返す。配列はkeyを持っていてもisRecordで除外される"
given = "{ name: 'test' }に'age'、文字列に'length'、配列に'length'"
expect_return = "false"

[[condition]]
id = "is_defined.not_nullish"
target_function = "isDefined"
source_lines = "190-191"
description = "value !== null かつ value !== undefined の場合trueを返し、nullまたはundefinedのみfalseを返す"
given = "0、''、false、{}、[]、null、undefined"
expect_return = "null/undefinedのみfalse、それ以外はtrue"

[[condition]]
id = "is_string.typeof_string"
target_function = "isString"
source_lines = "200-201"
description = "typeof value === 'string' の場合のみtrueを返す"
given = "''、'hello'、new String('x')、数値、null、undefined、object"
expect_return = "プリミティブ文字列のみtrue"

[[condition]]
id = "is_number.typeof_number_not_nan"
target_function = "isNumber"
source_lines = "210-211"
description = "typeof value === 'number' かつ !isNaN(value) の場合trueを返す。Infinityはtrue、NaNはfalse"
given = "0、123、-45.67、Infinity、NaN、'123'、null、undefined、new Number(1)"
expect_return = "numberプリミティブかつNaNでない値のみtrue"

[[condition]]
id = "is_boolean.typeof_boolean"
target_function = "isBoolean"
source_lines = "220-221"
description = "typeof value === 'boolean' の場合のみtrueを返す"
given = "true、false、1、0、'true'、null"
expect_return = "true/falseのみtrue"

[[condition]]
id = "is_array.array_is_array"
target_function = "isArray"
source_lines = "230-231"
description = "Array.isArray(value) の結果をそのまま返す"
given = "[]、[1,2,3]、{}、null、'array'"
expect_return = "配列のみtrue"

[[condition]]
id = "is_enum_member.object_values_includes"
target_function = "isEnumMember"
source_lines = "248-252"
description = "Object.values(enumObject).includes(value) の結果を返す。数値enumではTypeScriptのreverse mappingによりメンバー名文字列もtrueになる"
given = "文字列enum {A:'a'} の'a'/'A'、数値enum {Zero=0} の0/'Zero'/3"
expect_return = "'a'、0、'Zero'はtrue。'A'、3はfalse"

# --- safe helpers ---

[[condition]]
id = "safe_query_as.found_and_guard_true"
target_function = "safeQueryAs"
source_lines = "278-282"
description = "parentが指定されなければdocumentを検索し、querySelectorで要素が見つかりtypeGuard(element)がtrueならその要素を返す"
given = "document内のinputをselectorで検索し、isHTMLInputElementを渡す"
expect_return_shape = "見つかったinput要素そのもの"

[[condition]]
id = "safe_query_as.found_but_guard_false"
target_function = "safeQueryAs"
source_lines = "281-285"
description = "querySelectorで要素が見つかってもtypeGuard(element)がfalseならnullを返す"
given = "divをselectorで検索し、isHTMLInputElementを渡す"
expect_return = "null"

[[condition]]
id = "safe_query_as.not_found"
target_function = "safeQueryAs"
source_lines = "279-285"
description = "querySelectorがnullを返した場合、typeGuardを呼ばずnullを返す"
given = "存在しないselector"
expect_return = "null"

[[condition]]
id = "safe_query_as.uses_parent_when_truthy"
target_function = "safeQueryAs"
source_lines = "278-279"
description = "parentがtruthyの場合はparent.querySelector(selector)で検索し、未指定の場合はdocument.querySelector(selector)で検索する"
given = "parent要素の内側にだけ存在するchild selector"
expect_return_shape = "parent内のchild要素"

[[condition]]
id = "safe_cast_as.guard_true_returns_obj"
target_function = "safeCastAs"
source_lines = "302-306"
description = "typeGuard(obj)がtrueの場合、objそのものを返す"
given = "obj = { key: 'value' }, typeGuard = isRecord"
expect_return_shape = "入力objと同一参照"

[[condition]]
id = "safe_cast_as.guard_false_returns_null"
target_function = "safeCastAs"
source_lines = "302-306"
description = "typeGuard(obj)がfalseの場合、nullを返す"
given = "obj = null, typeGuard = isRecord"
expect_return = "null"

[[condition]]
id = "all_guards.every_all_true"
target_function = "allGuards"
source_lines = "321-325"
description = "guards.every(guard => guard(value)) の結果を返す。全guardがtrueを返す場合true"
given = "isRecord、hasProperty('name')、hasProperty('age')がすべてtrueになるobject"
expect_return = "true"

[[condition]]
id = "all_guards.every_any_false"
target_function = "allGuards"
source_lines = "321-325"
description = "1つでもguardがfalseを返す場合falseを返し、Array.prototype.everyの短絡評価に従う"
given = "hasProperty('age')がfalseになるobject"
expect_return = "false"

[[condition]]
id = "all_guards.empty_guards_true"
target_function = "allGuards"
source_lines = "321-325"
description = "guardsが空の場合、[].every(...)の結果としてtrueを返す"
given = "allGuards('anything')"
expect_return = "true"

[[condition]]
id = "any_guard.some_any_true"
target_function = "anyGuard"
source_lines = "340-344"
description = "guards.some(guard => guard(value)) の結果を返す。少なくとも1つのguardがtrueを返す場合trueを返し、短絡評価に従う"
given = "value = 'test', guards = [isString, isNumber]"
expect_return = "true"

[[condition]]
id = "any_guard.some_all_false"
target_function = "anyGuard"
source_lines = "340-344"
description = "すべてのguardがfalseを返す場合falseを返す"
given = "value = true, guards = [isString, isNumber]"
expect_return = "false"

[[condition]]
id = "any_guard.empty_guards_false"
target_function = "anyGuard"
source_lines = "340-344"
description = "guardsが空の場合、[].some(...)の結果としてfalseを返す"
given = "anyGuard('anything')"
expect_return = "false"

