[[condition]]
id = "is_deck_style_value.string_minus1_to_2"
target_function = "isDeckStyleValue"
source_lines = "373-374"
description = "typeof value === 'string' かつ valueが'-1','0','1','2'のいずれかの場合のみtrueを返す"
given = "'-1'、'0'、'1'、'2'、'3'、'-2'、'a'、0、null"
expect_return = "'-1'から'2'のみtrue"

[[condition]]
id = "is_record_of_string_keys.object_non_null_non_array"
target_function = "isRecordOfStringKeys"
source_lines = "395-396"
description = "typeof value === 'object' かつ value !== null かつ Array.isArray(value) === false の場合trueを返す。キーが文字列かどうかや値の型は検証しない"
given = "{}、{ key: 'value' }、Dateインスタンス、null、undefined、[]、文字列、数値"
expect_return = "object非null非配列のみtrue"
