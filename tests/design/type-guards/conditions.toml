# 検証対象: src/utils/type-guards.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、tests/README.md記載の「重要なテスト対象」グループ最優先。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - 数値enumのテストは reverse mapping で生成される文字列キー（例: "Zero"）が
#   Object.values(enumObject).includes(value) により true になる点を明示していなかった。
#   実装挙動を npx tsx で確認し、テストを追加した。

[meta]
feature = "type-guards"
source_file = "src/utils/type-guards.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/utils/type-guards.test.ts"
source_hash = "922e2cb971c1d49380e3b7f35783f7db8fa488db"
note = "verified=falseは0件"

# --- createHtmlElementTypeGuard<T extends Element>(interfaceName, propertyChecks) ---

[[condition]]
id = "html_guard.instanceof_true"
target_function = "createHtmlElementTypeGuard"
source_lines = "22-25"
description = "windowが存在し、window[interfaceName]がtruthyで、element instanceof window[interfaceName]がtrueの場合、propertyChecksを評価せずtrueを返す"
given = "document.createElement('input') を isHTMLInputElement に渡す"
expect_return = "true"

[[condition]]
id = "html_guard.property_fallback_true"
target_function = "createHtmlElementTypeGuard"
source_lines = "22-32"
description = "instanceofでtrueにならない場合でも、elementがtruthyなobjectでpropertyChecksがtrueならtrueを返す"
given = "plain object { tagName: 'INPUT', value: '' } を isHTMLInputElement に渡す"
expect_return = "true"

[[condition]]
id = "html_guard.property_fallback_false"
target_function = "createHtmlElementTypeGuard"
source_lines = "28-32"
description = "elementがnull/undefined等のfalsy、object以外、またはpropertyChecksがfalseの場合はfalseを返す"
given = "null、undefined、文字列、または対象要素のpropertyChecksを満たさないobject"
expect_return = "false"

