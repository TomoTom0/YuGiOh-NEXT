note = "verified=falseは0件"

# --- escapeHtml(text: string): string ---

[[condition]]
id = "escape_html.escapes_five_special_chars"
target_function = "escapeHtml"
source_lines = "24-33"
description = "& < > \" ' の5文字をそれぞれ &amp; &lt; &gt; &quot; &#39; に置換する。それ以外の文字はそのまま返す。"
given = "text = '<div class=\"test\" data-value=\\'test & \"data\"\\'>Content</div>'"
expect_return = "5種の特殊文字が全てエンティティに置換された文字列"

# --- eSafe(value: any): string ---

[[condition]]
id = "e_safe.coerces_then_escapes"
target_function = "eSafe"
source_lines = "48-50"
description = "value を String(value) で文字列化してから escapeHtml でエスケープする。string以外の型(number/null/undefined/object等)でも String() の変換結果に依存する。"
given = "value = 12345 | null | undefined | { key: 'value' } | 危険文字を含む文字列"
expect_return = "String(value) を escapeHtml した結果（'12345'/'null'/'undefined'/'[object Object]'/エスケープ済み文字列）"

# --- escapeAttribute(text: string): string ---

[[condition]]
id = "escape_attribute.escapes_quotes_only"
target_function = "escapeAttribute"
source_lines = "62-64"
description = "ダブルクォート(\") とシングルクォート(') のみをそれぞれ &quot; &#39; に置換する。"
given = "text = 'This is a \"test\" and \\'data\\''"
expect_return = "クォートのみエスケープされた文字列"

[[condition]]
id = "escape_attribute.does_not_escape_ampersand_or_angle_brackets"
target_function = "escapeAttribute"
source_lines = "62-64"
description = "escapeHtmlとは異なり、&, <, > はエスケープ対象に含まれず無変換のまま返る（セキュリティ上の注意点。escapeAttributeを万能なHTMLエスケープと誤用しないこと）。"
given = "text = 'a & b < c > d'"
expect_return = "'a & b < c > d'（無変化）"

# --- setSafeInnerHTML(element: Element | null, html: string): boolean ---

[[condition]]
id = "set_safe_inner_html.null_element_returns_false"
target_function = "setSafeInnerHTML"
source_lines = "81-82"
description = "elementがnull(falsy)の場合、innerHTMLへの代入を行わずfalseを返す。"
given = "element = null"
expect_return = false

[[condition]]
id = "set_safe_inner_html.sets_html_verbatim_returns_true"
target_function = "setSafeInnerHTML"
source_lines = "83-84"
description = "elementが非nullの場合、htmlを一切エスケープせずそのままelement.innerHTMLに設定し、trueを返す。呼び出し側が事前にエスケープ済みのhtmlを渡すことが前提の関数であり、本関数自体はサニタイズを行わない。"
given = "element = document.createElement('div'), html = '<span>Safe HTML</span>'"
expect_return = true
expect_side_effect = "element.innerHTML が html の値そのままに設定される（追加のエスケープなし）"

