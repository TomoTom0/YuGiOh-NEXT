# --- SafeHtmlBuilder.div(options): string ---

[[condition]]
id = "safe_html_builder_div.defaults_when_options_empty"
target_function = "SafeHtmlBuilder.div"
source_lines = "123-134"
description = "class/attributes/content未指定の場合、それぞれ空文字列/空オブジェクト({})/空文字列がデフォルトとなり、属性もクラスも中身も無い<div></div>を返す。"
given = "options = {}"
