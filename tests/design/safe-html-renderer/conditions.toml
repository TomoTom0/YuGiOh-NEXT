# 検証対象: src/utils/safe-html-renderer.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、innerHTML/XSS対策ユーティリティ。
#
# AST骨格抽出スクリプト(scripts/design/extract-ast-skeleton.ts)の既知の限界:
# - SafeHtmlBuilder は `export const SafeHtmlBuilder = { div(...){}, span(...){}, ... }`
#   というオブジェクトリテラル(メソッド定義)であり、スクリプトが検出する
#   「export function」「export class」「export const = アロー関数/関数式」の
#   いずれのパターンにも一致しないため、div/span/p/a の4メソッドは機械抽出結果(6件)に
#   含まれていない。本ファイルでは人手でこの4メソッドの分岐を条件化した。
#
# 実装コメントとの差異・セキュリティ上の注意点(実装コードを読んで判明した事実。
# コード内コメントには明記されていない):
# - escapeHtml() は & < > " ' の5文字をエスケープするが、escapeAttribute() は
#   " と ' の2文字のみで、& < > はエスケープしない(escapeAttributeという関数名からは
#   HTML特殊文字全般をエスケープするように誤読しやすいため明記する)。
# - SafeHtmlBuilder の各メソッド(div/span/p/a)は options.class と options.content を
#   一切エスケープせずそのまま埋め込む。JSDocの使用例では呼び出し側が事前に
#   escapeHtml()した文字列をcontentに渡す前提になっているが、関数自体はそれを強制しない。
# - SafeHtmlBuilder.a() の href は escapeAttribute() でエスケープされるが、これは
#   クォート文字の無害化のみであり、`javascript:` 等の危険なプロトコル文字列自体は
#   除去・検知されない(そのためのチェックは別関数 checkHTMLSafety() が担っている)。
# - escapeHtml() の置換コールバック `(char) => map[char] ?? char` の `?? char`
#   フォールバックは、正規表現 `/[&<>"']/g` がマッチさせる文字は必ず map のキーに
#   存在するため、公開APIからは到達不可能(型システムではなくデータ的に保証)。
#   README 2節の「書かない」対象と判断し条件化していない。

[meta]
