[[condition]]
id = "safe_html_builder_div.attribute_values_escaped_keys_not"
target_function = "SafeHtmlBuilder.div"
source_lines = "128-130"
description = "options.attributesの各エントリは ` key=\"escapeAttribute(value)\"` の形で連結される。属性値(value)はescapeAttributeでエスケープされるが、属性キー(key)はエスケープされずそのまま出力される。"
given = "options.attributes = { 'data-id': '123\"x' }"
expect_return_shape = "生成されたタグに ' data-id=\"123&quot;x\"' が含まれる（値はエスケープ、キーは無変換）"

[[condition]]
id = "safe_html_builder_div.class_not_escaped"
target_function = "SafeHtmlBuilder.div"
source_lines = "131"
description = "options.classはエスケープされずそのままclass属性値として埋め込まれる。呼び出し側が信頼できない文字列をclassに渡すと未エスケープのまま出力される。"
given = "options.class = 'x\"y'"
expect_return_shape = "生成されたタグに ' class=\"x\"y\"' がそのまま含まれる（エスケープなし）"

[[condition]]
id = "safe_html_builder_div.content_not_escaped"
target_function = "SafeHtmlBuilder.div"
source_lines = "132-133"
description = "options.contentはエスケープされずそのままタグの内側に挿入される。事前にescapeHtml等でエスケープ済みの文字列を渡すことが呼び出し側の責務であり(JSDocコメントの推奨用法)、SafeHtmlBuilder自体は追加のエスケープを行わない。"
given = "options.content = '<script>alert(1)</script>'（未エスケープの生文字列）"
expect_return = "'<div><script>alert(1)</script></div>'（contentがそのまま埋め込まれる）"

