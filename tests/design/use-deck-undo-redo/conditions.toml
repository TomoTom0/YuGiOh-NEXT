# --- useDeckUndoRedo(): Undo/Redo state and operations ---

[[condition]]
id = "init.empty_history_index_minus_one"
target_function = "useDeckUndoRedo"
source_lines = "38-49,221-240"
description = "新規作成直後はcommandHistoryが空配列、commandIndexが-1で、canUndo/canRedoはいずれもfalseになる"
given = "useDeckUndoRedo()を新規に呼ぶ"
expect_return_shape = "{ commandHistory: [], commandIndex: -1, canUndo: false, canRedo: false }"

[[condition]]
id = "push.truncates_redo_branch"
target_function = "useDeckUndoRedo"
source_lines = "56-60"
description = "pushCommand時、commandIndexが履歴末尾より前ならcommandIndex+1以降の履歴をspliceで削除してから新コマンドを追加する"
given = "履歴[A,B,C]でcommandIndex=1の状態からpushCommand(D)する"
expect_return_shape = "履歴は[A,B,D]になり、Cは残らない"

