[[condition]]
id = "constructor.custom_options_override_defaults"
target_function = "RequestQueue#constructor"
source_lines = "43-51"
description = "optionsの各プロパティを指定した場合、??の左辺が優先されデフォルト値は使われない"
given = "new RequestQueue({ concurrentLimit: 1, initialRetryDelay: 10, maxRetryDelay: 200, maxRetries: 2, timeoutMs: 500 })"
expect_side_effect = "内部options = { concurrentLimit: 1, initialRetryDelay: 10, maxRetryDelay: 200, maxRetries: 2, timeoutMs: 500 }"

