# 検証対象: src/utils/request-queue.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、同時実行数制限・リトライ・タイムアウトを持つAPIリクエストキューutils。
#
# 単純なgetter/setterでbranchを持たない公開メソッド（getQueueSize/getActiveCount/clear）と
# 単純なsetTimeoutラッパーの非公開メソッド（sleep）は、README 2節の粒度基準
# （「書かない: 単純なgetter/setter」）に従い条件化しない。
#
# 実装コメントとの差異・注意点:
# - executeWithTimeout (L133-143) は setTimeout の ID を保持せず、fn() が先にsettleしても
#   clearTimeout を呼ばない（promise-timeout.ts の withTimeout とは異なり後始末しない）。
#   このためタイマーがリークするが、Promise.race の結果自体には影響しない（分岐ではないため
#   条件化はしないが、テストではfakeTimersで明示的にクリアする）。
# - executeWithRetry (L106-128) はループガード `request.retries <= maxRetries` を持つが、
#   request.retries は常に0初期化かつループ内でしか増加しないため、通常は最終的に
#   throw(L117) かreturn(L111)でループを抜ける。maxRetriesが負数（options.maxRetries: -1等）の
#   場合のみ、ループ本体に一度も入らずL127の`throw new Error('Max retries exceeded')`に到達する。
#   promise-timeout.ts の retryWithTimeout と同型の実装であり、同種の「到達可能な例外パス」。
# - process() (L87-90) の `if (!request)` は、直前の `this.queue.length === 0` ガード(L80)と
#   L85のshift()の間に非同期処理が挟まらない（単一スレッド・awaitなし）ため、通常の呼び出し
#   経路では到達不能に見える防御的コードである。ただしprivateメソッドへの直接アクセスで
#   queueをshift()がundefinedを返す疑似配列に差し替えることで検証可能なため、
#   verified=falseにはせず実テストでカバーする。

[meta]
feature = "request-queue"
source_file = "src/utils/request-queue.ts"
verified = true
verified_at = "2026-08-28"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/request-queue.test.ts"
source_hash = "c90959b63a741dd8f962323bd128e55381300ae9"
note = "verified=falseは0件（privateメソッドへの直接アクセスにより全条件を検証可能）"

