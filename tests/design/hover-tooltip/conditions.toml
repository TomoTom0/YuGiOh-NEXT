# 検証対象: src/components/HoverTooltip.vue
#
# ボタン等をhoverした際にブラウザネイティブtitle属性の代替として独自tooltipを
# 表示する共通ラッパー。position: fixed で body 直下へ Teleport するため祖先の
# overflow:hidden の影響を受けない。
# TASK-476: src/components/__tests__/HoverTooltip.test.ts の
# tests/unit/components/ 移動に伴うdesign整備として条件化。
#
# 粒度方針:
# - Vueコンポーネントのため script setup 相当のロジック分岐（表示条件・イベント
#   状態遷移・classバインディング・slot）を主対象とし、template表示結果は簡潔に。
# - 既存itが存在しない実装分岐（style computed の位置計算等）は [[excluded]] に記録
#   （TASK-476 は移動伴いの design 整備であり、新規テスト追加はスコープ外）。

[meta]
feature = "hover-tooltip"
source_file = "src/components/HoverTooltip.vue"
verified = true
verified_at = "2026-09-09"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/components/HoverTooltip.test.ts"
source_hash = "2bec552bf05f80e766711e9e5930ea0c50f62a2c"
note = "verified=falseは0件。idのareaはdesignディレクトリstem（hover-tooltip）で統一（browser-config/conditions.tomlの慣習に整合、`_`不使用）"

[[condition]]
id = "hover-tooltip.initial-state-not-visible"
target_function = "HoverTooltip visible ref + template v-if"
source = "src/components/HoverTooltip.vue L12, L45 と tm TASK-476（src/__tests__からの移動に伴うdesign整備）"
source_lines = "12, 45"
description = "マウント直後（hover前）は visible=false のためtooltipを描画しない。表示はmouseenter後の状態遷移に依存する初期状態の保証"
given = "text='Reset' を指定してマウント（mouseenter未発生）"
expect_return_shape = "body配下に .command-tooltip-fixed 要素は存在しない"

[[condition]]
id = "hover-tooltip.mouseenter-shows-teleported-tooltip-with-text"
target_function = "HoverTooltip visible ref + template v-if"
source = "src/components/HoverTooltip.vue L5, L9-L18 と tm TASK-476（src/__tests__からの移動に伴うdesign整備）"
source_lines = "5, 9-18"
description = "wrapper上の mouseenter で visible が true になり、text の内容をbody直下へTeleportしたtooltip要素に表示する（祖先のoverflow:hiddenの影響を受けない配置）"
given = "text='save' を指定してマウントし、.btn-tooltip-wrapper へ mouseenter"
expect_return_shape = "body直下に .command-tooltip-fixed が現れ、そのtextContentが 'save'"

[[condition]]
id = "hover-tooltip.mouseleave-hides-tooltip"
target_function = "HoverTooltip visible ref + template v-if"
source = "src/components/HoverTooltip.vue L6, L12 と tm TASK-476（src/__tests__からの移動に伴うdesign整備）"
source_lines = "6, 12"
description = "wrapper上の mouseleave で visible が false に戻り、tooltipを非表示にする（表示状態の解放）"
given = "text='save' で mouseenter 表示後、.btn-tooltip-wrapper へ mouseleave"
expect_return_shape = "body配下に .command-tooltip-fixed 要素は存在しない"

[[condition]]
id = "hover-tooltip.empty-text-keeps-tooltip-hidden"
target_function = "HoverTooltip template v-if"
source = "src/components/HoverTooltip.vue L12 と tm TASK-476（src/__tests__からの移動に伴うdesign整備）"
source_lines = "12"
description = "v-if の表示条件は visible && text であり、text が空文字（デフォルト）の場合はhoverされてもtooltipを描画しない"
given = "text='' を指定してマウントし、.btn-tooltip-wrapper へ mouseenter"
expect_return_shape = "body配下に .command-tooltip-fixed 要素は存在しない"

[[condition]]
id = "hover-tooltip.tooltip-class-bound-to-tooltip-element"
target_function = "HoverTooltip template :class binding"
source = "src/components/HoverTooltip.vue L14, L39-L42 と tm TASK-476（src/__tests__からの移動に伴うdesign整備）"
source_lines = "14, 39-42"
description = "tooltipClass prop に指定されたクラスをtooltip要素に付与する（type-add 等の意味別色分けに使用）"
given = "text='Undo', tooltipClass='type-add' を指定してマウントし、mouseenter"
expect_return_shape = "表示された .command-tooltip-fixed が type-add クラスを持つ"

[[condition]]
id = "hover-tooltip.default-slot-rendered"
target_function = "HoverTooltip template slot"
source = "src/components/HoverTooltip.vue L8 と tm TASK-476（src/__tests__からの移動に伴うdesign整備）"
source_lines = "8"
description = "default slot の内容（ラップ対象のボタン等）をwrapper内にそのまま描画する（tooltip表示状態と無関係に常時描画）"
given = "default slot に <button class=\"my-btn\">click me</button> を指定してマウント"
expect_return_shape = "wrapper内に .my-btn が存在し、text が 'click me'"

