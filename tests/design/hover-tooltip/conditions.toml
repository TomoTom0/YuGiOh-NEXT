source = "src/components/HoverTooltip.vue L48-L57（tests/unit/components/HoverTooltip.test.ts に位置・style値をassertするit無し）"
reason = "対応する既存itが存在しない。TASK-476はsrc/__tests__からの移動に伴うdesign整備であり新規テスト追加はスコープ外のため条件化しない"
decided_at = "2026-09-09"
decided_by = "claude"

[[excluded]]
item = "tooltip-fade Transition による opacity 0.15s の表示/非表示アニメーション"
source = "src/components/HoverTooltip.vue L10, L112-L120（tests/unit/components/HoverTooltip.test.ts にアニメーションを検証するit無し）"
reason = "CSSの見た目遷移のみで、tooltipの表示/非表示判定（条件化済みのvisible && text分岐）自体に挙動差を生まない（§8「書かない」: 挙動に差を生まない内部処理に相当）"
decided_at = "2026-09-09"
decided_by = "claude"

[[excluded]]
item = "type-add / type-remove / type-move / type-reorder 各クラスのSCSS色定義（背景・文字・枠線色）"
source = "src/components/HoverTooltip.vue L87-L109（tests/unit/components/HoverTooltip.test.ts はクラス付与の有無のみ検証）"
reason = "静的なスタイル定義でありロジック分岐を持たない。クラスがtooltip要素へ付与される分岐は hover-tooltip.tooltip-class-bound-to-tooltip-element で条件化済み"
decided_at = "2026-09-09"
decided_by = "claude"
