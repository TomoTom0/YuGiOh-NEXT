# 検証対象: src/utils/png-metadata.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、tests/README.md記載の「重要なテスト対象」グループ最優先。
#
# 既存テストの説明文/アサーションの不正確さ:
# - tests/unit/png-metadata.test.ts の「should return null for invalid PNG」は有効なPNGを渡しており、
#   実際には「DeckInfo tEXtチャンクがないPNGはnull」を検証していただけだったため、説明文を修正した。
# - tests/unit/png-metadata.test.ts の「should validate CRC correctly」は、抽出成功をCRC検証成功とみなしていたが、
#   実装はCRCを一切読まず検証しない。CRCを破壊しても抽出できる挙動を確認するテストへ修正した。

[meta]
feature = "png-metadata"
source_file = "src/utils/png-metadata.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/png-metadata.test.ts tests/unit/utils/png-metadata.test.ts"
source_hash = "9d324c7c18f4aaf03c46c9c8f414eb8b4bff44e2"
note = "verified=falseは0件"

# --- isValidSimpleDeckInfo(obj: unknown): obj is SimpleDeckInfo （非export） ---

[[condition]]
