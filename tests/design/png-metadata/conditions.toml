description = "objがobjectでない、またはnullの場合はfalseを返す"
given = "DeckInfo tEXtチャンクのJSON値がnullまたは文字列"
expect_return = false

[[condition]]
id = "simple_deck_guard.required_sections_must_be_arrays"
target_function = "isValidSimpleDeckInfo"
source_lines = "33-35"
description = "main/extra/sideのいずれかが配列でない場合はfalseを返す"
given = "DeckInfo tEXtチャンクのJSON値でmain/extra/sideのいずれかが欠落、または配列以外"
expect_return = false

[[condition]]
id = "simple_deck_guard.card_must_be_object"
target_function = "isValidSimpleDeckInfo"
source_lines = "39-41"
description = "main/extra/side配列内の要素がobjectでない、またはnullの場合はfalseを返す"
given = "DeckInfo tEXtチャンクのJSON値でmain配列にnullや文字列が含まれる"
expect_return = false

[[condition]]
id = "simple_deck_guard.card_fields_must_have_expected_types"
target_function = "isValidSimpleDeckInfo"
source_lines = "43-48"
description = "カード要素のcid/ciid/encがstringで、quantityがnumberでない場合はfalseを返す"
given = "DeckInfo tEXtチャンクのJSON値でカード要素のcid/ciid/enc/quantityの型が実装条件に合わない"
expect_return = false

[[condition]]
id = "simple_deck_guard.quantity_must_be_integer_0_to_99"
target_function = "isValidSimpleDeckInfo"
source_lines = "48-50"
