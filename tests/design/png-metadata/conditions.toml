given = "DeckInfo tEXtチャンクのJSON値でquantityが-1、1.5、100、0、99"
expect_return_shape = "-1/1.5/100はfalse、0/99はtrue"

[[condition]]
id = "simple_deck_guard.all_sections_every_card_valid"
target_function = "isValidSimpleDeckInfo"
