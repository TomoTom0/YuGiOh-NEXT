target_function = "computeCategoryMatchedCardIds"
source_lines = "62"
description = "selectedCategories が空配列の場合は他の引数に関わらず空のSetを返す早期return"
given = "selectedCategories = []（カテゴリ未選択）"
expect_return = "size === 0 の Set"

