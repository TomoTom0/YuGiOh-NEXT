expect_return = "firstStage/secondStage の走査で cid '1' に対する cardDB 呼び出しは1回限り（結果のSetにも '1' は1つだけ含まれる）"

[[condition]]
id = "first_stage.ignores_missing_card"
target_function = "computeCategoryMatchedCardIds"
source_lines = "83-84"
description = "一段階目の走査で cardDB(cid) が undefined を返す cid は continue でスキップする（マッチ判定に進まない）"
given = "デッキに cid='999' が含まれるが cardDB('999') が undefined を返す状態で、カテゴリラベルを渡す"
expect_return = "結果のSetに cid '999' は含まれない"

[[condition]]
id = "first_stage.search_fields_joined_with_space"
target_function = "computeCategoryMatchedCardIds"
source_lines = "86-93"
description = "一段階目の検索対象テキストは name/ruby/text/pendulumText をスペース区切りで join したもの。optional フィールド（ruby/text/pendulumText）が undefined の場合は `|| ''` で空文字として join に加える（undefined がそのまま join されるのを防ぐ）。label は部分一致（includes）で判定"
given = "name='ブラック・マジシャン'、ruby=undefined、text='魔法使い族の代表'、pendulumText='P効果' のカードと、ラベル='P効果'（または '魔法使い族' または 'ブラック・マジシャン'）を渡す"
expect_return = "いずれかのラベルが name/ruby/text/pendulumText のいずれかに含まれていれば一段階目でマッチ（firstStageMatched に追加される）"

[[condition]]
id = "first_stage.matches_if_any_label_matches_OR_semantics"
target_function = "computeCategoryMatchedCardIds"
source_lines = "93"
description = "複数ラベルのいずれか1つでも searchTexts に含まれればマッチ（Array.prototype.some による OR semantics）"
given = "selectedCategories が ['cat1','cat2'] でラベルがそれぞれ 'A', 'B'。カードの searchTexts に 'B' のみ含まれる（'A' は含まれない）"
