# 検証対象: src/composables/deck/useCategoryMatcher.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、デッキメタデータのカテゴリラベルをもとに2段階検索で関連カードの
# cid Set を構築する純粋関数 composable。computeCategoryMatchedCardIds 1つの export 関数のみ。
#
# 到達不能/実質到達不能分岐:
# - L86-91 の `card.ruby || ''` / `card.text || ''` / `card.pendulumText || ''` フォールバックは
#   optional フィールド（undefined許容）の join 結果からの除外に過ぎず、分岐としての挙動差を
#   生まない（undefined を空文字に置き換えて join しても最終的な searchTexts は同一のため）。
#   よって個別の condition にはせず、first_stage.search_fields_joined_with_space 内で言及する。
# - L67 の type guard `(label): label is string => Boolean(label)` は categoryLabelMap[catId] が
#   undefined / 空文字 / null のいずれかを弾くが、現実の呼出し元はカテゴリID→ラベルのMapを渡す
#   ため空文字ラベルが混入する余地は少ない。ただし到達不能とは言えず（呼び出し次第で到達可能）、
#   labels.unresolved_filtered_or_empty_set で条件化している。
#
# 既知の設計上の注意点（バグではないが複雑な挙動。実装読解で判明）:
# - 一段階目は name/ruby/text/pendulumText の4フィールドを検索対象とするが、二段階目は
#   text/pendulumText の2フィールドのみ（name/rubyを含まない）。この非対称性は意図的（二段階目は
#   「カード名をテキストに含むカード」を見つけることが目的で、カード名そのものを再検索しない）。
#   ただし「rubyにカード名が含まれるカード」は二段階目で検出されない点に注意（source_lines 111-114）。
# - searchTexts.includes(label) は部分一致。そのためラベルが他の単語の一部に含まれていてもマッチ
#   する（例: ラベル「青眼」で「青眼の白龍」「青眼の究極竜」の両方にマッチ）。これは仕様。
# - allCids を Set で構築するため、同一cidが複数セクション（main/extra等）に重複して含まれていても
#   cardDB(cid) の呼び出しはcidにつき1回。また走査順は Set の挿入順（main→extra→side→trash）。
# - firstStageCardNames は card.name を格納するが、カード名はcidに1:1なので重複なし。
# - 二段階目のbreak最適化（L121）はループ毎の早期脱却で、結果には影響しない（性能上の最適化）。
# - selectedCategories が空で早期return（L62）するため、firstStageCardNames が空になるのは
#   「allCids が空」または「cardDB が全て undefined」または「ラベルが長すぎて検索テキストに
#   含まれない」場合のみ。L104 のガードはこれらの境界ケース向け。

