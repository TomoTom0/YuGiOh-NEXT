given = "selectedCategories = ['cat1'] だが categoryLabelMap = {}（または { cat1: '' }）"
expect_return = "size === 0 の Set"

[[condition]]
id = "collects_unique_cids_across_all_sections"
target_function = "computeCategoryMatchedCardIds"
source_lines = "72-76"
description = "allDecks の main/extra/side/trash 全4セクションから cid を収集し Set で重複排除する。同一cidが複数セクションにまたがって含まれていても cardDB(cid) の呼び出しはcidにつき1回になる"
