# --- safeQuery<T extends Element = Element>(selector, parent) ---

[[condition]]
id = "safe_query.found_returns_element"
target_function = "safeQuery"
source_lines = "30-32"
description = "parentが指定されなければdocumentを検索し、querySelectorが要素を返した場合はその要素を返す"
given = "document内にselectorに一致する要素が存在する"
expect_return_shape = "見つかったElementそのもの"

[[condition]]
id = "safe_query.not_found_returns_null"
target_function = "safeQuery"
source_lines = "30-32"
description = "querySelectorがnullを返した場合、nullを返す"
given = "selectorに一致する要素が存在しない"
expect_return = "null"

[[condition]]
id = "safe_query.uses_parent_when_truthy"
target_function = "safeQuery"
source_lines = "30-31"
description = "parentがtruthyの場合はparent.querySelector(selector)で検索する"
given = "document全体には同じselectorの要素が複数あり、parent内にも一致要素が存在する"
expect_return_shape = "parent内で最初に見つかった要素"

# --- safeQueryWithWarn<T extends Element = Element>(selector, errorMessage, parent) ---

[[condition]]
id = "safe_query_warn.found_no_warn"
target_function = "safeQueryWithWarn"
source_lines = "51-60"
description = "querySelectorが要素を返した場合、console.warnを呼ばず、その要素を返す"
given = "selectorに一致する要素が存在する"
expect_return_shape = "見つかったElementそのもの"

[[condition]]
id = "safe_query_warn.missing_default_warn"
target_function = "safeQueryWithWarn"
source_lines = "54-60"
description = "querySelectorがnullを返し、errorMessageが未指定の場合、デフォルト警告を出してnullを返す"
given = "selector = '#not-found', errorMessage = undefined"
expect_return = "null"
expect_side_effect = "console.warn('[safeQueryWithWarn] Element not found: \"#not-found\"') が1回呼ばれる"

[[condition]]
id = "safe_query_warn.missing_custom_warn"
target_function = "safeQueryWithWarn"
source_lines = "54-60"
description = "querySelectorがnullを返し、truthyなerrorMessageが指定された場合、そのメッセージで警告を出してnullを返す"
given = "selectorに一致する要素が存在せず、errorMessage = 'Custom error message'"
expect_return = "null"
expect_side_effect = "console.warn('Custom error message') が1回呼ばれる"

[[condition]]
id = "safe_query_warn.falsy_message_uses_default"
target_function = "safeQueryWithWarn"
source_lines = "54-60"
description = "querySelectorがnullを返し、errorMessageが空文字列などfalsyの場合、カスタムメッセージではなくデフォルト警告を出す"
given = "selector = '#not-found', errorMessage = ''"
expect_return = "null"
expect_side_effect = "console.warn('[safeQueryWithWarn] Element not found: \"#not-found\"') が1回呼ばれる"

[[condition]]
id = "safe_query_warn.uses_parent_when_truthy"
target_function = "safeQueryWithWarn"
source_lines = "51-52"
description = "parentがtruthyの場合はparent.querySelector(selector)で検索する"
given = "parent内にselectorに一致する要素が存在する"
expect_return_shape = "parent内で見つかったElementそのもの"

