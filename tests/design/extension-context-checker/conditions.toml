target_function = "safeStorageSet"
source_lines = "100-109"
description = "入口ガードを通過した後、chrome.storage.local.setのコールバック内でchrome.runtime.lastErrorが真の場合、Error(`Storage set failed: ${lastError.message}`)でreject。isExtensionContextInvalidated(error)はfalseとなりshowReloadPrompt()は呼ばれず、errorのみ再throwされる"
