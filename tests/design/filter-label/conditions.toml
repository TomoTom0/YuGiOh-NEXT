# --- getAttributeLabel(value: string, lang?: string): string ---

[[condition]]
id = "get_attribute_label.lang_specified_used_directly"
target_function = "getAttributeLabel"
source_lines = "23-27"
description = "lang引数が指定された場合、detectLanguageを呼ばずその言語をmappingManager.getAttributeIdToTextに渡す"
given = "getAttributeLabel('light', 'en')"
expect_return = "Light"
expect_side_effect = "detectLanguageは呼ばれない"

[[condition]]
id = "get_attribute_label.lang_omitted_document_defined_uses_detect_language"
target_function = "getAttributeLabel"
source_lines = "23-24"
description = "lang省略時、typeof document !== 'undefined'ならdetectLanguage(document)の戻り値を言語として使う"
given = "getAttributeLabel('light')（documentが定義されたテスト環境）"
expect_return = "光（detectLanguageモックは'ja'を返す）"
expect_side_effect = "detectLanguageが呼ばれる"

[[condition]]
id = "get_attribute_label.lang_omitted_document_undefined_fallback_ja"
target_function = "getAttributeLabel"
source_lines = "23-24"
description = "lang省略時、typeof document === 'undefined'ならdetectLanguageを呼ばずハードコードの'ja'を使う"
given = "vi.stubGlobal('document', undefined)後にgetAttributeLabel('light')"
expect_return = "光"
expect_side_effect = "detectLanguageは呼ばれない"

[[condition]]
id = "get_attribute_label.value_found_returns_mapped_label"
target_function = "getAttributeLabel"
source_lines = "25-26"
description = "idToTextにvalueが存在する場合、対応するラベルを返す"
given = "getAttributeLabel('dark', 'ja')"
expect_return = "闇"

[[condition]]
id = "get_attribute_label.value_not_found_returns_value_as_is"
target_function = "getAttributeLabel"
source_lines = "26"
description = "idToTextにvalueが存在しない場合、valueをそのまま返す（||フォールバック）"
given = "getAttributeLabel('unknown', 'ja')"
expect_return = "unknown"

