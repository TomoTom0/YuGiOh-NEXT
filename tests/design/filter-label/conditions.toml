# --- getAttributeLabel(value: string, lang?: string): string ---

[[condition]]
id = "get-attribute-label.lang-specified-used-directly"
source_lines = "tests/unit/utils/filter-label.test.ts:64"
target_function = "getAttributeLabel"
description = "lang引数が指定された場合、detectLanguageを呼ばずその言語をmappingManager.getAttributeIdToTextに渡す"
given = "getAttributeLabel('light', 'en')"
expect_return = "Light。detectLanguageは呼ばれない"

[[condition]]
id = "get-attribute-label.lang-omitted-document-defined-uses-detect-language"
source_lines = "tests/unit/utils/filter-label.test.ts:76"
target_function = "getAttributeLabel"
description = "lang省略時、typeof document !== 'undefined'ならdetectLanguage(document)の戻り値を言語として使う"
given = "getAttributeLabel('light')（documentが定義されたテスト環境）"
expect_return = "光（detectLanguageモックは'ja'を返す）。detectLanguageが呼ばれる"

[[condition]]
id = "get-attribute-label.lang-omitted-document-undefined-fallback-ja"
source_lines = "tests/unit/utils/filter-label.test.ts:82"
target_function = "getAttributeLabel"
description = "lang省略時、typeof document === 'undefined'ならdetectLanguageを呼ばずハードコードの'ja'を使う"
given = "vi.stubGlobal('document', undefined)後にgetAttributeLabel('light')"
expect_return = "光。detectLanguageは呼ばれない"

[[condition]]
id = "get-attribute-label.value-found-returns-mapped-label"
source_lines = "tests/unit/utils/filter-label.test.ts:57"
target_function = "getAttributeLabel"
description = "idToTextにvalueが存在する場合、対応するラベルを返す"
given = "getAttributeLabel('dark', 'ja')"
expect_return = "闇"

[[condition]]
id = "get-attribute-label.value-not-found-returns-value-as-is"
source_lines = "tests/unit/utils/filter-label.test.ts:72"
target_function = "getAttributeLabel"
description = "idToTextにvalueが存在しない場合、valueをそのまま返す（||フォールバック）"
given = "getAttributeLabel('unknown', 'ja')"
expect_return = "unknown"

