# 検証対象: src/api/forbidden-limited.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# Phase1.6(TASK-326)のTier A試行対象ファイルの1つ（API系）。
# export関数だけでなく、意味のある分岐を持つ非export関数（extractCardsFromSection等）も対象とする。

[meta]
feature = "forbidden-limited"
source_file = "src/api/forbidden-limited.ts"
verified = true
verified_at = "2026-08-05"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/api/forbidden-limited-parse.test.ts tests/unit/api/forbidden-limited-utils.test.ts"
source_hash = "9c2e39fff58c60a32ab152b5b6c5a48894bf07a6"

# --- parseForbiddenLimitedHtml(html: string, effectiveDate: string): ForbiddenLimitedList ---

[[condition]]
id = "parse.forbidden_section.present"
target_function = "parseForbiddenLimitedHtml"
source_lines = "26-29"
description = "#list_forbiddenが存在する場合、配下の.t_rowをforbidden規制として抽出する"
given = "html に #list_forbidden > .t_row(input.link_value=\"...cid=100\") が1件存在する"
expect_return_shape = "regulations[\"100\"] === \"forbidden\""

[[condition]]
id = "parse.forbidden_section.absent"
target_function = "parseForbiddenLimitedHtml"
source_lines = "26-29"
description = "#list_forbiddenが存在しない場合、forbidden抽出はスキップされる（エラーにはならない）"
given = "html に #list_forbidden が存在しない"
expect_no_throw = true
expect_return_shape = "regulations に forbidden カードは含まれない"

[[condition]]
id = "parse.section_overwrite_order"
target_function = "parseForbiddenLimitedHtml"
source_lines = "26-41"
description = "同一cidが複数セクションに出現した場合、forbidden→limited→semi-limitedの順に上書きされ最後に処理したセクションの規制が残る"
given = "cid=100 が #list_forbidden と #list_semi_limited の両方に出現する"
expect_return_shape = "regulations[\"100\"] === \"semi-limited\""
note = "3セクションを順に処理し同じregulationsオブジェクトへ書き込むため、後勝ちになる。仕様として意図されているかは要確認"

[[condition]]
id = "parse.always_no_throw"
target_function = "parseForbiddenLimitedHtml"
source_lines = "19-48"
description = "3セクションすべてが存在しなくても例外は投げず、空のregulationsを返す"
given = "html に #list_forbidden/#list_limited/#list_semi_limited のいずれも存在しない"
expect_no_throw = true
expect_return_shape = "regulations === {}"

# --- extractCardsFromSection(section, regulation, regulations): void (非export) ---

[[condition]]
id = "extract_cards.link_value_missing"
target_function = "extractCardsFromSection"
source_lines = "66-69"
description = ".t_row内にinput.link_value要素が無い、またはvalueが空の場合、その行はスキップされる"
given = ".t_row に input.link_value 要素が存在しない"
expect_side_effect = "regulationsに何も追加されない"

[[condition]]
id = "extract_cards.cid_pattern_unmatched"
target_function = "extractCardsFromSection"
source_lines = "73-77"
description = "input.link_valueのvalueが/[?&]cid=(\\d+)/にマッチしない場合、その行はスキップされる"
given = "input.link_value.value = \"/yugiohdb/card_search.action?ope=2\"（cidパラメータなし）"
expect_side_effect = "regulationsに何も追加されない"

[[condition]]
id = "extract_cards.cid_matched"
target_function = "extractCardsFromSection"
source_lines = "73-77"
description = "cidパラメータが抽出できた場合、regulations[cid] = regulation を設定する"
given = "input.link_value.value = \"/yugiohdb/card_search.action?ope=2&cid=5195\", regulation = \"limited\""
expect_side_effect = "regulations[\"5195\"] === \"limited\""

# --- fetchForbiddenLimitedList(effectiveDate?: string): Promise<ForbiddenLimitedList> ---

[[condition]]
id = "fetch_list.response_not_ok"
target_function = "fetchForbiddenLimitedList"
source_lines = "93-96"
description = "fetchのresponse.okがfalseの場合、ステータスコード・ステータステキスト付きでthrowする"
given = "fetch が { ok: false, status: 500, statusText: \"Internal Server Error\" } を返す"
expect_throw_contains = "Failed to fetch forbidden/limited list: 500 Internal Server Error"

[[condition]]
id = "fetch_list.effective_date_provided"
target_function = "fetchForbiddenLimitedList"
source_lines = "100-103"
description = "effectiveDateが引数で指定された場合、HTMLからの抽出をせずその値をそのまま使う"
given = "effectiveDate = \"2024-04-01\"、htmlの<select>選択値は別の日付"
expect_return_shape = "戻り値.effectiveDate === \"2024-04-01\"（htmlの値ではなく引数の値）"

[[condition]]
id = "fetch_list.effective_date_omitted"
target_function = "fetchForbiddenLimitedList"
source_lines = "100-103"
description = "effectiveDateが省略された場合、HTMLから適用日を抽出して使う"
given = "effectiveDate = undefined、htmlの<select option selected value=\"2024-07-01\">"
expect_return_shape = "戻り値.effectiveDate === \"2024-07-01\""

