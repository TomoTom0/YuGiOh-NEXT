# 検証対象: src/utils/deck-thumbnail-generator.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、DeckThumbnailGenerator(Canvas→WebP Data URL生成)を持つutils。
# 混同注意: src/utils/deck-thumbnail.ts (別ファイル、TASK-330で完了済み) とは別物。
#
# 実装コメントとの差異:
# - drawDeckInfoOnCanvas L131 で wrapText に canvas.width 由来の maxWidth を渡しているが、
#   wrapText 内部（L183, `_maxWidth`）ではこの引数を全く使用せず、常に固定20文字で折り返す。
#   引数名がアンダースコア接頭辞(`_maxWidth`)であり未使用パラメータであることをTypeScript側でも示している。
# - wrapText本体のコメント(L184)に「日本語は1文字で改行、英数は単語単位で改行」とあるが、
#   実際の実装は文字種を判別せず、全角/半角を問わず一律20文字ごとに機械的に折り返す
#   （英数字であっても単語境界を無視して分割される）。
# - drawDeckInfoOnCanvas のデッキ名描画(L132-135)にはy座標の上限チェックが無く、
#   canvas.heightを超えてはみ出す場合でも常に描画される。一方、統計行(L152-157)・
#   カード一覧行(L170-177)は`y < canvas.height - padding`を満たす場合のみ描画され、
#   超過分は静かにスキップされる（非対称な挙動）。
# - テスト実行環境(node-canvas ^3.2.0)のCanvasオブジェクトは`toBlob`メソッドを実装していないため
#   （`typeof createCanvas(1,1).toBlob === 'undefined'`で確認済み）、
#   generateWebPThumbnail/canvasToWebPの検証は、実装内部で呼ばれる私有メソッドを
#   直接fakeなcanvasオブジェクト（toBlobのみ実装）またはスパイで置き換えて行う。

[meta]
feature = "deck-thumbnail-generator"
source_file = "src/utils/deck-thumbnail-generator.ts"
verified = true
verified_at = "2026-08-28"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/deck-thumbnail-generator.test.ts"
source_hash = "82e8156adc2490c58ce967fda46e0b448d43a6a9"
note = "verified=falseは0件（公開API・privateメソッドとも直接呼び出しで到達・検証可能）"

