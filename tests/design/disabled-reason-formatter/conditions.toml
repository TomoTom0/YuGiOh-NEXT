# 検証対象: src/utils/disabled-reason-formatter.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)。排他エンジンから呼ばれるdisabled reasonの日本語フォーマッタ。
#
# 補足:
# - getAttributeDisplayLabel / getFieldDisplayLabel は非exportのヘルパー関数（AST抽出スクリプトの
#   「未カバーexport関数検出」の対象外）。README 3節Phase1.6知見の通り、非exportでも意味のある
#   分岐を持つため人手でconditionsを書いた。機械チェックでの担保は無い点に留意。
# - formatDisabledReason の第3引数 _details は関数本体で一切参照されない（未使用）。値によって
#   挙動が変わらないため条件化していない。
# - getAttributeDisplayLabel内の `monsterTypeMatch && monsterTypeMatch[1]` 等のnullチェックは、
#   正規表現が `(.+)$`（1文字以上必須）でマッチした時点でmatch[1]は必ず非空文字列になるため、
#   TypeScriptのnarrowing用の防御コードであり実行時に到達しうる分岐ではない
#   （README 2節「書かない」基準：型システムで保証済みの分岐）。よって条件化していない。

