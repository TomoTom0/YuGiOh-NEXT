# --- downloadDeckRecipeImage(options) ---

[[condition]]
id = "download_deck_recipe_image.deckdata_provided_skips_fetch"
target_function = "downloadDeckRecipeImage"
source_lines = "27-28"
description = "options.deckDataが既に渡されている場合、cgid取得・axios経由のHTML取得・パースを行わずそのまま使う"
given = "options.deckDataに値が設定されている"
expect_side_effect = "sessionManager.getCgidは呼ばれない"

[[condition]]
id = "download_deck_recipe_image.no_deckdata_fetches_own_deck_via_dno"
target_function = "downloadDeckRecipeImage"
source_lines = "28-42"
description = "deckDataが無くdnoがある場合、sessionManager.getCgid()→getDeckDisplayUrlでURL生成→axios.getでHTML取得→DOMParserでパース→parseDeckDetailでdeckDataを構築する"
given = "options.deckDataが未指定、options.dno='1'"
expect_side_effect = "axios.getが呼ばれ、その結果からparseDeckDetailで構築されたdeckDataが以降の処理に使われる"

[[condition]]
id = "download_deck_recipe_image.no_deckdata_no_dno_stays_undefined"
target_function = "downloadDeckRecipeImage"
source_lines = "27-28"
description = "deckData・dnoのいずれも無い場合、deckDataはundefinedのままcreateDeckRecipeImageに渡される（本関数自体はガードしない）"
given = "options.deckData・options.dnoともに未指定"
expect_side_effect = "createDeckRecipeImageがdeckData: undefinedで呼ばれる"

[[condition]]
id = "download_deck_recipe_image.embeds_png_metadata_when_deckdata_present"
target_function = "downloadDeckRecipeImage"
source_lines = "54-61"
description = "deckDataが存在する場合、embedDeckInfoToPNGで画像にデッキ情報を埋め込んだBlobに差し替える"
given = "deckDataが存在し、embedDeckInfoToPNGが成功する"
expect_side_effect = "downloadされるBlobはembedDeckInfoToPNGの戻り値になる"

[[condition]]
id = "download_deck_recipe_image.embed_failure_falls_back_to_original_blob"
target_function = "downloadDeckRecipeImage"
source_lines = "56-60"
description = "embedDeckInfoToPNGが失敗した場合、console.errorでログし元のBlob(createDeckRecipeImageの結果)をそのままダウンロードする"
given = "embedDeckInfoToPNGがrejectする"
expect_side_effect = "downloadされるBlobはcreateDeckRecipeImageの戻り値のまま（埋め込み前）になる"

[[condition]]
id = "download_deck_recipe_image.no_deckdata_skips_png_embedding"
target_function = "downloadDeckRecipeImage"
source_lines = "54"
description = "deckDataが無い場合、embedDeckInfoToPNG自体を呼ばない"
given = "deckData・dnoともに未指定（deckDataがundefinedのまま）"
expect_side_effect = "embedDeckInfoToPNGは呼ばれない"

[[condition]]
id = "download_deck_recipe_image.uses_provided_filename_or_generates"
target_function = "downloadDeckRecipeImage"
source_lines = "64"
