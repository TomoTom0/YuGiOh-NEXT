#
# 経緯:
# - TASK-566（TASK-331 Tier C第18号・TASK-564第17号の後続）。Practice系コンポーネント
#   11ファイルの条件化7ファイル目。316行（template＋script setup。propsなし、
#   practice storeの選択状態を購読しCardListへ表示、ドラッグ開始とカード移動を担う）。
#   既存の専用ユニットテストは無く、tests/unit/components/PracticeZoneInfoPanel.test.tsを新規作成
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm TASK-566
# - Practice機能はカテゴリ3（configs/features.toml [practice] default = "dev-only"）
#
# 粒度方針（Tier C・第8号〜第17号条件書と同一）:
# - 1条件=1振る舞いclass。ゾーン値・分岐の列挙はテスト側で持ち、条件書には親条件のみ置く
# - 観測対象は描画結果（ヘッダー・CardListへ渡されるprops）とemit・drag状態・
#   storeアクションの呼び出し引数。vm内部computedは直接参照しない
# - 子CardListはカスタムstubで置き換え、受け取ったpropsをdata属性へ描画しボタンで
#   親がlistenするイベントを発火する。子の内部挙動はCardList自身のテスト（tests/unit/components/CardList.test.ts）が保証（card-list条件書は未整備）
# - practice storeは実物を使い、moveCardはspyで呼び出し引数を観測する。
#   usePracticeDragStateは実物を使い、公開refでdrag状態を観測する
#
# 作業中に発見した不具合疑い（src不変のため別タスクへ分離）:
# - selectedPracticeCard / handleAction / getCardActions と emit('action') は、
#   templateに選択中カードのアクションUIが存在しないため到達不能なデッドパス
#   （.selected-card-actions等のSCSSのみ残存）。[[excluded]]に記録しTASK-565へ分離起票

