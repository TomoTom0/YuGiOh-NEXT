# 検証対象: src/utils/search-exclusion-engine.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)。docs/api/*.md 等の二次情報は参照していない。
#
# 発見したデッドコード/到達困難分岐:
# - inferExclusions L58-64: maxIterations(10)到達時のwarning追加分岐は、実装上の状態遷移が
#   required/enabled/selected/field.enabled の単調変化のみで、各適用関数が全ルールを同一iteration内で
#   走査するため、通常の有限ルールでは到達不能と判断した。検証可能な入力を作れなかったためconditions化しない。
# - src/data/search-exclusion-rules.json には attributeToField.trigger = "spell-type*" / "trap-type*" があるが、
#   applyAttributeToField は rule.trigger を完全一致で Map.get() するだけでワイルドカード展開しない。
#   これは実装挙動として condition に記録した。
# - applyAttributeToField L395-396: 無効属性にdisabledReasonが無い場合の
#   formatDisabledReason('attribute-unavailable', attr)フォールバックは、公開API経由では到達不能。
#   属性がenabled=falseになる実装パスはいずれもdisabledReasonを設定するためconditions化しない。

[meta]
feature = "search-exclusion-engine"
source_file = "src/utils/search-exclusion-engine.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/utils/search-exclusion-engine.test.ts tests/unit/search-exclusion-engine.test.ts"
source_hash = "0f5b7d8e1854664eb95c742651570caaf9300e68"
note = "verified=falseは0件。maxIterations warning分岐は到達不能と判断してconditions化せず、ヘッダーコメントに記録した"

