# 検証対象: src/utils/card-limit.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、utilsの残り（局所的なロジック）。
#
# 実装コメントとの差異:
# - かつてファイル冒頭のJSDocに「現時点では全カード3枚のダミー実装」とあったが（TASK-304で
#   当該コメントは削除済み）、getCardLimitの返り値は
#   枚数そのものではなく制限レベルコード（0=禁止/1=制限/2=準制限/3=無制限）であり、呼び出し側で
#   このコードを実際の許容枚数に変換している（本ファイル単体では枚数変換ロジックは持たない）。
# - card.limitRegulationの型はLimitRegulation = 'forbidden' | 'limited' | 'semi-limited'（コンパイル時は
#   この3値+undefinedのみ）だが、実データはHTMLパース等の外部ソース由来でこの型を必ずしも満たさない
#   ため、switchのdefault節（型システム上は到達不能に見える）は実行時には到達しうる有効な分岐として
#   条件化した（README 2節の「TypeScriptのnarrowingで到達不能なelse」には該当しない）。
#
# 対象外関数:
# - updateLimitRegulation(): 未実装のTODOスタブ（本体は空・呼び出し元ゼロ）のため条件化して
#   いなかったが、TASK-304で関数自体を削除済み（2026-11-21）。

[meta]
feature = "card-limit"
source_file = "src/utils/card-limit.ts"
verified = true
verified_at = "2026-11-21"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/card-limit.test.ts"
source_hash = "7a60938ba6d7f7fe49fd6b8065fe3f4174e51f0e"
note = "TASK-541で既存欠陥（id形式・coversタグ欠落、fail 10件）を是正し、verified=trueへ復帰（2026-11-21）"

# --- getCardLimit(card: CardInfo): number ---

[[condition]]
id = "card-limit.missing-limit-regulation-returns-unlimited"
target_function = "getCardLimit"
source_lines = "22-24"
description = "card.limitRegulationがfalsy（プロパティ省略またはundefined）の場合、switchを評価せず早期returnで3（無制限）を返す"
given = "card.limitRegulationが未設定、またはundefined"
expect_return = 3

[[condition]]
id = "card-limit.forbidden-returns-0"
target_function = "getCardLimit"
source_lines = "26-28"
description = "card.limitRegulationが'forbidden'の場合、switchのcase一致により0（禁止カード）を返す"
given = "card.limitRegulation = 'forbidden'"
expect_return = 0

[[condition]]
id = "card-limit.limited-returns-1"
target_function = "getCardLimit"
source_lines = "26,29-30"
description = "card.limitRegulationが'limited'の場合、switchのcase一致により1（制限カード）を返す"
given = "card.limitRegulation = 'limited'"
expect_return = 1

[[condition]]
id = "card-limit.semi-limited-returns-2"
target_function = "getCardLimit"
source_lines = "26,31-32"
description = "card.limitRegulationが'semi-limited'の場合、switchのcase一致により2（準制限カード）を返す"
given = "card.limitRegulation = 'semi-limited'"
expect_return = 2

[[condition]]
id = "card-limit.unknown-value-falls-to-default"
target_function = "getCardLimit"
source_lines = "26,33-34"
description = "card.limitRegulationがtruthyだが'forbidden'/'limited'/'semi-limited'のいずれにも一致しない場合、switchのdefault節に落ちて3（無制限）を返す。LimitRegulation型はコンパイル時この3値のみだが、実データが外部ソース由来のためこの分岐は実行時に到達しうる"
given = "card.limitRegulation = 'unknown'（型システム外の値、実データ相当）"
expect_return = 3
