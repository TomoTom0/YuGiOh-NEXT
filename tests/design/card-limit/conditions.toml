# 検証対象: src/utils/card-limit.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、utilsの残り（局所的なロジック）。
#
# 実装コメントとの差異:
# - ファイル冒頭のJSDocに「現時点では全カード3枚のダミー実装」とあるが、getCardLimitの返り値は
#   枚数そのものではなく制限レベルコード（0=禁止/1=制限/2=準制限/3=無制限）であり、呼び出し側で
#   このコードを実際の許容枚数に変換している（本ファイル単体では枚数変換ロジックは持たない）。
# - card.limitRegulationの型はLimitRegulation = 'forbidden' | 'limited' | 'semi-limited'（コンパイル時は
#   この3値+undefinedのみ）だが、実データはHTMLパース等の外部ソース由来でこの型を必ずしも満たさない
#   ため、switchのdefault節（型システム上は到達不能に見える）は実行時には到達しうる有効な分岐として
#   条件化した（README 2節の「TypeScriptのnarrowingで到達不能なelse」には該当しない）。
#
# 対象外関数:
# - updateLimitRegulation(): 分岐・throw・早期return・副作用の差異が一切ない未実装のTODOスタブ
#   （APIから最新レギュレーションを取得する処理は未実装で本体は空）。README 2節の「書かない」基準
#   （意味のある分岐が無い）に該当するため条件化していない。

[meta]
feature = "card-limit"
source_file = "src/utils/card-limit.ts"
verified = true
