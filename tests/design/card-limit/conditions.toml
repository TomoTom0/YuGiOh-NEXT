note = "verified=falseは0件"

# --- getCardLimit(card: CardInfo): number ---

[[condition]]
id = "get_card_limit.missing_limit_regulation_returns_unlimited"
target_function = "getCardLimit"
source_lines = "22-24"
description = "card.limitRegulationがfalsy（プロパティ省略またはundefined）の場合、switchを評価せず早期returnで3（無制限）を返す"
given = "card.limitRegulationが未設定、またはundefined"
expect_return = 3

[[condition]]
id = "get_card_limit.forbidden_returns_0"
target_function = "getCardLimit"
source_lines = "26-28"
description = "card.limitRegulationが'forbidden'の場合、switchのcase一致により0（禁止カード）を返す"
given = "card.limitRegulation = 'forbidden'"
expect_return = 0

[[condition]]
id = "get_card_limit.limited_returns_1"
target_function = "getCardLimit"
source_lines = "26,29-30"
description = "card.limitRegulationが'limited'の場合、switchのcase一致により1（制限カード）を返す"
given = "card.limitRegulation = 'limited'"
expect_return = 1

[[condition]]
id = "get_card_limit.semi_limited_returns_2"
target_function = "getCardLimit"
source_lines = "26,31-32"
description = "card.limitRegulationが'semi-limited'の場合、switchのcase一致により2（準制限カード）を返す"
given = "card.limitRegulation = 'semi-limited'"
expect_return = 2

[[condition]]
id = "get_card_limit.unknown_value_falls_to_default"
target_function = "getCardLimit"
source_lines = "26,33-34"
description = "card.limitRegulationがtruthyだが'forbidden'/'limited'/'semi-limited'のいずれにも一致しない場合、switchのdefault節に落ちて3（無制限）を返す。LimitRegulation型はコンパイル時この3値のみだが、実データが外部ソース由来のためこの分岐は実行時に到達しうる"
given = "card.limitRegulation = 'unknown'（型システム外の値、実データ相当）"
expect_return = 3
