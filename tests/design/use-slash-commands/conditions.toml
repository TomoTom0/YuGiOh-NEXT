# 検証対象: src/components/searchInputBar/composables/useSlashCommands.ts
#
# 検索バーのスラッシュコマンド（/attr, /level, /atk 等）の解析・バリデーション・
# 候補抽出を提供するVue composable。
# TASK-476: src/components/searchInputBar/__tests__/useSlashCommands.test.ts の
# tests/unit/composables/ 移動に伴うdesign整備として条件化。
#
# target_function の記述形式について（composable factory パターン）:
# `export function useSlashCommands()` が computed / 関数を返す構造のため、
# 条件が属する実体は return オブジェクトの各メンバ（use-card-detail-display の
# `#` 区切り形式に合わせ target_function = "useSlashCommands#<メンバ名>" と記載）。
#
# 粒度方針:
# - 既存テストの全 describe/it を走査し、各itが検証する分岐を条件化。
# - 既存itが存在しない実装分岐（未テストの filterType 等）は [[excluded]] に記録
#   （TASK-476 は移動伴いの design 整備であり、新規テスト追加はスコープ外）。

