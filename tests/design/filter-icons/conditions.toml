id = "convert_filters_to_icons.card_type_unmapped_fallback"
target_function = "convertFiltersToIcons"
source_lines = "27"
description = "CARD_TYPE_ID_TO_SHORTNAMEに存在しない値の場合、labelはfilters.cardTypeの生値にフォールバックする。CardType型はCARD_TYPE_ID_TO_SHORTNAMEの全キー(monster/spell/trap)を網羅しているため、正規に型付けされた値からは到達不能で、型システムを迂回した場合のみ到達する防御的分岐"
given = "cardType = 'unknown' as unknown as CardType"
expect_return_shape = "[{ type:'cardType', label:'unknown', value:'unknown' }]"

