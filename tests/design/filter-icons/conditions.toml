# 検証対象: src/utils/filter-icons.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、SearchFiltersをFilterIcon[]に変換する純粋関数。
#
# 実装コメントとの差異・付記事項:
# - L69-78/L109-118/L121-130 の levelValues/linkValues/scaleValues は
#   「filters.X.length > 0」の外側ガードに加え「if (xLabel)」という内側ガードが二重に存在するが、
#   formatNumberRange() は呼び出し元(本ファイル)が渡すprefix('★'/'L'/'PS')が常に非空literalであり、
#   かつ配列が非空である限り必ず非空文字列を返す実装になっているため、内側ガードのfalse分岐は
#   convertFiltersToIcons の公開APIからは到達不能（防御的な二重チェック）。
#   そのためfalse分岐は個別条件化せず、この注記のみに留めた。
# - CARD_TYPE_ID_TO_SHORTNAME / ATTRIBUTE_ID_TO_NAME / MONSTER_TYPE_ID_TO_SHORTNAME への
#   フォールバック（`|| filters.cardType` 等）は、対応する型(CardType/Attribute/MonsterType)が
#   マッピング定数のキーを完全に網羅している（src/types/card-maps.ts で実測確認済み）ため、
#   正規に型付けされた入力からは到達不能。ただしREADME 2節の「書く: デフォルト値のフォールバック」
#   に従い条件化し、テストでは `as unknown as <Type>` で型システムを迂回して到達を検証した
#   （このプロジェクトの既存テストでも同様のバイパスパターンが使われている: 例
#   tests/unit/card-search-cache.test.ts）。
# - tests/unit/utils/filter-icons.test.ts の既存テストは monsterTypes の state に
#   'include' という値を使っていたが、SearchFilters型上は state: 'normal' | 'not' のみが正。
#   'include' は 'not' と一致しないため isNot: false のテストとして偶然成立していたに過ぎず、
#   isNot: true になるケース（state === 'not'）はこれまで一件もテストされていなかった。
#   本タスクで 'normal'/'not' を使う形に修正し、isNot: true のテストを追加した。
# - spellTypes / trapTypes は変換ロジック自体は存在するが、既存テストに1件もカバーがなかった
#   （races/attributesは存在した）。本タスクで追加した。

[meta]
feature = "filter-icons"
source_file = "src/utils/filter-icons.ts"
verified = true
verified_at = "2026-08-28"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/filter-icons.test.ts"
source_hash = "536cfc0d76a95409078f341dd5226672c9614a0a"
note = "verified=falseは0件（すべて公開APIから到達・検証可能）"

# --- convertFiltersToIcons(filters: SearchFilters): FilterIcon[] ---

[[condition]]
id = "convert_filters_to_icons.all_empty_returns_empty_array"
target_function = "convertFiltersToIcons"
source_lines = "20-143"
description = "全フィールドが未設定(cardType=null)/空配列/atk・defともに条件なしの場合、iconsは1件もpushされず空配列を返す"
given = "cardType=null, 全配列フィールド=[], atk={exact:false,unknown:false}, def={exact:false,unknown:false}"
expect_return = "[]"

[[condition]]
id = "convert_filters_to_icons.card_type_present_pushes_mapped_icon"
target_function = "convertFiltersToIcons"
source_lines = "24-30"
description = "filters.cardTypeがnullでない場合、CARD_TYPE_ID_TO_SHORTNAMEでマップしたlabelでtype='cardType'のアイコンをpushする。valueはfilters.cardTypeの生値"
given = "cardType='monster'"
expect_return_shape = "[{ type:'cardType', label:'M', value:'monster' }] が結果配列の先頭に含まれる"

