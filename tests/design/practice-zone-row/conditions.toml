# 検証対象: src/components/practice/PracticeZoneRow.vue
#
# 経緯:
# - TASK-557（TASK-331 Tier C第12号・TASK-556第11号の後続）。Practice系コンポーネント
#   11ファイルの条件化1ファイル目。33行の最小構成（template 5行＋defineProps 3行＋
#   scoped SCSS）。既存の専用ユニットテストは無く、
#   tests/unit/components/PracticeZoneRow.test.tsを新規作成
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm TASK-557
# - Practice機能はカテゴリ3（configs/features.toml [practice] default = "dev-only"）で
#   build時に解決されるfeature flag配下にあるが、本コンポーネント自身はflagを参照しない
#   純粋な表示ラッパーのため、単体mountで検証する（provider不要）
#
# 粒度方針（Tier C・第8号〜第11号条件書と同一）:
# - 1条件=1振る舞いclass。row値1/2/3の列挙はテスト側fixture表（it.each）で持ち、
#   条件書には親条件のみ置く
# - 表示専用コンポーネントのため観測対象は描画結果（根源要素のclass構成・slot内容の
#   出力位置）のみ。vm内部状態は直接参照しない
# - defineProps定義・静的SCSSは§8「書かない」に該当するため除外
#
# 線引き（隣接条件書との）:
# - Practiceの状態・操作ロジック（ゾーン選択・カード移動等）はpractice store条件書
#   （tests/design/practice/）とuse-practice-actions等composable条件書が保証済み。
#   本書はPracticeZoneRow自身の描画契約のみ（Practice系コンポーネントでは初回）
# - 親PracticeField.vueとの統合は存在しない（下記不具合疑い参照）
#
# 作業中に発見した不具合疑い（src不変のため別タスクへ分離）:
# - PracticeZoneRow.vueはsrc内のどこからもimportされていない（import箇所0件。参照は
#   docs/design/solo-practice-tech.md L98の設計docのみ）。PracticeField.vueが同等の行構造
#   （.field-row.row-1/2/3）を自前のtemplateで描画しているため未使用コンポーネント
#   （デッドコード）として残存。併せてscoped SCSSの .row-1/.row-2 の grid-template-columns が
#   基底 .practice-zone-row の display:flex 下では効かない点も観察された。
#   [[excluded]]に記録しTASK-558へ分離起票（本書は単体mountで振る舞いを固定）

