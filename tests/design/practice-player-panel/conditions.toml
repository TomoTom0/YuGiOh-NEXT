# 検証対象: src/components/practice/PracticePlayerPanel.vue
#
# 経緯:
# - TASK-568（TASK-331 Tier C第19号・TASK-566第18号の後続）。Practice系コンポーネント
#   11ファイルの条件化8ファイル目。319行（template＋script setup。propsなし、
#   practice storeとdeck-edit storeの状態を表示し、emitとresetPractice呼び出しを行う）。
#   既存の専用ユニットテストは無く、tests/unit/components/PracticePlayerPanel.test.tsを新規作成
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm TASK-568
# - Practice機能はカテゴリ3（configs/features.toml [practice] default = "dev-only"）
#
# 粒度方針（Tier C・第8号〜第18号条件書と同一）:
# - 1条件=1振る舞いclass。P1/P2・初期化有無の列挙はテスト側で持ち、条件書には親条件のみ置く
# - 観測対象は描画結果（デッキ名・プレビュー画像・ボタンのdisabled）とemit・
#   storeアクションの呼び出し引数。vm内部computedは直接参照しない
# - practice/deck-editの両storeは実物を使い、resetPracticeはspyで呼び出し引数を
#   観測する（store本体の挙動は各storeの条件書が保証）
#
# TASK-550との線引き:
# - load-deck-p2 は本コンポーネントのemit契約に含まれない。DeckEditLayout側の
#   loadDeckForField2の実UI経路の有無はTASK-550（判断待ち）の論点であり、
#   本書はその判断に触れない（excluded参照）
#
# 作業中に発見した非対称（src不変のため別タスクへ分離）:
# - P1のHard Resetは emit('hard-reset') だが、P2（initialized2時）のHard Resetは
#   practiceStore.resetPractice(1) の直呼びでP2のResetボタンと同一動作。
#   意図か否かはTASK-567へ分離起票し、本書は実挙動を条件化する

