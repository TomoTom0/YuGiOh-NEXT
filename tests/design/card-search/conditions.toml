# 検証対象: src/api/card-search.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、API系かつ外部fetch/HTMLパース/キャッシュ永続化を含む処理。
#
# export関数一覧（AST抽出結果、2026-08-06確認）:
# - parseLinkValue
# - buildSearchParams
# - searchCards
# - searchCardsAuto
# - searchCardById
# - searchCardsByPackId
# - extractImageInfo
# - parseSearchResults
# - parseCardBase
# - parseMonsterCard
# - parseSpellCard
# - parseTrapCard
# - parseSearchResultRow
# - fetchAdditionalPages
# - getCardDetail
# - getCardDetailWithCache
# - saveCardDetailToCache
#
# 発見したデッドコード・到達不能分岐:
# - parseSearchResultRow L1065-1067: detectCardTypeの戻り値型はCardType|nullであり、nullはL1052で
#   早期return済み。CardTypeはmonster/spell/trapのユニオンなのでswitch defaultは通常の型付き呼び出しでは到達不能。
# - extractImageInfo L553: 正規表現の第1キャプチャは(\d+)で必須のため、マッチ成立時にcidがfalsyになる分岐は到達不能。
#
# 既存テストの説明文・アサーションの不正確さ:
# - tests/unit/api/card-search-comprehensive.test.ts の検索結果HTML fixtureは旧構造(table.result_list)で、
#   実装が読む #main980 > #article_body > #card_list > .t_row を通らないため、配列型だけを見る
#   推測的テストになっていた。今回、実装構造に合わせたfixtureで確定的なアサーションを追加した。
# - tests/unit/api/card-search-comprehensive.test.ts の getCardDetailWithCache「キャッシュがある場合」は
#   CardDetail型ではないオブジェクトをsetCardInfoへ渡しており、TableC復元条件を満たさない。
#   今回、APIフォールバックを確認する内容に修正した。
#
# 条件化を見送った分岐:
# - ログ出力のみで返り値・副作用が変わらないconsole.error/console.warn自体は条件化せず、
#   その後のreturn/skip/フォールバック挙動として記載した。

[meta]
feature = "card-search"
source_file = "src/api/card-search.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/api/card-search-basic.test.ts tests/unit/api/card-search-comprehensive.test.ts tests/unit/api/card-search-promise.test.ts tests/unit/card-search-cache.test.ts"
source_hash = "3ecea0b9c330eb90e40f38f0bbf350706e362451"
note = "verified=falseは9件: search_auto.name_100_fetch_more、extract_image.cid_missing_continue、parse_related.card_list_preferred_then_detail_list、get_detail.related_limit_regulation_fill、get_detail.related_100_fetch_more、get_detail.search_promise_error_partial、get_detail.search_promise_full_card_overrides、get_detail.faq_parse_failure_returns_null、get_cache.stale_refresh_error_returns_null。fetchMore系は2000件規模fixtureやprivate helper制御の費用が高く、エラー系は同一モジュール内の非export/直接参照を差し替えられず公開API経由で安定再現できないため。extract_image.cid_missing_continueは正規表現上到達不能。parse_related/get_detail.related_limitは詳細ページfixture上の関連カード.t_rowが既存パーサー構造と合わず、追加調査の費用対効果を優先して未検証。"

