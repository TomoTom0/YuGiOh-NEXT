# 検証対象: src/stores/search.ts (useSearchStore)
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# Tier A本展開対象（store系）。
#
# このファイルはPiniaの`defineStore(id, () => { ... return {...} })`パターン（Setup Store）で
# 実装されている。returnオブジェクトで公開されるローカル関数は
# "useSearchStore#アクション名"として記載する。
#
# searchQuery/searchResults/allResults/currentPage/hasMore/isLoading/searchFilters/isGlobalSearchModeは
# refをそのまま公開している状態であり、分岐・throw・独自ロジックを持たないため条件化しない。
# exclusionResultはcomputed getterで、公開アクションではなく意味のある分岐も持たないため条件化しない。

[meta]
feature = "search-store"
source_file = "src/stores/search.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/stores/search.test.ts"
source_hash = "6515076d335c35c429af657948d3c4c7a9d27c1c"
note = "公開アクションはclearAllFiltersのみ。分岐・throwは存在しないため、無条件の状態置換を1条件として記載した。verified=falseは0件。"

# --- clearAllFilters(): void ---

[[condition]]
id = "clear_all_filters.resets_search_filters_to_default_values"
target_function = "useSearchStore#clearAllFilters"
source_lines = "56-75"
description = "clearAllFiltersは現在のsearchFilters.valueの内容に関係なく、実装内に書かれた既定値オブジェクトでsearchFilters.value全体を置き換える"
given = "searchFilters.valueにcardType/attributes/spellTypes/trapTypes/races/monsterTypes/level/link/scale/atk/def/releaseDate等の値が設定された状態でclearAllFilters()を呼ぶ"
expect_side_effect = "searchFilters.value === { cardType: null, attributes: [], spellTypes: [], trapTypes: [], races: [], monsterTypes: [], monsterTypeMatchMode: 'or', levelType: 'level', levelValues: [], linkValues: [], scaleValues: [], linkMarkers: [], linkMarkerMatchMode: 'or', atk: { exact: false, unknown: false }, def: { exact: false, unknown: false }, releaseDate: {} }"
