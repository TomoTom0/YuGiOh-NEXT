# 検証対象: src/utils/mapping-manager.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)。docs/api/*.md等の二次情報は参照しない。
#
# 実装コメントと挙動のズレ:
# - getRaceIdToText/getMonsterTypeIdToText/getAttributeIdToText/getSpellEffectIdToText/getTrapEffectIdToText
#   のコメントは「jaは常に日本語静的マッピング」と読めるが、実装は先にdynamicMappingsを確認する。
#   そのためjaでも該当カテゴリの動的マッピングが非空なら動的マッピングを返し、静的マッピングにはフォールバックしない。
# - getTrapEffectTextToIdはコメントどおりja特別扱いがなく、動的マッピングがない全言語で日本語静的マッピングの逆引きを返す。

[meta]
feature = "mapping-manager"
source_file = "src/utils/mapping-manager.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/utils/mapping-manager-comprehensive.test.ts tests/unit/utils/mapping-manager.test.ts tests/unit/utils/mapping-manager-reversal.test.ts"
source_hash = "7a071d956cd047f26a9411c271ba8cc76b4e26a3"
note = "verified=falseは2件: initializeのinner/outer catchは実装内の通常経路ではfetch/loadが例外を外へ投げないため、private methodの差し替えなしには到達しない防御的catch"

