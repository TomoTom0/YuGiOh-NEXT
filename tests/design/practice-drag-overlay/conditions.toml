# 検証対象: src/components/practice/PracticeDragOverlay.vue
#
# 経緯:
# - TASK-559（TASK-331 Tier C第13号・TASK-557第12号の後続）。Practice系コンポーネント
#   11ファイルの条件化2ファイル目。102行（template＋script setup。props/emitsなし、
#   共有drag状態 usePracticeDragState の購読と overlayStyle computed のみ）。
#   既存の専用ユニットテストは無く、tests/unit/components/PracticeDragOverlay.test.tsを新規作成
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm TASK-559
# - Practice機能はカテゴリ3（configs/features.toml [practice] default = "dev-only"）。
#   本コンポーネントはTeleportでbodyへ描画するドラッグ中オーバーレイ
#
# 粒度方針（Tier C・第8号〜第12号条件書と同一）:
# - 1条件=1振る舞いclass。状態値の列挙（stackTop null/true/false等）はテスト側で持ち、
#   条件書には親条件のみ置く
# - 観測対象は描画結果（Teleport先のDOM・img src・style属性）のみ。vm内部状態は直接参照しない
# - 静的スタイル定数・scoped SCSSは§8「書かない」に該当するため除外
#
# 線引き（隣接条件書との）:
# - drag状態そのものの遷移（startDrag/endDrag・リスナ登録・自動スクロール等）は
#   use-practice-drag-state条件書（usePracticeDragState）が保証済み。本書はその状態を
#   購読して描画する本コンポーネント自身の契約のみ。状態の駆動はcomposableの公開refへの
#   代入で行い、composableはモックしない
# - 裏面画像URLは chrome.runtime.getURL('images/card_back.png')。テスト環境では
#   tests/setup.ts のスタブがパスをそのまま返すため 'images/card_back.png' が期待値になる

