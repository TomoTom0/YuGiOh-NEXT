# 検証対象: src/stores/deck-edit.ts (useDeckEditStore)
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、store系最大のPinia Setup Store。
#
# このファイルはPiniaの`defineStore(id, () => { ... return {...} })`パターンで実装されている。
# `scripts/design/extract-ast-skeleton.ts`はreturnオブジェクトで公開されるローカル関数を
# "useDeckEditStore#アクション名"として検出するため、target_functionはこの形式で統一する。
#
# 粒度方針:
# - 全公開アクションを最低1条件で記録する（単純setter/getterもユーザー指定に合わせて含める）。
# - 主要分岐は、データ変更・undo/redo・キャッシュ連携・エラーハンドリングを優先して条件化する。
# - 下位composableに委譲された詳細アルゴリズムは、このストアで観測できる呼び出し条件・副作用に限定する。

