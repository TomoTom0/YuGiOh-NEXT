id = "auto_rename_deck.truncates_generated_name_to_max_length"
target_function = "useDeckEditStore#autoRenameDeck"
source_lines = "246-250"
description = "prefix込みの生成後デッキ名がDECK_FIELD_LIMITS.DECK_NAME_MAX(50文字)を超える場合、setDeckNameに渡す前に50文字で機械的に切り詰める"
given = "カテゴリラベルを連結すると50文字を超えるcategoryLabelMap（例: 30文字ラベル×2件）を持つデッキでautoRenameDeck()を呼ぶ"
expect_side_effect = "deckInfo.name.length <= 50"
