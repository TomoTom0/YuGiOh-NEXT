# 検証対象: src/components/DeckMetadataHeader.vue
#
# 経緯:
# - TASK-544（TASK-331 Tier C第8号・TASK-532第7号の後続）。DeckMetadata系2/4ファイル目の
#   Header（806行）。既存tests/unit/components/DeckMetadataHeader.test.ts（4it・
#   auto-rename/auto-categoryのstore呼び出しとメニュー閉鎖のみ）を全面再設計
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm TASK-544
#
# 粒度方針（第7号・filter-tab条件書と同一）:
# - 1条件=1振る舞いclass。同種入力の列挙（deckStyle 4値・deckType 5値など）は
#   テスト側fixture表（it.each）で持ち、条件書には親条件のみ置く
# - UI操作はDOMイベント経由で検証し、vm内部状態は直接参照しない。storeの公開状態
#   （deckInfo）とemitは観測対象とする
# - props/emits定義・静的SVG/SCSSは§8「書かない」に該当するため除外
#
# 線引き（隣接条件書との）:
# - 親DeckMetadataの配線契約（props初期値・select-deck-typeの型ガード検証・
#   ダイアログ表示状態・store書き込み）はdeck-metadata条件書（TASK-532）が保証。
#   本書はHeader自身の内部挙動（computed/lifecycle/外クリック/dropdown/メニュー/
#   デッキコード/auto系）のみ
# - 呼び出すstoreメソッド（issueDeckCode/autoRenameDeck/autoSetCategory）の本体は
#   deck-edit store側の責務。本書は呼び出し契約（引数・件数・成功/失敗の分岐）と
#   Header側の状態遷移のみ観測する
# - error-handler（handleSuccess/handleError）のトースト本体はerror-handler条件書の
#   対象。本書はmodule mockで呼び出し引数（context/メッセージ/options）を観測する
# - type-guards（isDeckTypeValue/isDeckStyleValue）の関数本体はtype-guards条件書の対象
#
# deckType '-1' 非対称の調査結論（第7号からの引継ぎ・tm TASK-544 bodyに詳細）:
# 結論: 意図的設計ではなく**不具合疑い**。src修正は範囲外のためTASK-545へ分離起票。
# 根拠:
# 1. 型定義: Header props（L187）は deckType: '-1'|'0'|'1'|'2'|'3' で'-1'を正当な
#    初期値として受け、親もDEFAULT_DECK_TYPE='-1'を未設定フォールバックに使用。
#    src/types/deck-metadata.tsのDeckTypeValueもstringを含むため'-1'は型上許容
# 2. 選択肢の構築: L45-47に @click="selectDeckType('-1')" の「未設定」optionが存在し、
#    Header自身は'-1'をフィルタせずemitする（Header単体は対称。条件6で検証）
# 3. 非対称の所在: 親DeckMetadata.selectDeckTypeがisDeckTypeValue（'0'〜'3'のみ）で
#    検証し'-1'をconsole.errorで拒否するため、UI上の「未設定」が機能しない
# 4. 対照: 兄弟のisDeckStyleValueは'-1'を含み、DeckStyleValueは'-1'を「未選択」と定義。
#    デッキタイプだけ'-1'を除外する理由はコード上見当たらない
# 5. 履歴: 「未設定」optionは422b819（PR #34）追加時は無検証代入で動作していたが、
#    bacb696（PR #67 / 2025-12-12）で型ガード検証へ置換された際に'-1'が除外され回帰
#
# 【TASK-545 対応済み 2026-11-21】上記'-1'非対称は親DeckMetadata.selectDeckType /
# isDeckTypeValue / DeckTypeValue を修正して解消。Header側の挙動（条件6）は不変
#
# 作業中に発見した追加不具合: adjustAlignRightは呼び出し時にv-if配下のdropdown refが
# まだnullのため早期returnし、align-rightが一切適用されない（probeで確認）。
# src不変契約のため修正せずTASK-546へ分離起票・本条件書のexcludedに記録

