# --- promiseAllConcurrent(tasks, concurrency=2): Promise<(T|undefined)[]> （非export） ---

[[condition]]
id = "concurrent.task_error_caught_sets_undefined"
target_function = "promiseAllConcurrent"
source_lines = "220-229"
description = "個々のtaskがthrow/rejectした場合、`console.warn('[promiseAllConcurrent] Task at index ${taskIndex} failed:', error)`でログを出し、該当indexのresultはundefinedとしてキャッチされる。例外は外(generateDeckThumbnailImageの外側try/catch)に伝播せず、他タスクの処理は継続する"
given = "generateDeckThumbnailImage経由。2枚のカードのうち1枚(m001)でgetCardInfoが同期的にthrowするようモックする(loadAndDrawCardImage自身の内部try/catchでは吸収されない、task関数自体のthrow)"
expect_no_throw = true
expect_return_shape = "console.warnが'[promiseAllConcurrent] Task at index...'を含むメッセージで呼ばれ、他方のカード(m002)は正常にctx.drawImageされ、generateDeckThumbnailImage全体は最終的にdata URLを返す(該当indexのresultがundefinedになった影響はblob生成に及ばない)"

[[condition]]
id = "concurrent.results_index_matches_task_index_regardless_of_completion_order"
target_function = "promiseAllConcurrent"
source_lines = "217,224,232-235"
description = "`results[taskIndex] = await task()`により、taskの完了順ではなく元のtaskIndexに対応する位置に結果が格納される。generateDeckThumbnailImage自身はresultsを使わない(promise_all_concurrent_result_discarded)ため、results配列そのものは公開APIから直接観測できない。そのため、各タスク内のclosureで固定されたindexがdrawImageの描画x座標(index*(cardWidth+gap)+padding)に反映される性質を代理指標として、完了順がindex通りでなくてもtaskとindexの対応が崩れないことを検証する"
given = "3枚のカード(index 0,1,2)のimg.decode()を手動制御し、index=1(2番目に開始されたタスク)を最初にresolve、続いてindex=0、最後にindex=2をresolveする"
expect_return_shape = "resolveの順序に関わらず、各カードのdrawImage呼び出しのx座標はそのカード自身のindexから計算された値(padding+index*(cardWidth+gap))と一致する"

[[condition]]
id = "concurrent.concurrency_limits_simultaneous_execution"
target_function = "promiseAllConcurrent"
source_lines = "231-240"
description = "concurrency個のworkerが並行してexecuteNextTasksを実行し、各workerは1つのtaskが完了してから次のindexを取り出すため、同時に実行中のtask数はconcurrencyを超えない"
given = "concurrency=2、tasks=5件、各taskの完了タイミングを手動で制御できるようにする"
expect_return_shape = "任意の時点で同時実行中のtask数が2を超えない"

