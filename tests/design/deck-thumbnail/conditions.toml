# 発見したデッドコード（実装は存在するが現在の唯一の呼び出し経路からは到達不可能。
# conditions化せず、ここに記録するに留める）:
# - promiseAllConcurrent L215: concurrency引数のデフォルト値(2)は、唯一の呼び出し元
#   generateDeckThumbnailImage L308が`promiseAllConcurrent(loadTasks, 2)`と常に明示的に
#   2を渡すため、デフォルト値分岐は現状到達不能（コード上は同じ値だが、defaultパラメータ
