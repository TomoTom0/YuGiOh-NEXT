# 検証対象: src/utils/deck-metadata-loader.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)、chrome.storage/fetchを伴うメタデータローダー。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - tests/unit/utils/deck-metadata-loader.test.ts は静的import後に `vi.stubGlobal('__deck_metadata_cache__', null)`
#   を実行していたが、実装のモジュール内変数 `cachedMetadata` には影響しないため、テスト間で
#   キャッシュが残る順序依存があった。
# - deckTypes/deckStylesについて `Array.isArray(...) || typeof ... === 'object'` のように実装型より
#   曖昧なアサーションがあった。

[meta]
feature = "deck-metadata-loader"
source_file = "src/utils/deck-metadata-loader.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/utils/deck-metadata-loader.test.ts"
source_hash = "e562c4caf289c5e3737f88240e100cba25cff902"
note = "verified=falseは0件"

# --- getStoredMetadata(): Promise<DeckMetadata | null> ---

[[condition]]
id = "stored_metadata.chrome_unavailable_null"
target_function = "getStoredMetadata"
source_lines = "40-42"
description = "chromeがundefined、またはchrome.storageがfalsyの場合、chrome.storage.local.getを呼ばずnullを返す"
given = "global.chromeが存在しない"
expect_no_throw = true
expect_return = "null（getDeckMetadataは初期JSONへフォールバックする）"

[[condition]]
id = "stored_metadata.storage_value_returns"
target_function = "getStoredMetadata"
source_lines = "44-46"
description = "chrome.storage.local.get(STORAGE_KEY)の結果にdeck_metadataのtruthyな値がある場合、その値をDeckMetadataとして返す"
given = "chrome.storage.local.get('deck_metadata')が { deck_metadata: metadata } を返す"
expect_return_shape = "metadataそのもの（getDeckMetadataはその値を返し、キャッシュする）"

[[condition]]
id = "stored_metadata.storage_missing_null"
target_function = "getStoredMetadata"
source_lines = "44-46"
description = "chrome.storage.local.get(STORAGE_KEY)の結果にdeck_metadataが無い、またはfalsyな場合はnullを返す"
given = "chrome.storage.local.get('deck_metadata')が {} を返す"
expect_return = "null（getDeckMetadataは初期JSONへフォールバックする）"

[[condition]]
id = "stored_metadata.get_error_null"
target_function = "getStoredMetadata"
source_lines = "44-50"
description = "chrome.storage.local.getで例外またはrejectが発生した場合、例外を投げずnullを返す"
given = "chrome.storage.local.getがError('load failed')でrejectする"
expect_no_throw = true
expect_return = "null（getDeckMetadataは初期JSONへフォールバックする）"

