# 検証対象: src/background/main.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# Chrome拡張のbackground service workerであり、export関数は存在しないため、
# chrome.runtime/chrome.alarms/chrome.contextMenus のトップレベルlistenerと非export helperを条件化する。
#
# 実装との相違・注意:
# - 依頼文および既存テストには `GENESYS_FETCH_TEXT` という記載があったが、
#   src/background/main.ts の onMessage が処理するメッセージ種別は `GENESYS_FETCH`。
# - 依頼文には `GENESYS_ALLOWED_ORIGIN` によるオリジン制限という記載があったが、
#   src/background/main.ts に sender/origin を検査する分岐は無い。実装上の制限は
#   `url.startsWith('https://www.yugioh-card.com/japan/howto/genesys')` のURL prefix判定のみ。
#
# 発見したデッドコード/到達困難分岐:
# - onMessageのPRELOAD_DECK_DETAIL/PRELOAD_DECK_LIST分岐にある `.catch(err => sendResponse(...))` は、
#   呼び出し先preloadDeckDetail/preloadDeckListが内部try-catchで例外を握ってvoid解決するため、
#   通常の依存エラーでは到達しない。sendResponse自体がthrowする等の人工的状況を除き検証対象外。

[meta]
feature = "background-main"
source_file = "src/background/main.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/background.test.ts"
source_hash = "80b634678fd54938a5032aa3f6158ae02a0dbd39"
note = "verified=falseは0件。export関数は存在しないためAST未カバー検出は0件想定。onMessageのpreload系catchは到達困難としてconditions化せずコメントに記録"

