# 検証対象: src/utils/url-state.ts (URLStateManager)
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# Phase1.6(TASK-326)のTier A試行対象ファイルの1つ（utils中核・クラスstaticメソッド）。
# target_functionは "URLStateManager.メソッド名" 形式（extract-ast-skeleton.tsの検出名と一致させる）。

[meta]
feature = "url-state"
source_file = "src/utils/url-state.ts"
verified = true
verified_at = "2026-08-05"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/url-state.test.ts"
source_hash = "fe4314db721b5eaa101906d0e9cabfc07579a8ca"

# --- URLStateManager.getParams(): URLSearchParams ---

[[condition]]
id = "get_params.no_query_in_hash"
target_function = "URLStateManager.getParams"
source_lines = "18-21"
description = "location.hashに'?'が含まれない場合、空のURLSearchParamsを返す"
given = "location.hash = \"#/ytomo/edit\""
expect_return_shape = "空のURLSearchParams（Array.from(...).length === 0）"

[[condition]]
id = "get_params.query_in_hash"
target_function = "URLStateManager.getParams"
source_lines = "22-23"
description = "location.hashに'?'が含まれる場合、'?'以降をURLSearchParamsとしてパースする"
given = "location.hash = \"#/ytomo/edit?dno=5&mode=list\""
expect_return_shape = "params.get('dno') === '5', params.get('mode') === 'list'"

# --- URLStateManager.setParams(params): void ---

[[condition]]
id = "set_params.null_or_undefined_deletes_key"
target_function = "URLStateManager.setParams"
source_lines = "34-35"
description = "値がnullまたはundefinedのキーは既存のURLパラメータから削除される"
given = "既存hash = \"#/x?dno=5\", setParams({ dno: null })"
expect_side_effect = "更新後のhashに'dno'パラメータが含まれない"

[[condition]]
id = "set_params.value_stringified"
target_function = "URLStateManager.setParams"
source_lines = "36-38"
description = "値がnull/undefined以外の場合、String(value)としてセットされる（number/booleanも文字列化）"
given = "setParams({ detail: true })"
expect_side_effect = "更新後のhashに'detail=true'が含まれる"

[[condition]]
id = "set_params.empty_result_no_trailing_question_mark"
target_function = "URLStateManager.setParams"
source_lines = "44-46"
description = "更新後のパラメータが空になった場合、'?'を付けずhashBaseのみにする"
given = "既存hash = \"#/x?dno=5\", setParams({ dno: null }) で全パラメータが消える"
expect_side_effect = "更新後のhash === \"#/x\"（末尾に'?'が残らない）"

# --- URLStateManager.syncUIStateToURL(state): void ---

[[condition]]
id = "sync_ui.falsy_fields_omitted"
target_function = "URLStateManager.syncUIStateToURL"
source_lines = "57-60"
description = "viewMode/sortOrder/activeTab/cardTabはtruthyな場合のみparamsに含まれる。未指定の場合そのキーはsetParamsに渡らないため既存URL値は変更されない"
given = "state = { viewMode: 'list' } （sortOrder等は未指定）、既存hash に mode 以外のキーは無し"
expect_side_effect = "更新後のhashに mode=list のみ追加される（sort/tab/ctabキーは追加されない）"

[[condition]]
id = "sync_ui.show_detail_false_still_set"
target_function = "URLStateManager.syncUIStateToURL"
source_lines = "61"
description = "showDetailはtruthy判定ではなく`!== undefined`判定のため、false値でも明示的に'0'としてセットされる"
given = "state = { showDetail: false }"
expect_side_effect = "更新後のhashに detail=0 が含まれる（キー自体が省略されない）"
note = "他の4フィールドとチェック方法が異なる非対称な実装。falsyな値を持つboolean専用の配慮"

