# --- setupVueApp() ---

[[condition]]
id = "setup_vue_app.no_main980_returns_early"
target_function = "setupVueApp"
source_lines = "14-17"
description = "#main980が見つからない場合、何もせずreturnする"
given = "#main980がDOMに存在しない"
expect_no_throw = true

[[condition]]
id = "setup_vue_app.already_mounted_returns_early"
target_function = "setupVueApp"
source_lines = "20-22"
description = "main980内に既に#ygo-next-card-detail-containerが存在する場合、二重マウントを避けてreturnする"
given = "#main980配下に#ygo-next-card-detail-containerが既に存在する"
expect_no_throw = true

[[condition]]
id = "setup_vue_app.success_sets_theme_and_mounts"
target_function = "setupVueApp"
source_lines = "24-49"
description = "正常時、settings storeのeffectiveThemeに応じてdocument.documentElementのdata-ygo-next-theme属性とappContainerの背景色(dark:#1a1a1a / light以外:#ffffff)を設定し、#main980配下にappContainerをマウントした上でinitCardDetailUIを呼ぶ"
given = "#main980が存在しCard Detail未マウント、settingsStore.effectiveTheme='dark'"
expect_side_effect = "document.documentElementのdata-ygo-next-themeが'dark'、appContainerのbackgroundColorが#1a1a1aになる"

# --- cleanupCardImageHoverUI() [named export] ---

[[condition]]
id = "cleanup_hover_ui.removes_listener_when_present"
target_function = "cleanupCardImageHoverUI"
source_lines = "68-73"
description = "#deck_imageが存在しモジュール内のcardImageClickHandlerが設定済みの場合、そのハンドラをremoveEventListenerし、data-ygo-next-event-delegated属性を削除し、参照をnullにリセットする"
given = "setupCardImageHoverUIでイベント委譲済みの状態でcleanupCardImageHoverUI()を呼ぶ"
expect_side_effect = "#deck_imageのdata-ygo-next-event-delegated属性が削除される"

[[condition]]
id = "cleanup_hover_ui.no_deck_image_or_handler_skips"
target_function = "cleanupCardImageHoverUI"
source_lines = "68-73"
description = "#deck_imageが存在しない、またはcardImageClickHandlerが未設定(null)の場合、リスナー削除処理をスキップする（エラーにはならない）"
given = "setupCardImageHoverUIが未実行の状態でcleanupCardImageHoverUI()を呼ぶ"
expect_no_throw = true

[[condition]]
id = "cleanup_hover_ui.removes_controls_from_marked_links_only"
