# 出典について（test-structure skill §1 の fallback）: このlibに対する要件文書・設計文書は
# 存在しないため、TASK-466 の goal/body と実装（lib関数のコメント含む）を出典として条件を
# 起こしている。要件側に出典を移せる文書が整備された場合は source を差し替えること。
