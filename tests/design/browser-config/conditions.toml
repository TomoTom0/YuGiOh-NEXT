#
# TASK-466: start-chrome.sh の環境依存破綻修正（tomlq無しのconfig読み取り、binary・
# 拡張機能パスのconfig化、空値/依存欠落時の即エラー停止、起動成否ポーリング）で
# 新設された共通ライブラリ。
