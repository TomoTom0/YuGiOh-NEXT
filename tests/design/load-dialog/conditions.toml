# 検証対象: src/components/LoadDialog.vue（クローズ経路の一部は src/components/BaseDialog.vue）
#
# デッキ編集画面で既存デッキを選択・ロードするダイアログ。デッキリストのページング表示・
# サムネイル表示・デッキロード実行・現在ページのサムネイル強制再生成を担う。
# TASK-479: src/components/__tests__/LoadDialog.test.ts（30 it有効 + skip 2）と
# tests/unit/components/LoadDialog.test.ts（13 it）の統合に伴うdesign整備として条件化。
#
# 粒度方針（Tier C）:
# - Vueコンポーネントのため script setup 相当のロジック分岐（表示条件・ページング状態遷移・
#   classバインディング・ロード時の副作用）を主対象とし、template表示結果は簡潔に。
#
# store側（deck-edit条件書）との線引き:
# - openLoadDialog（ダイアログを開く前にthumbnail/infoキャッシュを再読込してshowLoadDialog=true）
#   はstore側で条件化済みのため本書には含めない。本書は「このコンポーネントで観測できる
#   呼び出し条件・副作用」（loadDeckがshowLoadDialogをfalseにする・generateThumbnailsInBackground
#   の呼び出し条件・各種表示条件）のみを記載する。
#
# 探索中の発見事項:
# - .thumbnail-gradient はSCSS（LoadDialog.vue L432-L442）に定義があるがtemplateに要素が存在
#   しない（デッドCSS）。旧src側テストの当該null assertは恒真のため統合テストから削除した。
#   CSS側削除はテスト統合タスクのスコープ外。

