# --- setCardImageSize(size) ---

[[condition]]
id = "set-card-image-size.normal-removes-css-variable"
target_function = "setCardImageSize"
source_lines = "tests/unit/content/deck-display-layout.test.ts:17"
description = "size==='normal'の場合、--deck-display-card-width CSS変数を削除して公式サイトのデフォルトサイズに戻す（sizeMapは参照しない）"
given = "setCardImageSize('normal')"
expect_return_shape = "document.documentElement.styleに--deck-display-card-widthが存在しなくなる"

[[condition]]
id = "set-card-image-size.known-size-sets-mapped-width"
target_function = "setCardImageSize"
source_lines = "tests/unit/content/deck-display-layout.test.ts:30"
description = "size='small'|'medium'|'large'|'xlarge'の場合、対応するpx値を--deck-display-card-width CSS変数に設定する"
given = "setCardImageSize('large')"
expect_return_shape = "--deck-display-card-widthが'90px'になる"

[[condition]]
id = "set-card-image-size.unknown-size-falls-back-to-60px"
target_function = "setCardImageSize"
source_lines = "tests/unit/content/deck-display-layout.test.ts:36"
description = "sizeMapに無い値が渡された場合、フォールバック値'60px'を設定する（型上は発生しないが実行時防御）"
given = "setCardImageSize('unknown' as never)"
expect_return_shape = "--deck-display-card-widthが'60px'になる"

# --- applyDeckDisplayLayout() ---

[[condition]]
id = "apply-deck-display-layout.injects-style-element"
target_function = "applyDeckDisplayLayout"
source_lines = "tests/unit/content/deck-display-layout.test.ts:44"
description = "分岐を持たない。呼び出すとdocument.headにstyle要素を1つ追加するのみ"
given = "applyDeckDisplayLayout()を呼ぶ"
expect_return_shape = "document.head内のstyle要素数が1増える"
