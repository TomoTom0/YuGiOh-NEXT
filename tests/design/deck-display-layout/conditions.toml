# --- setCardImageSize(size) ---

[[condition]]
id = "set_card_image_size.normal_removes_css_variable"
target_function = "setCardImageSize"
source_lines = "12-15"
description = "size==='normal'の場合、--deck-display-card-width CSS変数を削除して公式サイトのデフォルトサイズに戻す（sizeMapは参照しない）"
given = "setCardImageSize('normal')"
expect_side_effect = "document.documentElement.styleに--deck-display-card-widthが存在しなくなる"

[[condition]]
id = "set_card_image_size.known_size_sets_mapped_width"
target_function = "setCardImageSize"
source_lines = "17-27"
description = "size='small'|'medium'|'large'|'xlarge'の場合、対応するpx値を--deck-display-card-width CSS変数に設定する"
given = "setCardImageSize('large')"
expect_side_effect = "--deck-display-card-widthが'90px'になる"

[[condition]]
id = "set_card_image_size.unknown_size_falls_back_to_60px"
target_function = "setCardImageSize"
source_lines = "26"
description = "sizeMapに無い値が渡された場合、フォールバック値'60px'を設定する（型上は発生しないが実行時防御）"
given = "setCardImageSize('unknown' as never)"
expect_side_effect = "--deck-display-card-widthが'60px'になる"

# --- applyDeckDisplayLayout() ---

[[condition]]
id = "apply_deck_display_layout.injects_style_element"
target_function = "applyDeckDisplayLayout"
source_lines = "33-98"
description = "分岐を持たない。呼び出すとdocument.headにstyle要素を1つ追加するのみ"
given = "applyDeckDisplayLayout()を呼ぶ"
expect_side_effect = "document.head内のstyle要素数が1増える"
