# --- canUseToast(): boolean (非export、handle*関数内部から呼ばれるガード) ---

[[condition]]
id = "can_use_toast.returns_true_when_function"
target_function = "canUseToast"
source_lines = "236-240"
description = "useToastStoreがfunction型として解決できる場合(通常の静的import経路)、typeof判定によりtrueを返し、呼び出し元でトースト通知が実行される。各handle*.toast_shown_default系の条件で間接的に検証される"
given = "通常のモック環境(useToastStoreがvi.fn())でhandleError等を呼ぶ"
expect_return = true
verified = true

[[condition]]
id = "can_use_toast.returns_false_when_not_function"
target_function = "canUseToast"
source_lines = "236-240"
description = "typeof useToastStore !== 'function'の場合(理論上はuseToastStoreがimport解決できない/undefinedの場合)falseを返し、showToast=trueでもトースト通知は行われない。JSDocはこれを「Background Scriptなどでは false」と説明するが、実際のBackground Script実行時もuseToastStoreは静的importされた関数参照のままtypeofは'function'であり、この分岐が本番コードパスで実際にfalseになる経路は無いとみられる"
given = "@/stores/toast-notificationをuseToastStore=undefinedで再モックしたモジュールインスタンスでhandleErrorを呼ぶ"
verified = false
unverifiable_reason = "本ファイルの他テストはvi.mockでuseToastStoreを常にvi.fn()(=function型)としてモジュール先頭で固定モックしているため、通常のテスト構成内でこの分岐だけを分離して踏むにはvi.resetModules+動的importによるモジュール再構築が必要で、他テストのモック状態と干渉するリスクが高い。本番コードでもuseToastStoreは静的import後は常にfunction型であり、この分岐が実際に到達されるのはPiniaの循環import等の特殊なモジュールロード失敗時に限られ、公開APIのみからは意図的に再現できない"

[[condition]]
id = "can_use_toast.catch_returns_false"
target_function = "canUseToast"
source_lines = "241-243"
description = "typeof useToastStore の評価自体が例外を投げた場合(理論上はTDZ状態の循環import等)catchされfalseを返す"
given = "useToastStoreの参照自体がReferenceErrorを投げるような循環import状態"
verified = false
unverifiable_reason = "静的importされたuseToastStoreへの参照は通常のモジュールロード完了後は例外を投げないため、公開APIやモックの範囲では再現不可能。防御的コーディングであり、通常のテスト環境からは到達不能"
