# 検証対象: src/utils/error-handler.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B本展開)、utilsの残り分。
#
# 実装コメントとの差異:
# - handleSuccess/handleInfo のJSDoc(L132, L173)は「console.debug でログ出力」と書かれているが、
#   実装(L156, L195)はコメントのみで console.debug 呼び出しは削除されている。ErrorHandlerOptions.logToConsole
#   もこの2関数では分割代入されておらず一切参照されない(渡しても無効)。
# - handleDebug のJSDoc(L210)は「console.debug でログ出力のみ」と書かれているが、実装(L224-226)は完全な空実装。
# - canUseToast() のJSDoc(L231)は「Background Script などでは false を返す」と説明するが、実装(L236-244)は
#   `typeof useToastStore === 'function'` の判定のみであり、useToastStore は静的importされた関数参照なので
#   実行コンテキスト(Background/Content Script)に関わらず常に'function'型として解決され true を返す。
#   実際にBackground Script等でトースト表示が失敗する経路は、canUseToast()の分岐ではなく各handle*関数内の
#   try/catch(useToastStore()呼び出しやPinia未初期化時の例外を握りつぶす箇所)である。

[meta]
feature = "error-handler"
source_file = "src/utils/error-handler.ts"
verified = true
verified_at = "2026-08-28"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/utils/error-handler.test.ts"
source_hash = "e9433fbfd54ddbf1b5476e320ed5fdf00f34344b"
note = "verified=falseはcanUseToast関連2件のみ(下記参照)"

