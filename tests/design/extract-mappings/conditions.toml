# --- extractMappingsFromSearchPage(lang) ---

[[condition]]
id = "extract_search.builds_url_with_lang"
target_function = "extractMappingsFromSearchPage"
source_lines = "36-40"
description = "detectCardGameTypeの戻り値と`card_search.action?ope=1&request_locale=${lang}`をbuildApiUrlへ渡し、そのURLをfetchする"
given = "lang = 'ko', detectCardGameType returns 'rush', buildApiUrl returns mocked URL"
expect_return_shape = "fetch called with buildApiUrl('card_search.action?ope=1&request_locale=ko', 'rush')"

[[condition]]
id = "extract_search.response_not_ok_null"
target_function = "extractMappingsFromSearchPage"
source_lines = "40-44"
description = "fetchのresponse.okがfalseならエラーログを出してnullを返し、response.textは呼ばない"
given = "fetch resolves { ok: false, statusText: 'Bad Request' }"
expect_return = "null"

[[condition]]
id = "extract_search.empty_race_null"
target_function = "extractMappingsFromSearchPage"
source_lines = "50-65"
description = "HTML解析後、raceMappingのObject.keys(...).lengthが0なら警告ログを出してnullを返す"
given = "response.ok = true かつspeciesフィルタが無い、またはspeciesフィルタにliが無いHTML"
expect_return = "null"

[[condition]]
id = "extract_search.success_returns_all_maps"
target_function = "extractMappingsFromSearchPage"
source_lines = "50-74"
description = "raceMappingが非空ならrace/monsterType/attribute/spellEffect/trapEffectを含むオブジェクトを返す"
given = "各フィルタに有効なspan/input/valueが存在するHTML"
expect_return_shape = "{ race, monsterType, attribute, spellEffect, trapEffect }"

[[condition]]
id = "extract_search.catch_returns_null"
target_function = "extractMappingsFromSearchPage"
source_lines = "34-78"
description = "try内で例外がthrowされた場合、エラーログを出してnullを返す"
given = "fetch rejects or response.text rejects"
expect_return = "null"

