# 検証対象: src/composables/useSearchHistory.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330（Tier B展開）。検索履歴（お気に入り含む）をlocalStorageへ永続化するComposable。
# historyItems / loaded はモジュールトップレベルのシングルトン状態であり、Vueコンポーネント
# インスタンスをまたいで共有される点に注意（テストではvi.resetModules()+動的importで分離）。
#
# 到達不能/実質到達不能分岐:
# - toggleFavorite内の `if (item)`（96-100行目）:
#   直前に`index >= 0 && index < historyItems.value.length`を同期的にチェック済みであり、
#   historyItems.valueはpush/unshift/splice/filterのみで構築される非スパース配列のため、
#   このガードが通過した時点でhistoryItems.value[index]がundefinedになることはない。
#   noUncheckedIndexedAccess設定によりTypeScript上要求される防御コードであり実質到達不能。
# - updateResults内の `if (!item) return false`（116行目）:
#   同上の理由（直前に同じ形の範囲チェックが同期的に通過済み）で実質到達不能。

[meta]
feature = "use-search-history"
source_file = "src/composables/useSearchHistory.ts"
verified = true
verified_at = "2026-08-07"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/composables/useSearchHistory.test.ts"
source_hash = "c6f44e8e0cae40f66a49e61699dd853990e49cde"
note = "verified=falseは0件（到達不能分岐2件はcondition化せず上記コメントで説明するに留める）"

# --- loadFromStorage() ---

[[condition]]
id = "load_from_storage.parses_stored_json_when_present"
target_function = "loadFromStorage"
source_lines = "16-25"
description = "localStorage.getItem(STORAGE_KEY)が非nullを返す場合、その値をJSON.parseしてhistoryItems.valueへ代入する"
given = "localStorage[STORAGE_KEY] = 有効なJSON文字列"
expect_return_shape = "historyItems.value = JSON.parseした配列"

[[condition]]
id = "load_from_storage.no_data_keeps_default_empty_array"
target_function = "loadFromStorage"
source_lines = "18-24"
description = "localStorage.getItem(STORAGE_KEY)がnull（未保存）の場合、if(data)がfalseとなり代入処理をスキップする。historyItemsはref初期値の空配列のまま"
given = "localStorage[STORAGE_KEY] = 未設定"
expect_return_shape = "historyItems.value = []（refの初期値のまま変更されない）"

[[condition]]
id = "load_from_storage.catch_swallows_error_and_preserves_previous_state"
target_function = "loadFromStorage"
source_lines = "17-24"
description = "localStorage.getItemが例外を投げる、または保存データが不正なJSONでJSON.parseが例外を投げた場合、catchでconsole.errorのみ行い再throwしない。代入文（20行目）は例外発生時点で実行されないため、historyItems.valueは変更前の値のまま保持される"
given = "localStorage[STORAGE_KEY] = 不正なJSON文字列（例: '{invalid'）"
expect_no_throw = true
expect_return_shape = "historyItems.value は呼び出し前の値のまま（既定は[]）"

# --- saveToStorage() ---

[[condition]]
id = "save_to_storage.persists_current_history_as_json"
target_function = "saveToStorage"
source_lines = "28-34"
description = "localStorage.setItem(STORAGE_KEY, JSON.stringify(historyItems.value))でhistoryItems.valueの現在値を永続化する"
given = "historyItems.value に1件以上の履歴がある状態でsaveToStorageを呼ぶ（addToHistory等の内部呼び出し経由）"
expect_return_shape = "localStorage[STORAGE_KEY] = JSON.stringify(historyItems.value)と一致"

[[condition]]
id = "save_to_storage.catch_swallows_error_without_rethrow"
target_function = "saveToStorage"
source_lines = "29-33"
description = "localStorage.setItemが例外を投げる場合（容量超過等）、catchでconsole.errorのみ行い再throwしない。呼び出し元（addToHistory等）の処理は中断されない"
given = "localStorage.setItem がQuotaExceededError等をthrowする状況"
expect_no_throw = true

# --- useSearchHistory() 初回ロードガード ---

[[condition]]
id = "use_search_history.loads_once_via_module_level_flag"
target_function = "useSearchHistory"
source_lines = "38-41"
description = "モジュールトップレベルのloadedフラグがfalseの場合のみloadFromStorage()を実行しloadedをtrueにする。同一モジュールインスタンス内で2回目以降useSearchHistory()を呼んでもloadFromStorageは再実行されない（localStorageの外部変更は反映されない）"
given = "同一モジュールインスタンス内でuseSearchHistory()を複数回呼ぶ"
expect_return_shape = "2回目以降はloadFromStorageが呼ばれず、historyItems.valueは1回目ロード時点の状態を引き継ぐ"

