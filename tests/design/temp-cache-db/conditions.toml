# 検証対象: src/utils/temp-cache-db.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-323(Tier A本展開)。UnifiedCacheDBの後方互換ラッパーのため、委譲先内部の
# 詳細ロジックは重複せず、委譲・初期化待機・未実装互換APIの返り値を条件化する。
#
# 発見したデッドコード・到達不能分岐:
# - なし。
#
# 既存テストの説明文・アサーションの不正確さ:
# - saveToStorage/saveTempCacheDBToStorageの既存テストは「呼ばれることを確認」と
#   コメントしていたが、実際にはsaveUnifiedCacheDB呼び出しをassertしていなかった。
#   実装から読める委譲先呼び出しを明示的に検証するよう修正する。

[meta]
feature = "temp-cache-db"
source_file = "src/utils/temp-cache-db.ts"
verified = true
verified_at = "2026-08-06"
verified_by = "codex"
test_command = "mise run test:vitest -- tests/unit/utils/temp-cache-db.test.ts"
source_hash = "b9c7bc9f7edc61635c9dcfd6bb423c53465e0916"
note = "verified=falseは1件: set未初期化時のinitPromise rejection握りつぶし。モジュール内initPromiseの共有状態とfire-and-forget catchで、公開APIから副作用を確定検証しにくい"

# --- withInit(fn) ---

[[condition]]
id = "with_init.chrome_storage_uninitialized_initializes_once_then_runs"
target_function = "withInit"
source_lines = "17-27"
description = "chrome.storage.local が存在し、UnifiedCacheDBが未初期化で、initPromiseが未作成の場合は initUnifiedCacheDB() を呼んで待機してから fn() の戻り値を返す"
given = "chrome.storage.local が存在し unifiedDB.isInitialized() が false"
expect_return_shape = "initUnifiedCacheDB() resolve後に fn() が実行され、その戻り値で Promise がresolveする"

[[condition]]
id = "with_init.already_initialized_or_no_chrome_runs_without_init"
target_function = "withInit"
source_lines = "18-27"
description = "chrome.storage.local が存在しない、またはUnifiedCacheDBが初期化済みの場合は initUnifiedCacheDB() を呼ばずに fn() を実行して戻り値を返す"
given = "chrome が undefined、または unifiedDB.isInitialized() が true"
expect_return_shape = "fn() の戻り値で Promise がresolveする"

