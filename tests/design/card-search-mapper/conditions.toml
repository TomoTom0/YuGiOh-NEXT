# テスト: tests/unit/api/card-search-mapper.test.ts
#
# 経緯: tm TASK-476（src/__tests__ 配下から tests/unit への移動に伴うdesign整備）。
#
# 備考:
# - SORT_ORDER_TO_API_VALUE の実定義は src/api/mappers/card-search-mapper.ts にある
#   （src/api/card-search.ts 55行目が同定数をre-exportし、テストはそちら経由でimportする）。
#   TASK-476委任時点では card-search.ts 内の実装と想定していたが、実態は mappers/ 配下に
#   分離済みのため source_file を実定義元に向けている。
# - 本テストは src/types/card-maps.ts の *_ID_TO_INT 定数群（属性・種族・モンスタータイプ・
#   魔法/罠効果タイプ）も検証対象に含む。card-maps 単独のdesignは tests/design/README.md 1節
#   （types/定数のみのファイルは対象外）により存在しないため、本テストが検証する範囲に限り
#   本designの条件として管理する（card_maps系5条件。source_hashの管理外である点は下記note参照）。
# - 既存 tests/design/card-search/conditions.toml はAPI検索・パース処理（parse_*/build_params等）
#   を対象とし、マッピング定数の値対応は条件化していないため重複なし。
#   tests/design/search-options-builder/conditions.toml の sort.* は SORT_ORDER_TO_API_VALUE の
#   「利用側」のフォールバック（キー不在時 `|| 1`）を対象としており、マップ定義自体の
#   キー→値対応（本design）とは責務が分かれる。

