# 検証対象: src/components/DeckMetadataDescription.vue
#
# 経緯:
# - TASK-556（TASK-331 Tier C第11号・TASK-554第10号の後続）。DeckMetadata系5ファイル目（最終）の
#   Description（104行。script setupはL16-38、残りはtemplateとscoped CSS）。既存の専用
#   ユニットテストは無く（DeckMetadata.test.tsからstub経由で触れるのみ）、
#   tests/unit/components/DeckMetadataDescription.test.tsを新規作成
# - 本ファイル単独の要件定義・設計書は存在しないため、test-structure skill §1の
#   fallback（実装を一次情報として条件を起こす）位置づけで条件化。出典はsrc行参照+tm TASK-556
#
# 粒度方針（Tier C・第8号〜第10号条件書と同一）:
# - 1条件=1振る舞いclass。空文字列を含む初期値の列挙はテスト側fixture表（it.each）で持ち、
#   条件書には親条件のみ置く
# - template L8のv-model="value"はcomputed get（props.modelValue返却）/ set（emit）の糖衣で
#   あるため制御コンポーネント。入力時はemitペイロードを、表示はprops.modelValueに基づく
#   描画結果（textareaのDOM value・文字数カウント・maxlength属性）を観測し、vm内部状態
#   （computed value）は直接参照しない
# - defineProps/defineEmits定義・静的SCSS・固定ラベル/placeholder文字列は§8「書かない」に
#   該当するため除外
#
# 線引き（隣接条件書との）:
# - 親DeckMetadataの配線契約（update:modelValueのv-model:commentによるlocalComment反映と
#   updateCommentのstore書き込み）はdeck-metadata条件書（TASK-532）の
#   comment-vmodel-syncs-local-and-storeが保証。本書はDescription自身の表示・emit契約のみ
# - DECK_FIELD_LIMITS（src/types/deck.ts）の定数本体は隣接モジュールの責務。本書は実物を
#   importした結果のUI反映（文字数カウント・maxlength属性）のみ検証する
#
# 不具合疑い: 特になし（制御コンポーネントとして標準的な実装のため分離起票なし）

