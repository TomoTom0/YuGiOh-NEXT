# 検証対象: src/composables/practice/usePracticeDragState.ts
#
# tests/design/README.md の方針に基づき、実装コードを直接読んで転記した条件一覧。
# TASK-330(Tier B展開)、プラクティス盤面のカードドラッグ状態管理composable。
#
# モジュール共有stateに関する注記:
# - draggingCardId等の全refと globalDragoverListener/globalDragendListener/keydownRotateListener/
#   contextmenuListener/rotateTimeoutId/lastAutoScrollTime はモジュールスコープの変数であり、
#   usePracticeDragState()を何度呼んでも同一インスタンスを返す（Vueコンポーザブルとしては非典型
#   のシングルトンパターン）。そのためテスト間でstateとdocumentへ登録したイベントリスナーが
#   リークしないよう、各テストでendDrag()相当のクリーンアップとタイマーのクリアが必須。
#
# 到達不能/実質到達不能分岐:
# - なし。start_drag.contextmenu_after_drag_cleared_is_noop（下記id）はendDrag()を経由する通常の
#   ドラッグ終了フローでは到達しない（endDragはcontextmenuListenerが残っていれば必ず
#   rotateTimeoutIdへ250ms後クリーンアップ用のsetTimeoutを積むため、draggingCardId=nullと
#   rotateTimeoutId=nullが同時に成立する瞬間が生まれない）。ただし公開関数clearDragCard()を
#   直接呼べばdraggingCardIdだけをnullにできるため、公開API経由では到達可能。実アプリ内では
#   clearDragCard()の呼び出し元が現状存在しない（src全体でexport定義のみでimport側の使用箇所なし）。
#
# 既知の設計上の注意点（バグではないが複雑な挙動）:
# - endDrag()呼び出し直後にdragendイベントが発火する典型シーケンス（drop→endDrag→dragend）では、
#   endDragが仕込んだ250ms用setTimeoutの参照をrotateTimeoutIdに保持したまま、dragendハンドラが
#   200ms用の新しいsetTimeoutでrotateTimeoutIdを上書きする。前者のタイマーはclearTimeoutされず
#   孤立するが、発火時にcleanupContextmenuListenerのnullガードにより実害なく無視される
#   （contextmenuListenerが既にnull化されていればremoveEventListenerも呼ばれない）。

[meta]
feature = "use-practice-drag-state"
source_file = "src/composables/practice/usePracticeDragState.ts"
verified = true
verified_at = "2026-08-07"
verified_by = "claude"
test_command = "mise run test:vitest -- tests/unit/composables/usePracticeDragState.test.ts"
source_hash = "34e0cdb1b3dfab8978db07f3ccbc77e3e12bbfb7"
note = "verified=falseは0件"

# --- performAutoScroll(clientY)（非export、startDragが登録するdragoverリスナー経由でのみ到達） ---

[[condition]]
id = "auto_scroll.throttle_skips_within_50ms"
target_function = "performAutoScroll"
source_lines = "23-25"
description = "直前の自動スクロール実行から50ms未満で呼ばれた場合、lastAutoScrollTimeを更新せず、コンテナのscrollTopも変更しない"
given = "dragoverイベントを50ms未満の間隔で連続発火し、2回目もスクロール条件（clientYがしきい値内）を満たす"
expect_state = "2回目の呼び出しではscrollTopが変化しない"

[[condition]]
id = "auto_scroll.bottom_threshold_scrolls_down"
target_function = "performAutoScroll"
source_lines = "26-31"
description = ".practice-field-container各要素について、clientYがrect.bottom-80より下ならscrollTopを8増やす"
given = "前回実行から50ms以上経過、clientY > rect.bottom - 80"
expect_state = "対象要素のscrollTopが+8される"

[[condition]]
id = "auto_scroll.top_threshold_scrolls_up"
target_function = "performAutoScroll"
source_lines = "26,32-33"
description = ".practice-field-container各要素について、clientYがrect.top+80より上ならscrollTopを8減らす"
given = "前回実行から50ms以上経過、clientY < rect.top + 80"
expect_state = "対象要素のscrollTopが-8される"

[[condition]]
id = "auto_scroll.middle_zone_no_scroll"
target_function = "performAutoScroll"
source_lines = "26-34"
description = "clientYがrect.top+80〜rect.bottom-80の中間帯にある場合、scrollTopは変更されない"
given = "前回実行から50ms以上経過、rect.top+80 <= clientY <= rect.bottom-80"
expect_state = "対象要素のscrollTopが変化しない"

