[[condition]]
id = "start_drag.dragend_schedules_cleanup_when_right_click_enabled"
target_function = "startDrag"
source_lines = "72-85"
description = "documentのdragendイベント発火時、自身のdragendリスナーを自己解除する。onRightClickが指定されていれば200ms後にcontextmenuリスナーを解除するsetTimeoutを仕込み、指定されていなければ何も仕込まない"
