[[condition]]
id = "start_drag.right_click_listeners_registered_only_when_callback_given"
target_function = "startDrag"
source_lines = "88-111"
description = "onRightClickが渡された場合のみcontextmenu/keydownリスナーをdocumentへ登録する。渡されない場合はどちらも登録しない"
given = "startDragをonRightClickなしで呼ぶ"
expect_state = "keydown('r')やcontextmenuイベントを発火してもonRightClickは存在しないため何も起きない（postDragRotationも変化しない）"

[[condition]]
id = "start_drag.contextmenu_within_rotate_timeout_sets_post_drag_rotation"
target_function = "startDrag"
source_lines = "91-96"
