# 検証対象: src/utils/loader-elements.ts
#
# 経緯: TASK-510（ロード画面の最初の描画前表示）実装へのコードレビュー指摘3対応。
# loader.js と content.js が共有する要素ID（EXTENSION_IDS.loading）について、
# content側の削除（removeLoaderDerivedElements）・takeover が同IDの他人要素を
# 保護していなかった（loader側はフェイルセーフのownElements参照ベース保護を持つ
# のに不整合）ため、識別属性 data-ygo-next-loader="1" によるゲートを導入した。
# content/index.ts はトップレベル副作用のため直接unitテストできないため、ゲート
# ロジックを本ユーティリティへ切り出して検証する（tests/design/content-index/
# conditions.toml の方針との整合: 配線はE2E、ロジックはunit）。
#
# PR#156レビュー指摘2対応: 他人要素との同ID衝突時に content/index.ts が同IDの
# 別要素を新規生成すると重複IDが並存し、getElementById ベースの cleanup
# （DeckEditLayout.vue・edit-ui/index.ts・removeLoaderDerivedElements）が文書順
# 最初の他人要素しか捕捉できず拡張由来overlayが残存した。lookup
# （findLoaderOverlay / findLoaderEarlyHide）と removeLoaderDerivedElements を
# 識別属性セレクタ（#id[data-ygo-next-loader]）ベースに変更して解消した。
#
# 出典: TASK-510技術設計（docs/design/loader-early-loading-tech.md）§9 追補（コード
# レビュー指摘3）。loader.js側の属性付与は tests/design/loader-early-loading/
# conditions.toml の create-loader.own-elements-carry-loader-attribute で検証する。

