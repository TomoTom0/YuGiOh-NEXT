name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # tests/unit/scripts/verify-conditions.test.ts が `uv run python` で
      # scripts/design/verify-conditions.py を起動するため導入する
      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          # pyproject.toml 等の依存ファイルが無いため cache 対象が無い (既定の auto では警告のみ出る)
          enable-cache: false

      - name: Install dependencies
        run: pnpm install

      # 失敗を job に伝播させるため continue-on-error は付けない (仕様: docs/dev/ci.md)。
      # 各 step の conclusion を Summary step から steps.<id>.conclusion で参照する
      - name: Build
        id: build
        run: pnpm run build:prod

      - name: Run unit tests
        id: unit-tests
        run: pnpm exec vitest run --reporter=verbose

      - name: Type check (vue-tsc)
        id: type-check
        run: pnpm run type-check
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: dist/
          retention-days: 7
      
      # always() で必ず実行するが、失敗があれば 0 以外で終わって失敗を握りつぶさない
      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_CONCLUSION: ${{ steps.build.conclusion }}
          UNIT_TESTS_CONCLUSION: ${{ steps.unit-tests.conclusion }}
          TYPE_CHECK_CONCLUSION: ${{ steps.type-check.conclusion }}
        run: bash scripts/ci-summary.sh
