# 【重要】default 値（feature flag の有効/無効）は configs/features.toml が
# Single Source of Truth。このファイルでは管理しない（二重管理を防ぐため）。
# category / ui / note のみをこのファイルで管理する。

[shuffle-sort]
category = 1
ui = "src/options/components/sections/ShuffleSection.vue"

