[chat]
category = 4
ui = "none"
note = "意図的な方針として、devビルドを含め現時点では無効にしている。UI導線が存在しないのはこの方針の結果であり、原因ではない。services/llm/*・ChatPanel.vue等の実装自体は存在するが、公開準備が整うまでは対応不要。"

